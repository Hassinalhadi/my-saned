              for item in ["SanedAssistant-98-OpenSource", "app", "build.gradle.kts", "settings.gradle.kts", "gradle.properties"]:
                  if os.path.isfile(item):
                      zout.write(item)
                  elif os.path.isdir(item):
                      for root_dir, _, files in os.walk(item):
                          for f in files:
                              fp = os.path.join(root_dir, f)
                              zout.write(fp)

          print("Successfully synced zero-crash LSPosed hooks, all 4 sources, icons, audio controls, and UI switches!")
          PYEOF

      - name: Commit Open-Source Parity Sync to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/ || true
          if ! git diff --cached --quiet; then
            git commit -m "fix: match exact SanedAssistant-98 LSPosed hook surface to prevent net.jahez.fleets crash [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Build APK with Gradle
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.nonTransitiveRClass=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
          gradle assembleRelease --stacktrace || gradle assembleDebug --stacktrace

      - name: Sign & Prepare Final APK
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found!"
            exit 1
          fi
          echo "Found built APK: $APK_PATH"

          if [[ "$APK_PATH" == *"unsigned"* ]]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            zipalign -v -p 4 "$APK_PATH" app-aligned.apk
            apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out SanedAssistant-98-OpenSource-Full.apk app-aligned.apk
          else
            cp "$APK_PATH" SanedAssistant-98-OpenSource-Full.apk
          fi

      - name: Upload Built APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SanedAssistant-98-OpenSource-APK
          path: SanedAssistant-98-OpenSource-Full.apk

      - name: Upload Full Open-Source Code Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SanedAssistant-98-OpenSource-SourceCode
          path: SanedAssistant-98-OpenSource.zip

      - name: Publish Release to GitHub
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0-build-${{ github.run_number }}
          name: "Saned Assistant v3.0.0 (100% Open-Source Parity #${{ github.run_number }})"
          body: |
            ### التحديثات في هذه النسخة (مطابقة 100% للنسخة 98 مفتوحة المصدر بدون أي كراش في LSPosed)
            - **إصلاح جذري لمشكلة الكراش في `net.jahez.fleets` داخل LSPosed**:
              1. فصل مرحلة `onPackageLoaded` (تشغيل `Lvh1` فقط لحجب `libjahez_fleets.so` والدوال الـ Native) عن مرحلة `onPackageReady` تماماً كما في `Ldv1` داخل `SanedAssistant-98-7bac1ec.apk`.
              2. إزالة الـ Hooks الدخيلة التي كانت تسبب انهيار التطبيق (`hookOkHttp` Proxy الذي كان يرجع `null` في `Interceptor.intercept` ويسبب `NullPointerException`، و `hookSQLite`، و `hookSharedPreferences`، و `WindowManagerGlobal`، و `TextView.setText`، و `Runtime.exec`).
              3. قصر فحص `getApplicationInfo`/`getPackageInfo` على بيئة `Vector` فقط (`Lb51.b`) وعدم اعتراضها تحت `LSPosed`.
              4. تخزين `EncryptedSharedPreferences` مرة واحدة في الذاكرة (`Ljh.e`) وفتح قاعدة بيانات `dispatches_db` بوضع القراءة الآمن (`OPEN_READONLY | NO_LOCALIZED_COLLATORS`) فقط (`Lb11.f`).
          files: |
            SanedAssistant-98-OpenSource-Full.apk
            SanedAssistant-98-OpenSource.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
