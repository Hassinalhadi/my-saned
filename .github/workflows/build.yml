              uint32_t cd_offset = 0;
              for (long i = static_cast<long>(tail_len) - 22; i >= 0; --i) {{
                  if (tail[i] == 0x50 && tail[i + 1] == 0x4b && tail[i + 2] == 0x05 && tail[i + 3] == 0x06) {{
                      cd_offset = static_cast<uint32_t>(tail[i + 16]) |
