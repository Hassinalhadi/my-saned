                      android:name="com.google.android.geo.API_KEY"
                      android:value="AIzaSyDB6gdCIHSWCkgQwX1_GI_Kl9dov9ax0yg" />

                  <provider
                      android:name="io.github.libxposed.service.XposedProvider"
                      android:authorities="dev.jing.sanedhook.XposedService"
