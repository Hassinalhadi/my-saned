                                          }
                                          if (apiInFlightIds.isEmpty()) {
                                              fetchOrderCustomerDetailsAsync(orderIdNum, force = (delayMs <= 500L))
                                          }
                                      }
                                  }"""

          assert old_post_accept_storm in order_src, "old_post_accept_storm not found"
          order_src = order_src.replace(old_post_accept_storm, new_post_accept_storm, 1)

          old_err_fallback = """                    } else {
                                  if (orderIdInt != 0 && (lastErrCode <= 0 || lastErrCode == 401 || lastErrCode in 500..599)) {
