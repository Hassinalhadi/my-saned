              shutil.copyfile('app/src/main/res/drawable/ic_launcher_original.jpg', 'keygen/src/main/res/drawable/ic_launcher_original.jpg')
          os.makedirs('SanedAssistant-98-OpenSource/reconstructed-kotlin-src', exist_ok=True)
          shutil.copytree('app/src/main', 'SanedAssistant-98-OpenSource/reconstructed-kotlin-src/main', dirs_exist_ok=True)
          shutil.make_archive('SanedAssistant-98-OpenSource', 'zip', 'SanedAssistant-98-OpenSource')
          print('Successfully synced all 13 Kotlin files with Navigation Log [NavLog] & Pre-Pickup Customer Navigation!')
