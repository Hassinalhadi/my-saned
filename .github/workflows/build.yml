          new_exact_sql_exec = """                // Pre-scan vendor table (SELECT * FROM vendor) so restaurant name (e.g. ALBAIK - البيك) is ALWAYS extracted regardless of column renames!
                          var venCursor: Cursor? = null
                          try {
                              venCursor = openedDb.rawQuery("SELECT * FROM vendor", null)
                              val vCols = venCursor.columnNames ?: emptyArray()
                              val vIdIdx = vCols.indexOfFirst { it.equals("dispatchId", ignoreCase = true) || it.equals("id", ignoreCase = true) || it.equals("vendorId", ignoreCase = true) }
                              if (vIdIdx >= 0) {
                                  while (venCursor.moveToNext()) {
                                      val dId = cursorStringOrNull(venCursor, vIdIdx) ?: cursorDoubleOrNull(venCursor, vIdIdx)?.toLong()?.toString() ?: continue
                                      val nameParts = mutableListOf<String>()
                                      for (ci in vCols.indices) {
                                          if (ci == vIdIdx) continue
                                          val cn = vCols[ci].lowercase(Locale.US)
                                          if (cn.contains("name") || cn.contains("title") || cn.contains("vendor") || cn.contains("store") || cn.contains("branch") || cn.contains("rest")) {
                                              val s = cursorStringOrNull(venCursor, ci)
                                              if (!s.isNullOrEmpty() && !s.startsWith("http") && !s.all { it.isDigit() } && !nameParts.contains(s)) {
                                                  nameParts.add(s)
                                              }
                                          }
                                      }
                                      if (nameParts.isNotEmpty()) {
                                          val combinedRest = nameParts.take(2).joinToString(" - ")
                                          vendorNameCache[dId] = combinedRest
                                      }
                                  }
                              }
                          } catch (_: Throwable) {
                          } finally {
                              try { venCursor?.close() } catch (_: Throwable) {}
                          }

                          // Pre-scan client table (SELECT * FROM client) so customer phone (Call Customer / WhatsApp) & subscriberName are ALWAYS extracted!
                          var cliCursor: Cursor? = null
                          try {
                              cliCursor = openedDb.rawQuery("SELECT * FROM client", null)
                              val cCols = cliCursor.columnNames ?: emptyArray()
                              val cIdIdx = cCols.indexOfFirst { it.equals("dispatchId", ignoreCase = true) || it.equals("id", ignoreCase = true) || it.equals("clientId", ignoreCase = true) }
                              if (cIdIdx >= 0) {
                                  while (cliCursor.moveToNext()) {
                                      val dId = cursorStringOrNull(cliCursor, cIdIdx) ?: cursorDoubleOrNull(cliCursor, cIdIdx)?.toLong()?.toString() ?: continue
                                      var cNameVal = ""
                                      var cPhoneVal = ""
                                      for (ci in cCols.indices) {
                                          if (ci == cIdIdx) continue
                                          val cn = cCols[ci].lowercase(Locale.US)
                                          val s = cursorStringOrNull(cliCursor, ci) ?: continue
                                          if (cn.contains("phone") || cn.contains("mobile") || cn.contains("contact") || cn.contains("tel")) {
                                              if (cPhoneVal.isEmpty() && s.any { it.isDigit() }) cPhoneVal = s
                                          } else if (cn.contains("name") || cn.contains("subscriber") || cn.contains("client") || cn.contains("customer")) {
                                              if (cNameVal.isEmpty() && !s.startsWith("http")) cNameVal = s
                                          }
                                      }
                                      if (cPhoneVal.isNotEmpty() || cNameVal.isNotEmpty()) {
                                          val prev = customerDetailsCache[dId]
                                          customerDetailsCache[dId] = Triple(
                                              cNameVal.ifEmpty { prev?.first ?: "" },
                                              cPhoneVal.ifEmpty { prev?.second ?: "" },
                                              prev?.third ?: 0.0
                                          )
                                      }
                                  }
                              }
                          } catch (_: Throwable) {
                          } finally {
                              try { cliCursor?.close() } catch (_: Throwable) {}
                          }

                          // Try exactSql first, and also scan dispatch_info directly so even if exactSql fails on a column rename, all active orders get enriched!
                          try {
