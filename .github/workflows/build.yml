          write_kt('app/src/main/java/dev/saned/assistant/HookEntry.kt', r'''package dev.saned.assistant

          import android.content.Context
          import android.content.pm.ApplicationInfo
          import android.os.Build
          import dev.jing.sanedhook.util.Native
          import io.github.libxposed.api.XposedModule
          import io.github.libxposed.api.XposedModuleInterface
          import java.util.concurrent.atomic.AtomicBoolean

          class HookEntry : XposedModule() {

              private val isAppHooked = AtomicBoolean(false)
              @Volatile private var detectedVersionCode: Long = 0L

              override fun onModuleLoaded(param: XposedModuleInterface.ModuleLoadedParam) {
                  super.onModuleLoaded(param)
                  DiagnosticLogger.xposedModule = this
                  DiagnosticLogger.logStep("HookEntry", "onModuleLoaded process=${param.processName} framework=$frameworkName")
              }

              override fun onPackageLoaded(param: XposedModuleInterface.PackageLoadedParam) {
                  if (param.packageName != "net.jahez.fleets" || !param.isFirstPackage) return
                  DiagnosticLogger.installCrashHandler(this, "onPackageLoaded")
                  DiagnosticLogger.syncHookToggles(this)

                  val vCode = resolveJahezVersionCode(param.applicationInfo)
                  if (vCode > 0L) detectedVersionCode = vCode
                  val isSupported = PackageCloaker.checkVersionSupported(detectedVersionCode)
                  DiagnosticLogger.logStep(
            "onPackageLoaded",
            "pkg=${param.packageName} vCode=$detectedVersionCode supported=$isSupported strict=${OrderInterceptor.isStrictVersionCheck} earlyToggle=${DiagnosticLogger.hookEarlyCloaker}"
                  )
                  if (!isSupported && OrderInterceptor.isStrictVersionCheck) {
            DiagnosticLogger.logWarn("onPackageLoaded", "Stopping early hook because StrictVersionCheck is enabled and vCode=$detectedVersionCode is not in [40089, 40093, 40099]")
            return
                  }
                  if (DiagnosticLogger.hookEarlyCloaker) {
            param.defaultClassLoader?.let { cl ->
                PackageCloaker.hookEarly(this, cl)
            }
                  } else {
            DiagnosticLogger.logWarn("onPackageLoaded", "Skipped PackageCloaker.hookEarly (disabled by user toggle)")
                  }
              }

              override fun onPackageReady(param: XposedModuleInterface.PackageReadyParam) {
                  if (param.packageName != "net.jahez.fleets" || !param.isFirstPackage) return
                  DiagnosticLogger.installCrashHandler(this, "onPackageReady")
                  DiagnosticLogger.syncHookToggles(this)

                  if (detectedVersionCode <= 0L) {
            detectedVersionCode = resolveJahezVersionCode(param.applicationInfo)
                  }
                  val isSupported = OrderInterceptor.checkJahezVersionSupport(detectedVersionCode)
                  DiagnosticLogger.logStep(
            "onPackageReady",
            "pkg=${param.packageName} vCode=$detectedVersionCode supported=$isSupported cl=${param.classLoader?.javaClass?.name}"
                  )
                  if (!isSupported && OrderInterceptor.isStrictVersionCheck) {
            OrderInterceptor.notifyUnsupportedVersion(detectedVersionCode)
            return
                  }
                  val cl = param.classLoader ?: return
                  if (DiagnosticLogger.hookEarlyCloaker) {
            PackageCloaker.hookEarly(this, cl)
                  }
                  initAppHooks(cl)
              }

              private fun resolveJahezVersionCode(appInfo: ApplicationInfo?): Long {
                  if (appInfo != null) {
            for (fieldName in listOf("longVersionCode", "versionCode")) {
                try {
                    val f = appInfo.javaClass.getField(fieldName).apply { isAccessible = true }
                    val v = (f.get(appInfo) as? Number)?.toLong() ?: 0L
                    if (v > 0L) return v
                } catch (_: Throwable) {}
            }
                  }
                  for (ctx in listOfNotNull(OrderInterceptor.resolveApplicationContext(), resolveSystemContext())) {
            try {
                val pInfo = ctx.packageManager.getPackageInfo("net.jahez.fleets", 0)
                val v = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) pInfo.longVersionCode else @Suppress("DEPRECATION") pInfo.versionCode.toLong()
                if (v > 0L) return v
            } catch (_: Throwable) {}
                  }
                  return 0L
              }

              private fun resolveSystemContext(): Context? = try {
                  val atClass = Class.forName("android.app.ActivityThread")
                  val currentAt = atClass.getMethod("currentActivityThread").invoke(null)
                  atClass.getMethod("getSystemContext").invoke(currentAt) as? Context
              } catch (_: Throwable) { null }

              fun initAppHooks(classLoader: ClassLoader) {
                  if (!isAppHooked.compareAndSet(false, true)) return
                  try {
            val remotePrefs = getRemotePreferences("sanedhook_settings")
            DiagnosticLogger.syncHookToggles(this, remotePrefs)
            DeviceSpoofer.initRemotePrefs(remotePrefs)
            LocationEngine.initRemotePrefs(remotePrefs)
            OrderInterceptor.initRemotePrefs(remotePrefs)
            DiagnosticLogger.logStep("initAppHooks", "RemotePreferences initialized successfully")
                  } catch (t: Throwable) {
            DiagnosticLogger.logError("initAppHooks:RemotePrefs", "Failed to read RemotePreferences (using ContentProvider/file fallback)", t)
                  }
                  try {
            Native.safeA(this, "net.jahez.fleets")
            Native.safeC(this, "net.jahez.fleets", OrderInterceptor.licenseToken, OrderInterceptor.licenseBoundId, 0L)
                  } catch (_: Throwable) {}

                  if (DiagnosticLogger.hookSecCloaker) {
            try {
                PackageCloaker.hook(this, classLoader)
                DiagnosticLogger.logStep("initAppHooks", "PackageCloaker.hook installed")
            } catch (t: Throwable) {
                DiagnosticLogger.logError("PackageCloaker.hook", "Exception in PackageCloaker.hook", t)
            }
                  } else {
            DiagnosticLogger.logWarn("initAppHooks", "Skipped PackageCloaker.hook (disabled by user toggle)")
                  }

                  if (DiagnosticLogger.hookLocation) {
            try {
                LocationEngine.hook(this, classLoader)
                DiagnosticLogger.logStep("initAppHooks", "LocationEngine.hook installed")
            } catch (t: Throwable) {
                DiagnosticLogger.logError("LocationEngine.hook", "Exception in LocationEngine.hook", t)
            }
                  } else {
            DiagnosticLogger.logWarn("initAppHooks", "Skipped LocationEngine.hook (disabled by user toggle)")
                  }

                  if (DiagnosticLogger.hookDeviceSpoofer) {
            try {
                DeviceSpoofer.hook(this, classLoader)
                DiagnosticLogger.logStep("initAppHooks", "DeviceSpoofer.hook installed")
            } catch (t: Throwable) {
                DiagnosticLogger.logError("DeviceSpoofer.hook", "Exception in DeviceSpoofer.hook", t)
            }
                  } else {
            DiagnosticLogger.logWarn("initAppHooks", "Skipped DeviceSpoofer.hook (disabled by user toggle)")
                  }

                  if (DiagnosticLogger.hookOrders) {
            try {
                OrderInterceptor.hook(this, classLoader)
                DiagnosticLogger.logStep("initAppHooks", "OrderInterceptor.hook installed")
            } catch (t: Throwable) {
                DiagnosticLogger.logError("OrderInterceptor.hook", "Exception in OrderInterceptor.hook", t)
            }
                  } else {
            DiagnosticLogger.logWarn("initAppHooks", "Skipped OrderInterceptor.hook (disabled by user toggle)")
                  }

                  if (DiagnosticLogger.hookBootstrapLoop) {
            try {
                OrderInterceptor.startBootstrapLoop(this, classLoader)
                DiagnosticLogger.logStep("initAppHooks", "OrderInterceptor.startBootstrapLoop started")
            } catch (t: Throwable) {
                DiagnosticLogger.logError("OrderInterceptor.startBootstrapLoop", "Exception starting bootstrap loop", t)
            }
                  } else {
            DiagnosticLogger.logWarn("initAppHooks", "Skipped OrderInterceptor.startBootstrapLoop (disabled by user toggle)")
                  }
              }
          }
          ''')


          write_kt('app/src/main/java/dev/saned/assistant/LocationEngine.kt', r'''package dev.saned.assistant

          import android.content.Context
          import android.content.SharedPreferences
          import android.location.Location
          import android.location.LocationListener
          import android.location.LocationManager
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import io.github.libxposed.api.XposedInterface
          import io.github.libxposed.api.XposedModule
          import org.json.JSONObject
          import java.io.File
          import kotlin.math.*

          object LocationEngine {

              @Volatile var isMasterRunning: Boolean = true
              @Volatile var isFakeLocationEnabled: Boolean = false
              @Volatile var isFixLocationUnknownEnabled: Boolean = false
              @Volatile var isTripSimulationActive: Boolean = false
              @Volatile var currentLat: Double = 0.0
              @Volatile var currentLng: Double = 0.0
              @Volatile var lastRealLat: Double = 0.0
              @Volatile var lastRealLng: Double = 0.0

              private var remotePrefs: SharedPreferences? = null
              private val reentrancyDepth = object : ThreadLocal<Int>() {
                  override fun initialValue(): Int = 0
              }
              @Volatile private var isSeeded = false

              fun initRemotePrefs(prefs: SharedPreferences) {
                  remotePrefs = prefs
                  syncFromPrefs()
                  try {
            prefs.registerOnSharedPreferenceChangeListener { _, _ ->
                syncFromPrefs()
            }
                  } catch (_: Throwable) {}
              }

              private fun syncFromPrefs() {
                  remotePrefs?.let { p ->
            isMasterRunning = p.getBoolean("master_running", p.getBoolean("enabled", isMasterRunning))
            isFakeLocationEnabled = p.getBoolean("fake_location_enabled", isFakeLocationEnabled)
            isFixLocationUnknownEnabled = p.getBoolean("fix_location_unknown", p.getBoolean("high_accuracy_location", isFixLocationUnknownEnabled))
            val lat = p.getString("fake_lat", null)?.toDoubleOrNull()
            val lng = p.getString("fake_lng", null)?.toDoubleOrNull()
            if (lat != null && lat != 0.0) currentLat = lat
            if (lng != null && lng != 0.0) currentLng = lng
                  }
              }

              fun syncLocationSettings() {
                  syncFromPrefs()
                  try {
            val f = File("/data/local/tmp/saned_config.json")
            if (f.exists()) {
                val json = JSONObject(f.readText())
                isMasterRunning = json.optBoolean("master_running", json.optBoolean("enabled", isMasterRunning))
                isFakeLocationEnabled = json.optBoolean("fake_location_enabled", isFakeLocationEnabled)
                isFixLocationUnknownEnabled = json.optBoolean("fix_location_unknown", isFixLocationUnknownEnabled)
                val lat = json.optDouble("fake_lat", currentLat)
                val lng = json.optDouble("fake_lng", currentLng)
                if (!lat.isNaN() && lat != 0.0) currentLat = lat
                if (!lng.isNaN() && lng != 0.0) currentLng = lng
            }
                  } catch (_: Throwable) {}
              }

              private fun recordRealLocation(loc: Location?) {
                  if (loc == null) return
                  val depth = reentrancyDepth.get() ?: 0
                  reentrancyDepth.set(depth + 1)
                  try {
            val lat = loc.latitude
            val lng = loc.longitude
            if (lat != 0.0 && lng != 0.0) {
                lastRealLat = lat
                lastRealLng = lng
            }
                  } catch (_: Throwable) {
                  } finally {
            reentrancyDepth.set(depth)
                  }
              }

              fun seedLocationManager(context: Context) {
                  if (isSeeded) return
                  isSeeded = true
                  Handler(Looper.getMainLooper()).post {
            try {
                val lm = context.getSystemService(Context.LOCATION_SERVICE) as? LocationManager ?: return@post
                val providers = listOf("fused", "gps", "network")
                val enabledProviders = providers.filter {
                    try { lm.isProviderEnabled(it) } catch (_: Throwable) { false }
                }

                val depth = reentrancyDepth.get() ?: 0
                reentrancyDepth.set(depth + 1)
                try {
                    var bestLoc: Location? = null
                    for (prov in providers) {
                        val l = try { lm.getLastKnownLocation(prov) } catch (_: Throwable) { null }
                        if (l != null && (bestLoc == null || l.time > bestLoc.time)) {
                            bestLoc = l
                        }
                    }
                    if (bestLoc != null) {
                        recordRealLocation(bestLoc)
                    }
                } finally {
                    reentrancyDepth.set(depth)
                }

                val passiveListener = object : LocationListener {
                    override fun onLocationChanged(location: Location) {
                        recordRealLocation(location)
                    }
                    override fun onStatusChanged(provider: String?, status: Int, extras: Bundle?) {}
                    override fun onProviderEnabled(provider: String) {}
                    override fun onProviderDisabled(provider: String) {}
                }
                try {
                    lm.requestLocationUpdates("passive", 1000L, 0f, passiveListener, Looper.getMainLooper())
                } catch (_: Throwable) {}

                if (isMasterRunning && isFixLocationUnknownEnabled && enabledProviders.isNotEmpty()) {
                    val activeListener = object : LocationListener {
                        override fun onLocationChanged(location: Location) {
                            recordRealLocation(location)
                        }
                        override fun onStatusChanged(provider: String?, status: Int, extras: Bundle?) {}
                        override fun onProviderEnabled(provider: String) {}
                        override fun onProviderDisabled(provider: String) {}
                    }
                    for (prov in enabledProviders) {
                        try {
                            lm.requestLocationUpdates(prov, 2000L, 0f, activeListener, Looper.getMainLooper())
                        } catch (_: Throwable) {}
                    }
                }
            } catch (_: Throwable) {}
                  }
              }

              fun calculateDistance(lat1: Double, lon1: Double, lat2: Double, lon2: Double): Double {
                  val r = 6371.0
                  val dLat = Math.toRadians(lat2 - lat1)
                  val dLon = Math.toRadians(lon2 - lon1)
                  val a = sin(dLat / 2).pow(2.0) + cos(Math.toRadians(lat1)) * cos(Math.toRadians(lat2)) * sin(dLon / 2).pow(2.0)
                  val c = 2 * atan2(sqrt(a), sqrt(1 - a))
                  return r * c
              }

              fun hook(module: XposedModule, classLoader: ClassLoader) {
                  try {
            val mLat = Location::class.java.getDeclaredMethod("getLatitude")
            module.hook(mLat).intercept(object : XposedInterface.Hooker {
                override fun intercept(chain: XposedInterface.Chain): Any? {
                    if ((reentrancyDepth.get() ?: 0) > 0) return chain.proceed()
                    if (isMasterRunning && isFakeLocationEnabled && currentLat != 0.0) {
                        return currentLat
                    }
                    return chain.proceed()
                }
            })
                  } catch (_: Throwable) {}

                  try {
            val mLng = Location::class.java.getDeclaredMethod("getLongitude")
            module.hook(mLng).intercept(object : XposedInterface.Hooker {
                override fun intercept(chain: XposedInterface.Chain): Any? {
                    if ((reentrancyDepth.get() ?: 0) > 0) return chain.proceed()
                    if (isMasterRunning && isFakeLocationEnabled && currentLng != 0.0) {
                        return currentLng
                    }
                    return chain.proceed()
                }
            })
                  } catch (_: Throwable) {}

                  try {
            val mSpeed = Location::class.java.getDeclaredMethod("getSpeed")
            module.hook(mSpeed).intercept(object : XposedInterface.Hooker {
                override fun intercept(chain: XposedInterface.Chain): Any? {
                    if (isMasterRunning && isFakeLocationEnabled && isTripSimulationActive) return 4.5f
                    return chain.proceed()
                }
            })
                  } catch (_: Throwable) {}

                  try {
            val mHasSpeed = Location::class.java.getDeclaredMethod("hasSpeed")
            module.hook(mHasSpeed).intercept(object : XposedInterface.Hooker {
                override fun intercept(chain: XposedInterface.Chain): Any? {
                    if (isMasterRunning && isFakeLocationEnabled && isTripSimulationActive) return true
                    return chain.proceed()
                }
            })
                  } catch (_: Throwable) {}

                  try {
            val mBearing = Location::class.java.getDeclaredMethod("getBearing")
            module.hook(mBearing).intercept(object : XposedInterface.Hooker {
                override fun intercept(chain: XposedInterface.Chain): Any? {
                    if (isMasterRunning && isFakeLocationEnabled && isTripSimulationActive) return 120.0f
                    return chain.proceed()
                }
            })
                  } catch (_: Throwable) {}

                  try {
            val mHasBearing = Location::class.java.getDeclaredMethod("hasBearing")
            module.hook(mHasBearing).intercept(object : XposedInterface.Hooker {
                override fun intercept(chain: XposedInterface.Chain): Any? {
                    if (isMasterRunning && isFakeLocationEnabled && isTripSimulationActive) return true
                    return chain.proceed()
                }
            })
                  } catch (_: Throwable) {}

                  try {
            val mLastLoc = LocationManager::class.java.getDeclaredMethod("getLastKnownLocation", String::class.java)
            module.hook(mLastLoc).intercept(object : XposedInterface.Hooker {
                override fun intercept(chain: XposedInterface.Chain): Any? {
                    val orig = chain.proceed() as? Location
                    if ((reentrancyDepth.get() ?: 0) > 0) return orig
                    if (isMasterRunning && isFakeLocationEnabled && currentLat != 0.0 && currentLng != 0.0) {
                        val prov = (chain.args.getOrNull(0) as? String) ?: "gps"
                        val loc = if (orig != null) Location(orig) else Location(prov)
                        loc.latitude = currentLat
                        loc.longitude = currentLng
                        loc.time = System.currentTimeMillis()
                        loc.elapsedRealtimeNanos = SystemClock.elapsedRealtimeNanos()
                        loc.accuracy = 8.0f
                        if (isTripSimulationActive) {
                            loc.speed = 4.5f
                            loc.bearing = 120.0f
                        }
                        return loc
                    }
                    return orig
                }
            })
                  } catch (_: Throwable) {}
              }
          }
          ''')


          write_kt('app/src/main/java/dev/saned/assistant/NotificationHelper.kt', r'''package dev.saned.assistant

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import java.util.Locale

          object NotificationHelper {

              const val CHANNEL_ACCEPTED = "sanedhook_accepted"

              fun showOrderNotification(context: Context, order: OrderModel, isAccepted: Boolean = true) {
                  try {
            val nm = context.getSystemService(Context.NOTIFICATION_SERVICE) as? NotificationManager ?: return

            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                val existing = nm.getNotificationChannel(CHANNEL_ACCEPTED)
                if (existing == null) {
                    val chan = NotificationChannel(
                        CHANNEL_ACCEPTED,
                        "Saned Accepted Orders",
                        NotificationManager.IMPORTANCE_HIGH
                    ).apply {
                        description = "Instant notifications for captured and accepted Jahez orders"
                        enableLights(true)
                        enableVibration(true)
                        lockscreenVisibility = Notification.VISIBILITY_PUBLIC
                    }
                    nm.createNotificationChannel(chan)
                }
            }

            val lang = Locale.getDefault().language.lowercase()
            val ref = if (order.reference.isNotEmpty()) order.reference else order.id.toString().ifEmpty { "Offer" }
            val combined = "${order.status} ${order.decisionReason}".lowercase(Locale.US)
            val isTakenByOther = combined.contains("already accepted") ||
                combined.contains("already assigned") ||
                combined.contains("سائق آخر") ||
                combined.contains("taken")
            val isAcceptFailed = !isAccepted && (isTakenByOther || combined.contains("fail") || combined.contains("فشل") || combined.contains("تعذر"))

            val title = when {
                isAccepted -> when (lang) {
                    "ar" -> "✅ تم قبول الطلب رقم #$ref"
                    "ur" -> "✅ آرڈر #$ref قبول کر لیا گیا"
                    "bn" -> "✅ অর্ডার #$ref গ্রহণ করা হয়েছে"
                    else -> "✅ Order #$ref Accepted"
                }
                isTakenByOther -> when (lang) {
                    "ar" -> "⚠️ تم قبول الطلب #$ref من قبل سائق آخر"
                    "ur" -> "⚠️ آرڈر #$ref کسی دوسرے ڈرائیور نے قبول کر لیا"
                    "bn" -> "⚠️ অর্ডার #$ref অন্য ড্রাইভার গ্রহণ করেছে"
                    else -> "⚠️ Order #$ref Accepted by Another Driver"
                }
                isAcceptFailed -> when (lang) {
                    "ar" -> "❌ تعذر قبول الطلب رقم #$ref"
                    "ur" -> "❌ آرڈر #$ref قبول نہ ہو سکا"
                    "bn" -> "❌ অর্ডার #$ref গ্রহণ ব্যর্থ"
                    else -> "❌ Order #$ref Accept Failed"
                }
                else -> when (lang) {
                    "ar" -> "⚡ طلب جديد · #$ref"
                    "ur" -> "⚡ نیا آرڈر · #$ref"
                    "bn" -> "⚡ নতুন অর্ডার · #$ref"
                    else -> "⚡ New Offer · #$ref"
                }
            }

            val restStr = if (order.restaurant.isNotEmpty()) order.restaurant else "Jahez Fleet"
            val distStr = if (order.distanceKm > 0.0) String.format(Locale.US, "%.1f", order.distanceKm) + " km" else ""
            val priceStr = String.format(Locale.US, "%.1f", order.price) + " " + order.currency

            val summaryParts = mutableListOf<String>()
            if (isTakenByOther) {
                summaryParts.add(if (lang == "ar") "تم قبوله من سائق آخر" else "Taken by another driver")
            } else if (isAcceptFailed && order.decisionReason.isNotEmpty()) {
                summaryParts.add(order.decisionReason)
            }
            summaryParts.add("#$ref")
            summaryParts.add(restStr)
            if (distStr.isNotEmpty()) summaryParts.add(distStr)
            summaryParts.add(priceStr)

            var bigText = summaryParts.joinToString(" · ")
            if (isTakenByOther) {
                val takenNote = when (lang) {
                    "ar" -> "\n⚠️ سبقك سائق آخر بقبول هذا الطلب (Order is already accepted)"
                    "ur" -> "\n⚠️ یہ آرڈر پہلے ہی کسی دوسرے ڈرائیور نے قبول کر لیا ہے"
                    "bn" -> "\n⚠️ এই অর্ডারটি ইতিমধ্যে অন্য একজন ড্রাইভার গ্রহণ করেছে"
                    else -> "\n⚠️ Another driver accepted this order first (Order is already accepted)"
                }
                bigText += takenNote
            } else if (isAcceptFailed && order.decisionReason.isNotEmpty()) {
                bigText += "\n❌ ${order.decisionReason}"
            }
            val effFood = if (order.foodPrice > 0.0) order.foodPrice else order.cashAmount
            if (effFood > 0.0) {
                val foodMsg = when (lang) {
                    "ar" -> "\n🍔 سعر الطعام (Price Food): " + String.format(Locale.US, "%.2f", effFood) + " " + order.currency
                    else -> "\n🍔 Price Food: " + String.format(Locale.US, "%.2f", effFood) + " " + order.currency
                }
                bigText += foodMsg
            }
            if (order.cashAmount > 0.0) {
                val cashMsg = when (lang) {
                    "ar" -> "\n💵 استلم نقداً: " + String.format(Locale.US, "%.2f", order.cashAmount) + " " + order.currency
                    "ur" -> "\n💵 نقد وصول کریں: " + String.format(Locale.US, "%.2f", order.cashAmount) + " " + order.currency
                    "bn" -> "\n💵 নগদ সংগ্রহ করুন: " + String.format(Locale.US, "%.2f", order.cashAmount) + " " + order.currency
                    else -> "\n💵 Collect Cash: " + String.format(Locale.US, "%.2f", order.cashAmount) + " " + order.currency
                }
                bigText += cashMsg
            } else {
                val prepaidMsg = when (lang) {
                    "ar" -> "\n✔️ الدفع: مدفوع مسبقاً (Prepaid)" + (if (effFood > 0.0) " · سعر الطعام: " + String.format(Locale.US, "%.2f", effFood) + " " + order.currency else "")
                    else -> "\n✔️ Prepaid (Nothing to collect)" + (if (effFood > 0.0) " · Price Food: " + String.format(Locale.US, "%.2f", effFood) + " " + order.currency else "")
                }
                bigText += prepaidMsg
            }
            if (order.customerName.isNotEmpty()) {
                bigText += "\n👤 ${order.customerName}"
            }
            if (order.address.isNotEmpty() && order.address != "Location on map") {
                bigText += "\n📍 ${order.address}"
            }
            if (order.destLat != 0.0 && order.destLng != 0.0) {
                val cDist = if (order.customerDistanceKm > 0.0) String.format(Locale.US, " (%.1f km)", order.customerDistanceKm) else ""
                bigText += String.format(Locale.US, "\n🏠 موقع العميل: %.5f, %.5f%s", order.destLat, order.destLng, cDist)
            }

            val pm = context.packageManager
            val launchIntent = pm.getLaunchIntentForPackage("net.jahez.fleets")
                ?: pm.getLaunchIntentForPackage(context.packageName)
                ?: Intent()
            launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)

            val pFlags = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
            } else {
                PendingIntent.FLAG_UPDATE_CURRENT
