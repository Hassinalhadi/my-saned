          assert old_err_fallback in order_src, "old_err_fallback not found"
          order_src = order_src.replace(old_err_fallback, new_err_fallback, 1)

          open(order_path, "w", encoding="utf-8").write(order_src)

          cloaker_path = "app/src/main/java/dev/saned/assistant/PackageCloaker.kt"
          if os.path.exists(cloaker_path):
              clk_src = open(cloaker_path, "r", encoding="utf-8").read()
