                                      val dRef = if (dRefIdx >= 0) (cursorStringOrNull(diCursor, dRefIdx) ?: dId) else dId
                                      val dSt = if (dStIdx >= 0) (cursorStringOrNull(diCursor, dStIdx) ?: "Accepted ✅") else "Accepted ✅"
                                      val vRest = vendorNameCache[dId] ?: vendorNameCache[dRef] ?: ""
                                      val cDet = customerDetailsCache[dId] ?: customerDetailsCache[dRef]
                                      if (vRest.isNotEmpty()) vendorNameCache[dRef] = vRest
                                      if (cDet != null) customerDetailsCache[dRef] = cDet
                                      val isAct = liveActiveOrderMap.containsKey(dId) || liveActiveOrderMap.containsKey(dRef) ||
                                          synchronized(syncedOrdersCache) { syncedOrdersCache.containsKey(dId) || syncedOrdersCache.containsKey(dRef) }
                                      if (isAct && (vRest.isNotEmpty() || cDet != null)) {
                                          val existingObj = synchronized(syncedOrdersCache) { syncedOrdersCache[dRef] ?: syncedOrdersCache[dId] }
                                          val prevM = if (existingObj != null) OrderModel.fromJson(existingObj) else null
                                          val coords = getCachedCoords(dId) ?: getCachedCoords(dRef)
                                          sendOrderToLog(
                                              orderId = "#$dId",
                                              price = prevM?.price ?: 0.0,
                                              dist = prevM?.distanceKm ?: 0.0,
                                              restaurant = vRest.ifEmpty { prevM?.restaurant ?: "" },
                                              status = normalizeOrderStatusDisplay(dSt),
                                              customerName = cDet?.first?.ifEmpty { prevM?.customerName ?: "" } ?: (prevM?.customerName ?: ""),
                                              customerPhone = cDet?.second?.ifEmpty { prevM?.customerPhone ?: "" } ?: (prevM?.customerPhone ?: ""),
                                              address = prevM?.address ?: "",
