                              val srv = (getM.invoke(headersObj, "Server") as? String) ?: ""
                              val rlRem = (getM.invoke(headersObj, "x-ratelimit-remaining") as? String)
                                  ?: (getM.invoke(headersObj, "ratelimit-remaining") as? String) ?: ""
                              val cfMit = (getM.invoke(headersObj, "cf-mitigated") as? String) ?: ""
                              hdrsSummary = "srv=$srv,cfRay=$cfRay,retryAfter=$retryAfter,rlRem=$rlRem,cfMit=$cfMit"
                          }
                      } catch (_: Throwable) {}

                      var bodyStr = ""
                      try {
                          val bodyObj = respObj.javaClass.getMethod("body").invoke(respObj)
                          if (bodyObj != null) {
                              bodyStr = (bodyObj.javaClass.getMethod("string").invoke(bodyObj) as? String) ?: ""
                          }
                      } catch (_: Throwable) {}
                      try {
                          respObj.javaClass.getMethod("close").invoke(respObj)
                      } catch (_: Throwable) {}

                      RawHttpResult(code, bodyStr, retryAfter, hdrsSummary, true)
                  } catch (t: Throwable) {
                      DiagnosticLogger.logWarn("AppOkHttp", "executeViaRawAppClient exception: ${t.javaClass.simpleName}: ${t.message}")
                      null
                  }
              }"""
