name: Android CI & Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Decompile APK to Open-Source, Sync 100% Parity & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Install Android Signing Tools (Quiet & Fast)
        run: |
          sudo apt-get update -qq > /dev/null
          sudo apt-get install -y -qq zipalign apksigner zip unzip python3 > /dev/null
          mkdir -p SanedAssistant-98-OpenSource

      - name: Sync 100% SanedAssistant-98 Parity + Live Crash & Hook Diagnostic Log Window
        run: |
          python3 - << 'PYEOF'
          import os, re, zipfile, struct

          def replace_block(src, start_marker, end_marker, replacement):
              i1 = src.find(start_marker)
              i2 = src.find(end_marker, i1 if i1 != -1 else 0)
              if i1 != -1 and i2 != -1 and i2 > i1:
                  return src[:i1] + replacement + "\n\n    " + src[i2:]
              return src

          # 1. Extract original icons (DQ.jpg, ZI.png, iQ.png) from SanedAssistant-98-7bac1ec.apk and remove any stale jniLibs
          if os.path.exists("app/src/main/jniLibs"):
              import shutil
              shutil.rmtree("app/src/main/jniLibs", ignore_errors=True)
          apk_path = "SanedAssistant-98-7bac1ec.apk"
          if os.path.exists(apk_path):
              os.makedirs("app/src/main/res/drawable", exist_ok=True)
              with zipfile.ZipFile(apk_path, "r") as zf:
                  names = set(zf.namelist())
                  import base64 as _b64
                  open("app/src/main/res/drawable/ic_launcher_original.jpg", "wb").write(_b64.b64decode(""))
                  if "res/ZI.png" in names:
                      open("app/src/main/res/drawable/ic_notif_original.png", "wb").write(zf.read("res/ZI.png"))
                  if "res/iQ.png" in names:
                      open("app/src/main/res/drawable/ic_badge_original.png", "wb").write(zf.read("res/iQ.png"))
              print("Extracted original icons (DQ.jpg, ZI.png, iQ.png)")

          # 1B. Update AndroidManifest.xml & NotificationHelper.kt for Root (LSPosed) & Non-Root (NPatch v1.0.9)
          manifest_path = "app/src/main/AndroidManifest.xml"
          manifest_xml = '''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <queries>
                  <package android:name="net.jahez.fleets" />
                  <package android:name="top.nkbe.npatch" />
                  <package android:name="org.lsposed.lspatch" />
                  <package android:name="org.lsposed.manager" />
                  <provider android:authorities="top.nkbe.npatch.remote" />
                  <provider android:authorities="dev.jing.sanedhook.XposedService" />
                  <intent>
                      <action android:name="org.lsposed.lspatch.action.REQUEST_PUSH" />
                  </intent>
                  <intent>
                      <action android:name="top.nkbe.npatch.action.REQUEST_PUSH" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:appComponentFactory="androidx.core.app.CoreComponentFactory"
                  android:icon="@drawable/ic_launcher_original"
                  android:label="J-Driver"
                  android:roundIcon="@drawable/ic_launcher_original"
                  android:supportsRtl="false"
                  android:theme="@style/Theme.SanedAssistant">

                  <meta-data
                      android:name="xposedmodule"
                      android:value="true" />
                  <meta-data
                      android:name="xposeddescription"
                      android:value="J-Driver (Root LSPosed &amp; Non-Root NPatch)" />
                  <meta-data
                      android:name="xposedminversion"
                      android:value="93" />
                  <meta-data
                      android:name="xposedscope"
                      android:resource="@array/xposedscope" />
