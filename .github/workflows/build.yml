              @Volatile private var bgRouteTraveledM: Double = 0.0
              @Volatile private var bgRouteTotalM: Double = 0.0
              private val bgRouteWaypoints = java.util.concurrent.CopyOnWriteArrayList<Pair<Double, Double>>()
              @Volatile private var bgRouteCumMeters: DoubleArray = DoubleArray(0)
              @Volatile private var lastLoadedWaypointsSig: String = ""

              fun configureAutonomousRoute(
                  waypointsJson: String?,
                  loopOnce: Boolean,
                  varSpeed: Boolean,
                  minSpd: Float,
                  maxSpd: Float
              ) {
                  bgRouteLoopOnce = loopOnce
                  bgRouteVarSpeed = varSpeed
                  if (!minSpd.isNaN() && minSpd > 0f) bgRouteMinSpdKmh = minSpd
                  if (!maxSpd.isNaN() && maxSpd >= bgRouteMinSpdKmh) bgRouteMaxSpdKmh = maxSpd
                  if (waypointsJson.isNullOrBlank() || waypointsJson == "[]" || waypointsJson == lastLoadedWaypointsSig) return
                  try {
                      val arr = org.json.JSONArray(waypointsJson)
                      if (arr.length() < 2) return
                      val pts = ArrayList<Pair<Double, Double>>(arr.length())
                      for (i in 0 until arr.length()) {
                          val pt = arr.optJSONArray(i) ?: continue
                          val lt = pt.optDouble(0, 0.0)
                          val lg = pt.optDouble(1, 0.0)
                          if (lt != 0.0 && lg != 0.0) pts.add(lt to lg)
                      }
                      if (pts.size < 2) return
                      val cum = DoubleArray(pts.size)
                      var total = 0.0
                      cum[0] = 0.0
                      for (i in 1 until pts.size) {
                          val a = pts[i - 1]
                          val b = pts[i]
                          total += calculateDistance(a.first, a.second, b.first, b.second) * 1000.0
                          cum[i] = total
                      }
                      bgRouteWaypoints.clear()
                      bgRouteWaypoints.addAll(pts)
                      bgRouteCumMeters = cum
                      bgRouteTotalM = total
                      bgRouteTraveledM = 0.0
                      bgRouteForward = true
                      lastLoadedWaypointsSig = waypointsJson
                  } catch (_: Throwable) {}
              }

              private fun stepAutonomousRouteIfAppMinimized() {
                  if (!isSpoofingActive() || !isTripSimulationActive) return
                  val nowRt = SystemClock.elapsedRealtime()
                  // Only step autonomously inside Saned if J-Driver is minimized/throttled and hasn't pushed a step in the last 900ms
                  if (lastExternalStepRealtime > 0L && (nowRt - lastExternalStepRealtime) < 900L) return
                  val pts = bgRouteWaypoints
                  val cum = bgRouteCumMeters
                  val totalM = bgRouteTotalM
                  if (pts.size < 2 || cum.size < 2 || totalM <= 0.5) return

                  bgRouteTickCounter++
                  var preIdx = 0
                  while (preIdx < cum.size - 2 && cum[preIdx + 1] < bgRouteTraveledM) preIdx++

                  val spdKmh = if (!bgRouteVarSpeed) {
                      simulatedSpeedKmh.coerceIn(2.0f, 240.0f)
                  } else {
                      val minS = bgRouteMinSpdKmh.coerceIn(2.0f, 220.0f)
                      val maxS = bgRouteMaxSpdKmh.coerceIn(minS, 240.0f)
                      val wave = (kotlin.math.sin(bgRouteTickCounter * 0.18) + 1.0) * 0.5
                      val target = (minS + (maxS - minS) * wave).toFloat()
                      bgRouteDynSpdKmh = (bgRouteDynSpdKmh * 0.65f + target * 0.35f).coerceIn(minS, maxS)
                      bgRouteDynSpdKmh
                  }
                  simulatedSpeedKmh = spdKmh
                  val stepM = (spdKmh / 3.6) * 0.5

                  if (bgRouteForward) {
                      bgRouteTraveledM += stepM
                      if (bgRouteTraveledM >= totalM) {
                          if (bgRouteLoopOnce) {
                              bgRouteTraveledM = totalM
                              bgRouteForward = false
                          } else {
                              bgRouteTraveledM = totalM
                              val lastPt = pts.last()
                              val prevPt = pts[pts.size - 2]
                              currentLat = lastPt.first
                              currentLng = lastPt.second
                              currentBearing = calculateBearing(prevPt.first, prevPt.second, lastPt.first, lastPt.second)
                              isTripSimulationActive = false
                              persistAutonomousPosition(currentLat, currentLng, false)
                              return
                          }
                      }
                  } else {
                      bgRouteTraveledM -= stepM
                      if (bgRouteTraveledM <= 0.0) {
                          bgRouteTraveledM = 0.0
                          bgRouteForward = true
                          val firstPt = pts.first()
                          val secondPt = pts[1]
                          currentLat = firstPt.first
                          currentLng = firstPt.second
                          currentBearing = calculateBearing(secondPt.first, secondPt.second, firstPt.first, firstPt.second)
                          isTripSimulationActive = false
                          persistAutonomousPosition(currentLat, currentLng, false)
                          return
                      }
                  }

                  var segIdx = 0
                  while (segIdx < cum.size - 2 && cum[segIdx + 1] < bgRouteTraveledM) segIdx++
                  val segStart = cum[segIdx]
                  val segEnd = cum[segIdx + 1]
                  val segLen = (segEnd - segStart).coerceAtLeast(0.001)
                  val frac = ((bgRouteTraveledM - segStart) / segLen).coerceIn(0.0, 1.0)
                  val p1 = pts[segIdx]
                  val p2 = pts[segIdx + 1]
                  currentLat = p1.first + (p2.first - p1.first) * frac
                  currentLng = p1.second + (p2.second - p1.second) * frac
                  currentBearing = if (bgRouteForward) {
                      calculateBearing(p1.first, p1.second, p2.first, p2.second)
                  } else {
                      calculateBearing(p2.first, p2.second, p1.first, p1.second)
                  }
              }

