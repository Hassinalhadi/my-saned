              if (!fp) return false;
              if (fseek(fp, 0, SEEK_END) != 0) {{ fclose(fp); return false; }}
              long file_size = ftell(fp);
              if (file_size < 65536) {{ fclose(fp); return false; }}

              size_t tail_len = (file_size > 65558) ? 65558 : static_cast<size_t>(file_size);
              uint8_t* tail = static_cast<uint8_t*>(malloc(tail_len));
              if (!tail) {{ fclose(fp); return false; }}
