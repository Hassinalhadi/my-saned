                          is Number -> rawId.toInt()
                          is String -> rawId.filter { it.isDigit() }.take(9).toIntOrNull() ?: 0
                          else -> 0
                      }
                      val rawStatus = json.optString("status", json.optString("state", "Accepted ✅"))
                      val parsedStatus = if (rawStatus.equals("Dispatched", ignoreCase = true) || rawStatus.equals("DISPATCHED", ignoreCase = true)) {
                          "Accepted ✅"
                      } else {
                          rawStatus
                      }
                      val defaultMissed = parsedStatus.uppercase().let { s ->
                          s.contains("REJECT") || s.contains("MISSED") || s.contains("FAIL") ||
                          s.contains("SKIP") || s.contains("MANUAL") || s.contains("DRY") ||
                          s.contains("TAKEN") || s.contains("ALREADY") ||
                          s.contains("رفض") || s.contains("فائت") || s.contains("تخطي") ||
                          s.contains("فشل") || s.contains("تعذر") || s.contains("سائق آخر")
                      }
                      fun cleanCoord(v: Double): Double = if (v.isNaN() || v.isInfinite()) 0.0 else v
                      val payObj = json.optJSONObject("payment")
                      val parsedCash = cleanCoord(
                          json.optDouble(
                              "cashAmount",
                              json.optDouble(
                                  "cash_amount",
                                  json.optDouble(
                                      "cod_amount",
                                      json.optDouble(
                                          "collectionAmount",
                                          payObj?.optDouble("collectionAmount", payObj.optDouble("cashAmount", 0.0)) ?: 0.0
                                      )
                                  )
                              )
                          )
                      )
                      val rawFoodPrice = cleanCoord(
                          json.optDouble(
                              "foodPrice",
                              json.optDouble(
                                  "food_price",
                                  json.optDouble(
                                      "orderAmount",
                                      json.optDouble(
                                          "totalAmount",
                                          json.optDouble(
                                              "invoiceAmount",
                                              json.optDouble(
                                                  "subTotal",
                                                  payObj?.optDouble(
                                                      "foodPrice",
                                                      payObj.optDouble(
                                                          "orderAmount",
                                                          payObj.optDouble(
                                                              "totalAmount",
                                                              payObj.optDouble("invoiceAmount", payObj.optDouble("collectionAmount", 0.0))
                                                          )
                                                      )
                                                  ) ?: 0.0
                                              )
                                          )
                                      )
                                  )
                              )
                          )
                      )
                      val effFoodPrice = if (rawFoodPrice > 0.0) rawFoodPrice else parsedCash
                      val parsedPayMethod = json.optString(
                          "paymentMethod",
                          json.optString(
                              "payment_method",
                              json.optString(
                                  "paymentType",
                                  payObj?.optString("paymentMethod", payObj.optString("type", "")) ?: ""
                              )
                          )
                      )
                      return OrderModel(
                          id = intId,
                          reference = json.optString("reference", json.optString("referenceId", json.optString("order_number", json.optString("order_id", json.optString("id", ""))))),
                          status = parsedStatus,
                          restaurant = json.optString("restaurant", json.optString("store_name", json.optString("restaurant_name", ""))),
                          pickupAddress = json.optString("pickupAddress", json.optString("pickup_address", "")),
                          customerName = json.optString("customerName", json.optString("customer_name", json.optString("client_name", ""))),
                          customerPhone = json.optString("customerPhone", json.optString("customer_phone", json.optString("phone", ""))),
                          address = json.optString("address", json.optString("customer_address", json.optString("delivery_address", ""))),
                          price = json.optDouble("price", json.optDouble("delivery_cost", json.optDouble("delivery_fee", 0.0))),
                          bonus = json.optDouble("bonus", json.optDouble("tip", 0.0)),
                          currency = json.optString("currency", "SAR").ifEmpty { "SAR" },
                          cashAmount = parsedCash,
                          foodPrice = effFoodPrice,
                          paymentMethod = parsedPayMethod,
                          distanceKm = json.optDouble("distanceKm", json.optDouble("distance", json.optDouble("km", 0.0))),
                          customerDistanceKm = json.optDouble("customerDistanceKm", json.optDouble("customer_distance", 0.0)),
                          pickupLat = cleanCoord(json.optDouble("pickupLat", json.optDouble("pickup_lat", 0.0))),
                          pickupLng = cleanCoord(json.optDouble("pickupLng", json.optDouble("pickup_lng", 0.0))),
                          destLat = cleanCoord(json.optDouble("destLat", json.optDouble("dest_lat", 0.0))),
                          destLng = cleanCoord(json.optDouble("destLng", json.optDouble("dest_lng", 0.0))),
                          decisionReason = json.optString("decisionReason", ""),
                          isMissedOrRejected = json.optBoolean("isMissedOrRejected", defaultMissed),
                          time = json.optString("time", ""),
                          timestamp = json.optLong("timestamp", System.currentTimeMillis())
                      )
                  }
              }
          }
          ''')


          write_kt('app/src/main/java/dev/saned/assistant/PackageCloaker.kt', r'''package dev.saned.assistant

          import android.app.Activity
          import android.content.pm.ApplicationInfo
          import android.content.pm.PackageInfo
          import android.os.Bundle
          import dev.jing.sanedhook.util.Native
          import io.github.libxposed.api.XposedInterface
          import io.github.libxposed.api.XposedModule
          import java.lang.reflect.Modifier
          import java.util.concurrent.atomic.AtomicBoolean

          object PackageCloaker {

              data class VersionProfile(
                  val index: Int,
                  val nativeLibName: String,
                  val nativeClasses: List<String>,
                  val blockedActivity: String,
                  val mainActivity: String,
                  val loaderClass: String,
                  val loaderMethod: String,
                  val runtimeExecMethod: String
              )

              data class ShadowArmorProfile(
                  val rootCheckClass: String,
                  val autoClickerClass: String,
                  val installSourceClass: String,
                  val certPinClass: String,
                  val featureFlagsClass: String
              )

              @Volatile var detectedVersionIndex: Int = -1
              @Volatile var activeProfile: VersionProfile? = null
              @Volatile var lastCheckedVersionCode: Long = 0L
              @Volatile private var mapsCertCheckResult: Int = 0

              private val isRuntimeHooked = AtomicBoolean(false)
              private val isNativeStubbed = AtomicBoolean(false)
              private val stubbedNativeClasses = java.util.concurrent.ConcurrentHashMap.newKeySet<String>()
              private val isLoaderHooked = AtomicBoolean(false)
              private val isBlockedActHooked = AtomicBoolean(false)
              private val isSecurityHooked = AtomicBoolean(false)

              fun isNativeStubbedFlag(): Boolean = isNativeStubbed.get()

              fun getAllVersionProfiles(): List<VersionProfile> {
                  val raw = Native.safeP()
                  val result = mutableListOf<VersionProfile>()
                  for ((idx, c) in raw.toList().chunked(8).withIndex()) {
            if (c.size == 8) {
                result.add(VersionProfile(idx, c[0], listOf(c[1], c[2]).filter { it.isNotEmpty() }, c[3], c[4], c[5], c[6], c[7]))
            }
                  }
                  return result
              }

              fun getAllShadowArmorProfiles(): List<ShadowArmorProfile> {
                  val raw = Native.safeT()
                  val result = mutableListOf<ShadowArmorProfile>()
                  for (c in raw.toList().chunked(5)) {
            if (c.size == 5) result.add(ShadowArmorProfile(c[0], c[1], c[2], c[3], c[4]))
                  }
                  return result
              }

              fun checkVersionSupported(versionCode: Long): Boolean {
                  if (versionCode <= 0L) return true
                  if (lastCheckedVersionCode == versionCode && detectedVersionIndex >= 0) return true
                  lastCheckedVersionCode = versionCode
                  detectedVersionIndex = try { Native.safeS(versionCode) } catch (_: Throwable) { -1 }
                  return detectedVersionIndex >= 0
              }

              fun resolveProfile(classLoader: ClassLoader): VersionProfile? {
                  activeProfile?.let { return it }
                  val profiles = getAllVersionProfiles()
                  if (profiles.isEmpty()) return null
                  val preferred = profiles.getOrNull(detectedVersionIndex)
                  if (preferred != null && isProfilePresent(classLoader, preferred)) {
            activeProfile = preferred
            return preferred
                  }
                  for (p in profiles) {
            if (isProfilePresent(classLoader, p)) {
                activeProfile = p
                if (detectedVersionIndex < 0) detectedVersionIndex = p.index
                return p
            }
                  }
                  return null
              }

              private fun isProfilePresent(classLoader: ClassLoader, profile: VersionProfile): Boolean =
                  profile.loaderClass.isNotEmpty() && try { Class.forName(profile.loaderClass, false, classLoader); true } catch (_: Throwable) { false }

              fun getMainActivityClassName(): String =
                  (activeProfile ?: getAllVersionProfiles().firstOrNull())?.mainActivity?.takeIf { it.isNotEmpty() } ?: "net.jahez.fleets.MainActivity"

              private fun defaultReturnValueForType(type: Class<*>): Any? = when (type) {
                  Boolean::class.javaPrimitiveType -> java.lang.Boolean.TRUE
                  Int::class.javaPrimitiveType -> 0
                  Long::class.javaPrimitiveType -> 0L
                  Short::class.javaPrimitiveType -> 0.toShort()
                  Byte::class.javaPrimitiveType -> 0.toByte()
                  Char::class.javaPrimitiveType -> ' '
                  Float::class.javaPrimitiveType -> 0f
