              private fun computeDeviceHashStatic(deviceId: String): Int {{
                  val clean = deviceId.trim().uppercase(Locale.US).replace("-", "").replace(" ", "")
                  if (clean.isEmpty() || clean == "*" || clean == "ANY" || clean == "ALL" || clean == "JID00000000") return 0
                  val d = MessageDigest.getInstance("SHA-256").digest(("JDRV_DEV:$clean").toByteArray(Charsets.UTF_8))
                  val v = ((d[0].toInt() and 0xFF) shl 24) or ((d[1].toInt() and 0xFF) shl 16) or ((d[2].toInt() and 0xFF) shl 8) or (d[3].toInt() and 0xFF)
                  return if (v != 0) v else 1
              }}

              private fun encodeBase32(data: ByteArray): String {{
                  var bits = 0
                  var value = 0
                  val sb = StringBuilder()
                  for (b in data) {{
                      value = (value shl 8) or (b.toInt() and 0xFF)
                      bits += 8
                      while (bits >= 5) {{
                          sb.append(LIC_ALPHABET[(value ushr (bits - 5)) and 31])
                          bits -= 5
                      }}
                  }}
                  if (bits > 0) sb.append(LIC_ALPHABET[(value shl (5 - bits)) and 31])
                  val raw = sb.toString()
                  val groups = mutableListOf<String>()
                  var i = 0
                  while (i < raw.length) {{
                      groups.add(raw.substring(i, (i + 4).coerceAtMost(raw.length)))
                      i += 4
                  }}
                  return "JDRV-" + groups.joinToString("-")
              }}

              @JvmStatic
              fun generateTrialKeyPair(ctx: Context, myDevId: String, devHash: Int): Pair<String, String> {{
                  val loaded = tryLoadNative(ctx)
