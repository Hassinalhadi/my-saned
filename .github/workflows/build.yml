              private fun refreshDiagLogsUI() {
                  if (!::tvDiagLogConsole.isInitialized) return
                  val rawLogs = SettingsStore.getDiagLogs(this)
                  if (rawLogs.isBlank()) {
                      tvDiagLogSummary.text = "🟢 لا توجد أخطاء مسجلة — افتح تطبيق net.jahez.fleets لبدء التسجيل المباشر"
                      tvDiagLogSummary.setTextColor(Color.parseColor("#059669"))
                      tvDiagLogConsole.text = "لا توجد سجلات بعد.\nافتح تطبيق net.jahez.fleets الآن وسيظهر هنا كل خطاف (Hook) يتم تفعيله، ورقم إصدار جاهز، وأي استثناء أو Crash بالتفصيل الكامل (Stacktrace)."
                      tvDiagLogConsole.setTextColor(Color.parseColor("#94A3B8"))
                      return
                  }

                  val lines = rawLogs.lines()
                  val crashCount = lines.count { it.contains("[CRASH]") }
                  val errCount = lines.count { it.contains("[ERR]") }
                  val warnCount = lines.count { it.contains("[WARN]") }

                  if (crashCount > 0 || errCount > 0) {
                      tvDiagLogSummary.text = "🚨 تم رصد $crashCount كراش و $errCount خطأ و $warnCount تنبيه (إجمالي ${lines.size} سطر)"
                      tvDiagLogSummary.setTextColor(Color.parseColor("#DC2626"))
                  } else {
                      tvDiagLogSummary.text = "✅ السجل يعمل بنجاح (${lines.size} سطر | $warnCount تنبيه | 0 كراش)"
                      tvDiagLogSummary.setTextColor(Color.parseColor("#059669"))
                  }

                  val displayText = if (filterErrorsOnly) {
                      val filtered = mutableListOf<String>()
                      var includeContinuation = false
                      for (line in lines) {
                          if (line.startsWith("[")) {
                              includeContinuation = line.contains("[CRASH]") || line.contains("[ERR]") || line.contains("[WARN]")
                          }
                          if (includeContinuation) filtered.add(line)
                      }
                      if (filtered.isEmpty()) "لا توجد أخطاء أو كراش في السجل الحالي ✅" else filtered.joinToString("\n")
                  } else {
                      rawLogs
                  }

                  tvDiagLogConsole.text = displayText
                  tvDiagLogConsole.setTextColor(
                      if (crashCount > 0) Color.parseColor("#FCA5A5") else Color.parseColor("#38BDF8")
                  )
              }""".replace("\n          ", "\n")
              )

              # 9E. Ensure saveAllSettings() also saves the 6 hook isolation checkboxes
              if "SettingsStore.setHookEarlyCloaker" not in ma:
                  ma = ma.replace(
                      "SettingsStore.setParallelRequests(this, parallelReqs)",
                      r"""SettingsStore.setParallelRequests(this, parallelReqs)

                  if (::chkHookEarlyCloaker.isInitialized) {
                      SettingsStore.setHookEarlyCloaker(this, chkHookEarlyCloaker.isChecked)
                      SettingsStore.setHookSecCloaker(this, chkHookSecCloaker.isChecked)
                      SettingsStore.setHookLocation(this, chkHookLocation.isChecked)
                      SettingsStore.setHookDeviceSpoofer(this, chkHookDeviceSpoofer.isChecked)
                      SettingsStore.setHookOrders(this, chkHookOrders.isChecked)
                      SettingsStore.setHookBootstrapLoop(this, chkHookBootstrapLoop.isChecked)
                  }""".replace("\n          ", "\n"),
                      1
                  )

              # 9F. Ensure ordersUpdateReceiver & onResume listen for UI_REFRESH_LOGS and ACTION_DIAG_LOG
              if "UI_REFRESH_LOGS" not in ma:
                  ma = ma.replace(
                      '"dev.saned.assistant.UI_REFRESH_ORDERS" -> {\n                    refreshOrdersLogUI()\n                }',
                      r""""dev.saned.assistant.UI_REFRESH_ORDERS" -> {
                              refreshOrdersLogUI()
                          }
                          "dev.saned.assistant.UI_REFRESH_LOGS", "dev.saned.assistant.ACTION_DIAG_LOG" -> {
                              refreshDiagLogsUI()
                          }""".replace("\n          ", "\n"),
                      1
                  )
                  ma = ma.replace(
                      'addAction("dev.saned.assistant.UI_REFRESH_ORDERS")',
                      'addAction("dev.saned.assistant.UI_REFRESH_ORDERS")\n                addAction("dev.saned.assistant.UI_REFRESH_LOGS")\n                addAction("dev.saned.assistant.ACTION_DIAG_LOG")',
                      1
                  )
                  ma = ma.replace(
                      "override fun onResume() {\n        super.onResume()\n        refreshOrdersLogUI()",
                      "override fun onResume() {\n        super.onResume()\n        refreshOrdersLogUI()\n        refreshDiagLogsUI()",
                      1
                  )

              open(ma_path, "w").write(ma)

          # 10. Create SanedAssistant-98-OpenSource.zip directly in Python
          with zipfile.ZipFile("SanedAssistant-98-OpenSource.zip", "w", zipfile.ZIP_DEFLATED) as zout:
              for item in ["SanedAssistant-98-OpenSource", "app", "build.gradle.kts", "settings.gradle.kts", "gradle.properties"]:
                  if os.path.isfile(item):
                      zout.write(item)
                  elif os.path.isdir(item):
                      for root_dir, _, files in os.walk(item):
                          for f in files:
                              fp = os.path.join(root_dir, f)
                              zout.write(fp)

          print("Successfully synced DiagnosticLogger, Logs UI Tab, Hook Isolation switches, and zero-crash LSPosed hooks!")
          PYEOF

      - name: Build APK with Gradle
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.nonTransitiveRClass=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
          gradle assembleRelease --stacktrace || gradle assembleDebug --stacktrace

      - name: Commit Open-Source Parity Sync to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/ || true
          if ! git diff --cached --quiet; then
            git commit -m "fix: escape Kotlin string newlines and XposedModule.log signature in DiagnosticLogger [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Sign & Prepare Final APK
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found!"
            exit 1
          fi
          echo "Found built APK: $APK_PATH"

          if [[ "$APK_PATH" == *"unsigned"* ]]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            zipalign -v -p 4 "$APK_PATH" app-aligned.apk
            apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out SanedAssistant-98-OpenSource-Full.apk app-aligned.apk
          else
            cp "$APK_PATH" SanedAssistant-98-OpenSource-Full.apk
          fi

      - name: Upload Built APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SanedAssistant-98-OpenSource-APK
          path: SanedAssistant-98-OpenSource-Full.apk

      - name: Upload Full Open-Source Code Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SanedAssistant-98-OpenSource-SourceCode
          path: SanedAssistant-98-OpenSource.zip

      - name: Publish Release to GitHub
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0-build-${{ github.run_number }}
          name: "Saned Assistant v3.0.0 (Live Crash Log + Zero-Crash Parity #${{ github.run_number }})"
          body: |
            ### التحديثات في هذه النسخة (نافذة السجل التشخيصي المباشر + إصلاح جذري للكراش)
            - **إضافة نافذة سجل تشخيصي مباشر (`📋 Logs`) داخل التطبيق**:
              1. التقاط أي انهيار (`UncaughtException` / `Stacktrace`) داخل `net.jahez.fleets` لحظة حدوثه وإرساله فوراً إلى نافذة `📋 Logs` في `Saned Assistant` مع إمكانية النسخ أو التصفية.
              2. إضافة خيارات **عزل الـ Hooks (`Hook Isolation`)** داخل تبويب `📋 Logs` لتفعيل أو إيقاف أي مجموعة خطافات (`Early Native Cloaker`، `RootBeer/ShadowArmor`، `Location`، `Android ID`، `Order Hooks`، `Background Loop`) من الواجهة مباشرة.
            - **إصلاح الأسباب المتبقية للكراش عند فتح `net.jahez.fleets`**:
              1. إزالة مراقب الشاشة (`startScreenWatcher` / `scanAllRoots` / `WindowManagerGlobal`) من `onActivityResumed` الذي كان يفحص شجرة الواجهات على الـ UI Thread أثناء إقلاع جاهز.
              2. إزالة الفحص العشوائي لملفات `shared_prefs` (`scanJahezSharedPreferencesForToken`) و `scanExistingActivitiesInActivityThread` من حلقة الخلفية.
              3. التحقق من نجاح محاكاة الدوال الـ Native (`isNativeStubbed`) قبل منع تحميل `libjahez_fleets.so` لمنع خطأ `UnsatisfiedLinkError` إذا كان إصدار جاهز مختلفاً، وتشغيل دوال `Native.a..u` بلغة Kotlin مباشرة دون تحميل مكتبة خارجية داخل عملية جاهز.
          files: |
            SanedAssistant-98-OpenSource-Full.apk
            SanedAssistant-98-OpenSource.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
