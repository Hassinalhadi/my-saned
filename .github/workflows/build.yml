name: Android CI & Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Maximum Security Hardening (C++ Crypto + Immortal Trial Vault + R8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Install Android Signing Tools (Quiet & Fast)
        run: |
          sudo apt-get update -qq > /dev/null
          sudo apt-get install -y -qq zipalign apksigner zip unzip python3 > /dev/null
          mkdir -p SanedAssistant-98-OpenSource

      - name: Apply Maximum Security Shield & Immortal One-Day-Trial Anti-Tamper Vault (Android 17 Edition)
        run: |
          python3 - << 'PYEOF'
          import os, re, shutil, secrets, hashlib, subprocess, glob

          keygen_init = True

          keygen_path = "keygen/src/main/java/dev/jing/jdriver/keygen/KeyGenActivity.kt"
          if os.path.exists(keygen_path):
              kg_src = open(keygen_path, "r", encoding="utf-8").read()
              kg_src = kg_src.replace('"Hassinalhadi/my-saned"', '"Hassinalhadi/jdriver_control"').replace("contents/jdriver_control.json", "contents/jdriver_control_v2.json")
              open(keygen_path, "w", encoding="utf-8").write(kg_src)

          if os.path.exists("app/src/main/res/drawable/ic_launcher_original.jpg"):
              os.makedirs("keygen/src/main/res/drawable", exist_ok=True)
              shutil.copyfile(
                  "app/src/main/res/drawable/ic_launcher_original.jpg",
                  "keygen/src/main/res/drawable/ic_launcher_original.jpg"
              )
          os.makedirs("SanedAssistant-98-OpenSource/reconstructed-kotlin-src", exist_ok=True)
          shutil.copytree("app/src/main", "SanedAssistant-98-OpenSource/reconstructed-kotlin-src/main", dirs_exist_ok=True)
          shutil.make_archive("SanedAssistant-98-OpenSource", "zip", "SanedAssistant-98-OpenSource")
          print("Exported SanedAssistant-98-OpenSource.zip archive.")

          orig_seeds = [
              0x4A445256, 0x53414E45, 0x44393850, 0x524F5345,
              0x43555245, 0x39363635, 0x30353831, 0x32313431
          ]
          raw_master = bytearray(32)
          for idx, s in enumerate(orig_seeds):
              mixed = (s ^ ((0x5A3C96A5 + idx * 0x13579BDF) & 0xFFFFFFFF)) & 0xFFFFFFFF
              off = idx * 4
              raw_master[off]     = (mixed >> 24) & 0xFF
              raw_master[off + 1] = (mixed >> 16) & 0xFF
              raw_master[off + 2] = (mixed >> 8) & 0xFF
              raw_master[off + 3] = mixed & 0xFF

          expected_mk = hashlib.sha256(raw_master).digest()
          cert_bytes = bytes.fromhex("3884b766498a974598f523351f43cc4a7e0dadb405d3e88218a81693efb3420f")

          mask_a = secrets.token_bytes(32)
          mask_b = secrets.token_bytes(32)
          enc_mk = bytes(expected_mk[i] ^ mask_a[i] ^ ((mask_b[i] + (i * 17)) & 0xFF) for i in range(32))

          cert_mask = secrets.token_bytes(32)
          enc_cert = bytes(cert_bytes[i] ^ cert_mask[i] ^ ((0xA5 + (i * 9)) & 0xFF) for i in range(32))

          plain_slots = [
              "https://gateway.saned.io/api/v1/dispatch/accept-dispatch/",
              "https://gateway.saned.io/api/v1/dispatch/reject/",
              "https://gateway.saned.io/api/v1/dispatch/active",
              "https://gateway.saned.io/api/v1/dispatch-location/contact-number/",
              "net.saned.core.SanedFCMNotificationHandler",
              "net.jahez.fleets.dispatch.accept.IncomingDispatchActivity",
              "dispatches_db",
              "SELECT di.dispatchId, di.referenceId, di.status, v.vendorName, c.subscriberName, NULL, c.clientPhone, "
              "l.pickupLatitude, l.pickupLongitude, l.destinationLatitude, l.destinationLongitude, l.distance, "
              "p.deliveryPrice, p.collectionAmount, p.currencyCode, p.paymentMethod, a.buildingName, a.buildingNumber, "
              "a.houseNumber, a.streetName, a.roadNumber, a.blockNumber, a.apartmentNumber, a.floor, a.lane, "
              "a.officeName, a.region, a.additionalInformation FROM dispatch_info di "
              "LEFT JOIN vendor v ON v.dispatchId = di.dispatchId LEFT JOIN client c ON c.dispatchId = di.dispatchId "
              "LEFT JOIN location l ON l.dispatchId = di.dispatchId LEFT JOIN payment p ON p.dispatchId = di.dispatchId "
              "LEFT JOIN address a ON a.dispatchId = di.dispatchId",
              "AIzaSyDngGva2vOywyZGjSvoGQqnIr-IC3v4FVE",
              "https://raw.githubusercontent.com/Hassinalhadi/jdriver_control/main/jdriver_control_v2.json",
              "https://raw.githubusercontent.com/Hassinalhadi/jdriver_control/master/jdriver_control_v2.json",
              "https://cdn.jsdelivr.net/gh/Hassinalhadi/jdriver_control@main/jdriver_control_v2.json",
              "https://cdn.jsdelivr.net/gh/Hassinalhadi/jdriver_control@master/jdriver_control_v2.json",
              "https://raw.githubusercontent.com/Hassinalhadi/my-saned/main/jdriver_control_v2.json",
              "https://raw.githubusercontent.com/Hassinalhadi/my-saned/master/jdriver_control_v2.json",
              "githubusercontent.com",
              "jsdelivr.net",
              "jdriver_control",
              "/system/etc/hosts",
          ]

          enc_slots = []
          for slot_idx, text in enumerate(plain_slots):
              raw_b = text.encode("utf-8")
              out_b = bytearray(len(raw_b))
              for blk in range((len(raw_b) + 31) // 32):
                  ks = hashlib.sha256(expected_mk + bytes([slot_idx, blk])).digest()
                  for j in range(32):
                      pos = blk * 32 + j
                      if pos < len(raw_b):
                          out_b[pos] = raw_b[pos] ^ ks[j]
              enc_slots.append(bytes(out_b))

          def fmt_cpp(b: bytes) -> str:
              return ", ".join(f"0x{x:02x}" for x in b)

          def fmt_kt(b: bytes) -> str:
              return ", ".join(f"0x{x:02x}.toByte()" for x in b)

          cpp_slots_defs = []
          cpp_slots_ptr = []
          cpp_slots_len = []
          kt_slots_defs = []
          for idx, eb in enumerate(enc_slots):
              cpp_slots_defs.append(f"static const uint8_t kSlot{idx}[{len(eb)}] = {{ {fmt_cpp(eb)} }};")
              cpp_slots_ptr.append(f"kSlot{idx}")
              cpp_slots_len.append(str(len(eb)))
              kt_slots_defs.append(f"byteArrayOf({fmt_kt(eb)})")

          cpp_slots_defs_str = "\n          ".join(cpp_slots_defs)
          cpp_slots_ptr_str = ", ".join(cpp_slots_ptr)
          cpp_slots_len_str = ", ".join(cpp_slots_len)
          kt_slots_defs_str = ",\n                  ".join(kt_slots_defs)

          cpp_path = "/tmp/jdriver_sec.cpp"
          with open(cpp_path, "w", encoding="utf-8") as f:
              f.write(f"""#include <jni.h>
          #include <stdint.h>
          #include <string.h>
          #include <stdio.h>

          namespace {{

          static const uint8_t kMaskA[32] = {{ {fmt_cpp(mask_a)} }};
          static const uint8_t kMaskB[32] = {{ {fmt_cpp(mask_b)} }};
          static const uint8_t kEncMk[32] = {{ {fmt_cpp(enc_mk)} }};
          static const uint8_t kCertMask[32] = {{ {fmt_cpp(cert_mask)} }};
          static const uint8_t kEncCert[32] = {{ {fmt_cpp(enc_cert)} }};

          {cpp_slots_defs_str}
          static const uint8_t* const kSlots[19] = {{ {cpp_slots_ptr_str} }};
          static const size_t kSlotLens[19] = {{ {cpp_slots_len_str} }};

          struct Sha256Ctx {{
              uint32_t state[8];
              uint64_t bitcount;
              uint8_t buffer[64];
          }};

          static const uint32_t K256[64] = {{
              0x428a2f98UL, 0x71374491UL, 0xb5c0fbcfUL, 0xe9b5dba5UL,
              0x3956c25bUL, 0x59f111f1UL, 0x923f82a4UL, 0xab1c5ed5UL,
              0xd807aa98UL, 0x12835b01UL, 0x243185beUL, 0x550c7dc3UL,
              0x72be5d74UL, 0x80deb1feUL, 0x9bdc06a7UL, 0xc19bf174UL,
              0xe49b69c1UL, 0xefbe4786UL, 0x0fc19dc6UL, 0x240ca1ccUL,
              0x2de92c6fUL, 0x4a7484aaUL, 0x5cb0a9dcUL, 0x76f988daUL,
              0x983e5152UL, 0xa831c66dUL, 0xb00327c8UL, 0xbf597fc7UL,
              0xc6e00bf3UL, 0xd5a79147UL, 0x06ca6351UL, 0x14292967UL,
              0x27b70a85UL, 0x2e1b2138UL, 0x4d2c6dfcUL, 0x53380d13UL,
              0x650a7354UL, 0x766a0abbUL, 0x81c2c92eUL, 0x92722c85UL,
              0xa2bfe8a1UL, 0xa81a664bUL, 0xc24b8b70UL, 0xc76c51a3UL,
              0xd192e819UL, 0xd6990624UL, 0xf40e3585UL, 0x106aa070UL,
              0x19a4c116UL, 0x1e376c08UL, 0x2748774cUL, 0x34b0bcb5UL,
              0x391c0cb3UL, 0x4ed8aa4aUL, 0x5b9cca4fUL, 0x682e6ff3UL,
              0x748f82eeUL, 0x78a5636fUL, 0x84c87814UL, 0x8cc70208UL,
              0x90befffaUL, 0xa4506cebUL, 0xbef9a3f7UL, 0xc67178f2UL
          }};

          inline uint32_t rotr32(uint32_t x, uint32_t n) {{
              return (x >> n) | (x << (32 - n));
          }}

          void sha256_transform(Sha256Ctx* ctx, const uint8_t data[64]) {{
              uint32_t w[64];
              for (int i = 0; i < 16; ++i) {{
                  w[i] = (static_cast<uint32_t>(data[i * 4]) << 24) |
                         (static_cast<uint32_t>(data[i * 4 + 1]) << 16) |
                         (static_cast<uint32_t>(data[i * 4 + 2]) << 8) |
                         (static_cast<uint32_t>(data[i * 4 + 3]));
              }}
              for (int i = 16; i < 64; ++i) {{
                  uint32_t s0 = rotr32(w[i - 15], 7) ^ rotr32(w[i - 15], 18) ^ (w[i - 15] >> 3);
                  uint32_t s1 = rotr32(w[i - 2], 17) ^ rotr32(w[i - 2], 19) ^ (w[i - 2] >> 10);
                  w[i] = w[i - 16] + s0 + w[i - 7] + s1;
              }}
              uint32_t a = ctx->state[0], b = ctx->state[1], c = ctx->state[2], d = ctx->state[3];
              uint32_t e = ctx->state[4], f = ctx->state[5], g = ctx->state[6], h = ctx->state[7];
              for (int i = 0; i < 64; ++i) {{
                  uint32_t S1 = rotr32(e, 6) ^ rotr32(e, 11) ^ rotr32(e, 25);
                  uint32_t ch = (e & f) ^ ((~e) & g);
                  uint32_t temp1 = h + S1 + ch + K256[i] + w[i];
                  uint32_t S0 = rotr32(a, 2) ^ rotr32(a, 13) ^ rotr32(a, 22);
                  uint32_t maj = (a & b) ^ (a & c) ^ (b & c);
                  uint32_t temp2 = S0 + maj;
                  h = g; g = f; f = e; e = d + temp1;
                  d = c; c = b; b = a; a = temp1 + temp2;
              }}
              ctx->state[0] += a; ctx->state[1] += b; ctx->state[2] += c; ctx->state[3] += d;
              ctx->state[4] += e; ctx->state[5] += f; ctx->state[6] += g; ctx->state[7] += h;
          }}

          void sha256_init(Sha256Ctx* ctx) {{
              ctx->state[0] = 0x6a09e667UL; ctx->state[1] = 0xbb67ae85UL;
              ctx->state[2] = 0x3c6ef372UL; ctx->state[3] = 0xa54ff53aUL;
              ctx->state[4] = 0x510e527fUL; ctx->state[5] = 0x9b05688cUL;
              ctx->state[6] = 0x1f83d9abUL; ctx->state[7] = 0x5be0cd19UL;
              ctx->bitcount = 0;
              memset(ctx->buffer, 0, sizeof(ctx->buffer));
          }}

          void sha256_update(Sha256Ctx* ctx, const uint8_t* data, size_t len) {{
              if (len == 0) return;
              size_t idx = static_cast<size_t>((ctx->bitcount >> 3) & 0x3F);
              ctx->bitcount += static_cast<uint64_t>(len) << 3;
              size_t partLen = 64 - idx;
              size_t i = 0;
              if (len >= partLen) {{
                  memcpy(&ctx->buffer[idx], data, partLen);
                  sha256_transform(ctx, ctx->buffer);
                  for (i = partLen; i + 63 < len; i += 64) {{
                      sha256_transform(ctx, &data[i]);
                  }}
                  idx = 0;
              }}
              memcpy(&ctx->buffer[idx], &data[i], len - i);
          }}

          void sha256_final(Sha256Ctx* ctx, uint8_t out[32]) {{
              uint8_t bits[8];
              for (int i = 0; i < 8; ++i) {{
                  bits[i] = static_cast<uint8_t>((ctx->bitcount >> ((7 - i) * 8)) & 0xFF);
              }}
              size_t idx = static_cast<size_t>((ctx->bitcount >> 3) & 0x3F);
              size_t padLen = (idx < 56) ? (56 - idx) : (120 - idx);
              uint8_t pad[64] = {{0x80}};
              sha256_update(ctx, pad, padLen);
              sha256_update(ctx, bits, 8);
              for (int i = 0; i < 8; ++i) {{
                  out[i * 4]     = static_cast<uint8_t>((ctx->state[i] >> 24) & 0xFF);
                  out[i * 4 + 1] = static_cast<uint8_t>((ctx->state[i] >> 16) & 0xFF);
                  out[i * 4 + 2] = static_cast<uint8_t>((ctx->state[i] >> 8) & 0xFF);
                  out[i * 4 + 3] = static_cast<uint8_t>(ctx->state[i] & 0xFF);
              }}
          }}

          void hmac_sha256(const uint8_t key[32], const uint8_t* msg, size_t msg_len, uint8_t out[32]) {{
              uint8_t k_ipad[64];
              uint8_t k_opad[64];
              for (int i = 0; i < 64; ++i) {{
                  uint8_t kb = (i < 32) ? key[i] : 0;
                  k_ipad[i] = kb ^ 0x36;
                  k_opad[i] = kb ^ 0x5c;
              }}
              uint8_t inner[32];
              Sha256Ctx ctx;
              sha256_init(&ctx);
              sha256_update(&ctx, k_ipad, 64);
              sha256_update(&ctx, msg, msg_len);
              sha256_final(&ctx, inner);

              sha256_init(&ctx);
              sha256_update(&ctx, k_opad, 64);
              sha256_update(&ctx, inner, 32);
              sha256_final(&ctx, out);
          }}

          inline void decode_cert(uint8_t out[32]) {{
              for (int i = 0; i < 32; ++i) {{
                  out[i] = kEncCert[i] ^ kCertMask[i] ^ static_cast<uint8_t>((0xA5 + (i * 9)) & 0xFF);
              }}
          }}

          inline void unpack_mk(JNIEnv* env, jbyteArray cert_sha256_arr, jboolean allow_embedded, uint8_t out_mk[32]) {{
              uint8_t expected[32];
              decode_cert(expected);
              bool sig_ok = false;
              if (cert_sha256_arr != nullptr && env->GetArrayLength(cert_sha256_arr) == 32) {{
                  jbyte* actual = env->GetByteArrayElements(cert_sha256_arr, nullptr);
                  if (actual) {{
                      uint8_t diff = 0;
                      for (int i = 0; i < 32; ++i) diff |= (static_cast<uint8_t>(actual[i]) ^ expected[i]);
                      sig_ok = (diff == 0);
                      env->ReleaseByteArrayElements(cert_sha256_arr, actual, JNI_ABORT);
                  }}
              }} else if (allow_embedded == JNI_TRUE) {{
                  sig_ok = true;
              }}
              uint8_t mask_mod = sig_ok ? 0x00 : 0x5A;
              for (int i = 0; i < 32; ++i) {{
                  uint8_t b = kEncMk[i] ^ kMaskA[i] ^ static_cast<uint8_t>((kMaskB[i] + (i * 17)) & 0xFF);
                  out_mk[i] = b ^ mask_mod;
              }}
              memset(expected, 0, sizeof(expected));
          }}

          }} // namespace

          extern "C" JNIEXPORT jbyteArray JNICALL
          Java_dev_saned_assistant_SecurityBridge_nativeExpectedCertSha256(JNIEnv* env, jclass) {{
              uint8_t cert[32];
              decode_cert(cert);
              jbyteArray arr = env->NewByteArray(32);
              if (arr) env->SetByteArrayRegion(arr, 0, 32, reinterpret_cast<const jbyte*>(cert));
              memset(cert, 0, sizeof(cert));
              return arr;
          }}

          extern "C" JNIEXPORT jbyteArray JNICALL
          Java_dev_saned_assistant_SecurityBridge_nativeDeriveMasterKey(
                  JNIEnv* env, jclass, jbyteArray cert_sha256_arr, jboolean allow_embedded) {{
              uint8_t out_mk[32];
              unpack_mk(env, cert_sha256_arr, allow_embedded, out_mk);
              jbyteArray res = env->NewByteArray(32);
              if (res) env->SetByteArrayRegion(res, 0, 32, reinterpret_cast<const jbyte*>(out_mk));
              memset(out_mk, 0, sizeof(out_mk));
              return res;
          }}

          extern "C" JNIEXPORT jbyteArray JNICALL
          Java_dev_saned_assistant_SecurityBridge_nativeDecryptSlot(
                  JNIEnv* env, jclass, jbyteArray cert_sha256_arr, jboolean allow_embedded, jint slot_idx) {{
              if (slot_idx < 0 || slot_idx >= 19) return nullptr;
              uint8_t mk[32];
              unpack_mk(env, cert_sha256_arr, allow_embedded, mk);

              const uint8_t* enc_ptr = kSlots[slot_idx];
              size_t slen = kSlotLens[slot_idx];
              jbyteArray out_arr = env->NewByteArray(static_cast<jsize>(slen));
              if (!out_arr) {{
                  memset(mk, 0, sizeof(mk));
                  return nullptr;
              }}

              uint8_t dec_buf[1024];
              if (slen > sizeof(dec_buf)) slen = sizeof(dec_buf);
              size_t num_blocks = (slen + 31) / 32;
              for (size_t blk = 0; blk < num_blocks; ++blk) {{
                  uint8_t seed[34];
                  memcpy(seed, mk, 32);
                  seed[32] = static_cast<uint8_t>(slot_idx & 0xFF);
                  seed[33] = static_cast<uint8_t>(blk & 0xFF);
                  uint8_t ks[32];
                  Sha256Ctx sctx;
                  sha256_init(&sctx);
                  sha256_update(&sctx, seed, 34);
                  sha256_final(&sctx, ks);
                  for (size_t j = 0; j < 32; ++j) {{
                      size_t pos = blk * 32 + j;
                      if (pos < slen) {{
                          dec_buf[pos] = enc_ptr[pos] ^ ks[j];
                      }}
                  }}
              }}
              env->SetByteArrayRegion(out_arr, 0, static_cast<jsize>(slen), reinterpret_cast<const jbyte*>(dec_buf));
              memset(dec_buf, 0, sizeof(dec_buf));
              memset(mk, 0, sizeof(mk));
              return out_arr;
          }}

          extern "C" JNIEXPORT jbyteArray JNICALL
          Java_dev_saned_assistant_SecurityBridge_nativeComputeHmacSha256(
                  JNIEnv* env, jclass, jbyteArray cert_sha256_arr, jboolean allow_embedded, jbyteArray msg_arr) {{
              if (!msg_arr) return nullptr;
              uint8_t mk[32];
              unpack_mk(env, cert_sha256_arr, allow_embedded, mk);
              jsize mlen = env->GetArrayLength(msg_arr);
              jbyte* mptr = env->GetByteArrayElements(msg_arr, nullptr);
              uint8_t mac[32] = {{0}};
              if (mptr) {{
                  hmac_sha256(mk, reinterpret_cast<const uint8_t*>(mptr), static_cast<size_t>(mlen), mac);
                  env->ReleaseByteArrayElements(msg_arr, mptr, JNI_ABORT);
              }}
              jbyteArray out = env->NewByteArray(32);
              if (out) env->SetByteArrayRegion(out, 0, 32, reinterpret_cast<const jbyte*>(mac));
              memset(mk, 0, sizeof(mk));
              memset(mac, 0, sizeof(mac));
              return out;
          }}

          extern "C" JNIEXPORT jbyteArray JNICALL
          Java_dev_saned_assistant_SecurityBridge_nativeBuildTrialPayload20(
                  JNIEnv* env, jclass, jbyteArray cert_sha256_arr, jint dev_hash, jbyteArray nonce_seed_arr) {{
              if (!nonce_seed_arr || env->GetArrayLength(nonce_seed_arr) < 2) return nullptr;
              uint8_t mk[32];
              unpack_mk(env, cert_sha256_arr, JNI_FALSE, mk);

              jbyte* nptr = env->GetByteArrayElements(nonce_seed_arr, nullptr);
              uint8_t nonce2[2] = {{ static_cast<uint8_t>(nptr[0]), static_cast<uint8_t>(nptr[1]) }};
              env->ReleaseByteArrayElements(nonce_seed_arr, nptr, JNI_ABORT);

              uint32_t exp_code = 0x80000000UL | 1440UL;
              uint8_t plain12[12];
              plain12[0] = static_cast<uint8_t>((static_cast<uint32_t>(dev_hash) >> 24) & 0xFF);
              plain12[1] = static_cast<uint8_t>((static_cast<uint32_t>(dev_hash) >> 16) & 0xFF);
              plain12[2] = static_cast<uint8_t>((static_cast<uint32_t>(dev_hash) >> 8) & 0xFF);
              plain12[3] = static_cast<uint8_t>(static_cast<uint32_t>(dev_hash) & 0xFF);
              plain12[4] = static_cast<uint8_t>((exp_code >> 24) & 0xFF);
              plain12[5] = static_cast<uint8_t>((exp_code >> 16) & 0xFF);
              plain12[6] = static_cast<uint8_t>((exp_code >> 8) & 0xFF);
              plain12[7] = static_cast<uint8_t>(exp_code & 0xFF);
              plain12[8] = 1;
              plain12[9] = 0x0F;
              plain12[10] = 0x4A;
              plain12[11] = 0x44;

              Sha256Ctx sctx;
              sha256_init(&sctx);
              sha256_update(&sctx, mk, 32);
              sha256_update(&sctx, nonce2, 2);
              uint8_t stream[32];
              sha256_final(&sctx, stream);

              uint8_t enc12[12];
              for (int i = 0; i < 12; ++i) enc12[i] = plain12[i] ^ stream[i];

              uint8_t mac_in[14];
              memcpy(mac_in, enc12, 12);
              memcpy(mac_in + 12, nonce2, 2);
              uint8_t mac_full[32];
              hmac_sha256(mk, mac_in, 14, mac_full);

              uint8_t full20[20];
              memcpy(full20, enc12, 12);
              memcpy(full20 + 12, nonce2, 2);
              memcpy(full20 + 14, mac_full, 6);

              jbyteArray out = env->NewByteArray(20);
              if (out) env->SetByteArrayRegion(out, 0, 20, reinterpret_cast<const jbyte*>(full20));
              memset(mk, 0, sizeof(mk));
              memset(full20, 0, sizeof(full20));
              return out;
          }}
          """)

          sdk_root = os.environ.get("ANDROID_HOME") or os.environ.get("ANDROID_SDK_ROOT") or "/usr/local/lib/android/sdk"
          clang_bins = sorted(glob.glob(f"{sdk_root}/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/bin"))
          if clang_bins:
              bin_dir = clang_bins[-1]
              print(f"Found pre-installed NDK toolchain: {bin_dir}")
              targets = [
                  ("arm64-v8a", "aarch64-linux-android26-clang++"),
                  ("armeabi-v7a", "armv7a-linux-androideabi26-clang++"),
