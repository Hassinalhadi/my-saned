              for (int r = 0; r < 16; ++r) {{
                  uint8_t sh_local[32];
                  const volatile uint8_t* sh_ptr = kShards[r & 3];
                  for (int k = 0; k < 32; ++k) sh_local[k] = sh_ptr[k];
