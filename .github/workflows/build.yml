                      val code = respObj.javaClass.getMethod("code").invoke(respObj) as? Int ?: 0
                      var retryAfter = ""
                      var hdrsSummary = ""
                      try {
                          val headersObj = respObj.javaClass.getMethod("headers").invoke(respObj)
