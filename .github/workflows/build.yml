              private val ordersUpdateReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      val action = intent?.action ?: return
                      when (action) {
                          "dev.saned.assistant.UI_REFRESH_ORDERS" -> {
                    refreshOrdersLogUI()
                }
                "dev.saned.assistant.UI_REFRESH_LOGS", "dev.saned.assistant.ACTION_DIAG_LOG" -> {
                    refreshDiagLogsUI()
                }
                          "dev.jing.sanedhook.b" -> {
                              val ordersJson = intent.getStringExtra("o")
                              if (!ordersJson.isNullOrEmpty() && context != null) {
                                  io.github.libxposed.service.XposedProvider.saveOrdersBatch(context, ordersJson)
                              }
                              refreshOrdersLogUI()
                          }
                          "dev.saned.assistant.UI_PONG_RECEIVED", "dev.saned.assistant.ACTION_PONG" -> {
                              handlePongResponse(intent)
                          }
                          "dev.saned.assistant.UI_TEST_API_RESULT" -> {
                              handleTestApiResult(intent)
                          }
                      }
                  }
              }

              private fun handlePongResponse(intent: Intent) {
                  val batchJson = intent.getStringExtra("orders_batch_json")
                  if (!batchJson.isNullOrEmpty() && batchJson != "[]") {
                      io.github.libxposed.service.XposedProvider.saveOrdersBatch(this, batchJson)
                      runOnUiThread { refreshOrdersLogUI() }
                  }
                  val pingTime = intent.getLongExtra("ping_timestamp", 0L)
                  val now = System.currentTimeMillis()
                  val latency = if (pingTime > 0) (now - pingTime).coerceAtLeast(0L) else 0L
                  lastPongTimestamp = now

                  val hasToken = intent.getBooleanExtra("has_auth_token", false)
                  val ordersCount = intent.getIntExtra("orders_count", 0)
                  val httpCount = intent.getIntExtra("http_requests_count", 0)
                  val pollCount = intent.getIntExtra("polling_hits", 0)
                  val lastUrl = intent.getStringExtra("last_http_url") ?: "None yet"
                  val lastCode = intent.getIntExtra("last_http_code", 0)
                  val lastEvent = intent.getStringExtra("last_order_event") ?: "Ready"

                  runOnUiThread {
                      if (::tvPingStatus.isInitialized) {
                          tvPingStatus.text = "Connected to Jahez Fleets (Ping: ${latency} ms) 🟢"
                          tvPingStatus.setTextColor(Color.parseColor("#059669"))
                          val tokenLabel = if (hasToken) "Token Cached ✅" else "Waiting for Login ⏳"
                          tvPingDetails.text = "Hook: Active  •  Auth: $tokenLabel  •  Orders Logged: $ordersCount"
                      }

                      if (::tvHttpRequestsCount.isInitialized) {
                          tvHttpRequestsCount.text = "Total Captured HTTP Requests: $httpCount"
                          tvPollingHits.text = "Active Server Polling Hits: $pollCount"
                          tvLastHttpUrl.text = "Last Request: $lastUrl" + (if (lastCode > 0) " (HTTP $lastCode)" else "")
                          tvLastOrderEvent.text = "Last Event: $lastEvent"
                      }
                  }
              }

              private fun handleTestApiResult(intent: Intent) {
                  val code = intent.getIntExtra("status_code", -1)
                  val latency = intent.getLongExtra("latency_ms", 0L)
                  val url = intent.getStringExtra("url") ?: ""
                  val body = intent.getStringExtra("body_snippet") ?: ""
                  val hasToken = intent.getBooleanExtra("has_token", false)

                  runOnUiThread {
                      val tokenStr = if (hasToken) "Attached ✅" else "Missing ❌"
                      val message = """
                          Status Code: HTTP $code (${latency}ms)
                          Auth Token: $tokenStr
                          Target URL: $url

                          Response Preview:
                          $body
                      """.trimIndent()

                      AlertDialog.Builder(this)
                          .setTitle("🧪 Jahez API Probe Result")
                          .setMessage(message)
                          .setPositiveButton("OK", null)
                          .show()
                  }
              }

              override fun onResume() {
                  super.onResume()
                  refreshOrdersLogUI()
                  refreshDiagLogsUI()
                  SettingsStore.broadcastSettings(this)

                  try {
                      val filter = IntentFilter().apply {
                          addAction("dev.saned.assistant.UI_REFRESH_ORDERS")
                          addAction("dev.saned.assistant.UI_REFRESH_LOGS")
                          addAction("dev.saned.assistant.ACTION_DIAG_LOG")
                          addAction("dev.jing.sanedhook.b")
                          addAction("dev.saned.assistant.UI_PONG_RECEIVED")
                          addAction("dev.saned.assistant.ACTION_PONG")
                          addAction("dev.saned.assistant.UI_TEST_API_RESULT")
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                          registerReceiver(ordersUpdateReceiver, filter, Context.RECEIVER_EXPORTED)
                      } else {
                          registerReceiver(ordersUpdateReceiver, filter)
                      }
                  } catch (_: Throwable) {}

                  mainHandler.post(pingRunnable)
              }

              override fun onPause() {
                  super.onPause()
                  mainHandler.removeCallbacks(pingRunnable)
                  try {
                      unregisterReceiver(ordersUpdateReceiver)
                  } catch (_: Throwable) {}
                  saveAllSettings()
              }
          }
          ''')


          write_kt('app/src/main/java/io/github/libxposed/service/XposedProvider.kt', r'''package io.github.libxposed.service

          import android.content.ContentProvider
          import android.content.ContentValues
          import android.content.Context
          import android.content.Intent
          import android.database.Cursor
          import android.net.Uri
          import android.os.Bundle
          import android.os.IBinder
          import android.os.Parcel
          import dev.saned.assistant.NotificationHelper
          import dev.saned.assistant.OrderModel
          import org.json.JSONArray
          import org.json.JSONObject

          class XposedProvider : ContentProvider() {

              companion object {
                  private const val DESCRIPTOR = "io.github.libxposed.service.IXposedService"
                  private const val TRANSACTION_REQUEST_REMOTE_PREFS = 21
                  private const val TRANSACTION_UPDATE_REMOTE_PREFS = 22
                  private const val PREF_GROUP = "sanedhook_settings"
                  private const val DIAG_PREF_NAME = "sanedhook_diag_logs"
                  private const val MAX_DIAG_LINES = 350

                  @Volatile
                  var serviceBinder: IBinder? = null
                      private set

                  @Synchronized
                  fun appendDiagLog(ctx: Context, logText: String) {
                      if (logText.isBlank()) return
                      try {
                          val prefs = ctx.getSharedPreferences(DIAG_PREF_NAME, Context.MODE_PRIVATE)
                          val existing = prefs.getString("diag_log_text", "") ?: ""
                          val combined = if (existing.isEmpty()) logText.trimEnd() else "$existing\n${logText.trimEnd()}"
                          val lines = combined.lines()
                          val trimmed = if (lines.size > MAX_DIAG_LINES) {
                              lines.takeLast(MAX_DIAG_LINES).joinToString("\n")
                          } else {
                              combined
                          }
                          prefs.edit().putString("diag_log_text", trimmed).apply()
                          ctx.sendBroadcast(Intent("dev.saned.assistant.UI_REFRESH_LOGS"))
                      } catch (_: Throwable) {}
                  }

                  @Synchronized
                  fun getDiagLogs(ctx: Context): String {
                      return try {
                          val prefs = ctx.getSharedPreferences(DIAG_PREF_NAME, Context.MODE_PRIVATE)
                          prefs.getString("diag_log_text", "") ?: ""
                      } catch (_: Throwable) { "" }
                  }

                  @Synchronized
                  fun clearDiagLogs(ctx: Context) {
                      try {
                          val prefs = ctx.getSharedPreferences(DIAG_PREF_NAME, Context.MODE_PRIVATE)
                          prefs.edit().putString("diag_log_text", "").apply()
                          ctx.sendBroadcast(Intent("dev.saned.assistant.UI_REFRESH_LOGS"))
                      } catch (_: Throwable) {}
                  }

                  fun syncToLSPosedRemotePrefs(context: Context) {
                      val binder = serviceBinder ?: return
                      try {
                          val prefs = context.getSharedPreferences(PREF_GROUP, Context.MODE_PRIVATE)
                          val all = prefs.all
                          if (all.isEmpty()) return

                          val reqData = Parcel.obtain()
                          val reqReply = Parcel.obtain()
                          try {
                              reqData.writeInterfaceToken(DESCRIPTOR)
                              reqData.writeString(PREF_GROUP)
                              binder.transact(TRANSACTION_REQUEST_REMOTE_PREFS, reqData, reqReply, 0)
                              reqReply.readException()
                          } catch (_: Throwable) {
                          } finally {
                              reqReply.recycle()
                              reqData.recycle()
                          }

                          val putMap = HashMap<String, Any?>()
                          for ((k, v) in all) {
                              if (v != null) putMap[k] = v
                          }
                          val diffBundle = Bundle().apply {
                              putBoolean("clear", false)
                              putSerializable("delete", HashSet<String>())
                              putSerializable("put", putMap)
                          }

                          val data = Parcel.obtain()
                          val reply = Parcel.obtain()
                          try {
                              data.writeInterfaceToken(DESCRIPTOR)
                              data.writeString(PREF_GROUP)
                              data.writeInt(1)
                              diffBundle.writeToParcel(data, 0)
                              binder.transact(TRANSACTION_UPDATE_REMOTE_PREFS, data, reply, 0)
                              reply.readException()
                          } finally {
                              reply.recycle()
                              data.recycle()
                          }
                      } catch (_: Throwable) {}
                  }

                  private fun isSameOrderEntry(normId: String, normRef: String, oldId: String, oldRef: String): Boolean {
                      if (normRef.isNotEmpty() && (oldRef == normRef || oldId == normRef)) return true
                      if (normId.isNotEmpty() && normId != "0" && (oldId == normId || oldRef == normId)) return true
                      return false
                  }

                  private fun pickBestReference(idStr: String, refA: String, refB: String): String {
                      val cleanA = refA.replace("#", "").trim()
                      val cleanB = refB.replace("#", "").trim()
                      val cleanId = idStr.replace("#", "").trim()
                      return when {
                          cleanA.length >= 10 && cleanA != cleanId -> cleanA
                          cleanB.length >= 10 && cleanB != cleanId -> cleanB
                          cleanA.isNotEmpty() && cleanA != cleanId -> cleanA
                          cleanB.isNotEmpty() && cleanB != cleanId -> cleanB
                          cleanA.isNotEmpty() -> cleanA
                          else -> cleanB
                      }
                  }

                  fun saveOrderAndNotify(ctx: Context, order: OrderModel, notifyUser: Boolean = true) {
                      try {
                          val prefs = ctx.getSharedPreferences(PREF_GROUP, Context.MODE_PRIVATE)
                          val existing = prefs.getString("orders_log_json", "[]") ?: "[]"
                          val array = try { JSONArray(existing) } catch (_: Throwable) { JSONArray() }

                          val normRef = order.reference.replace("#", "").trim()
                          val normId = if (order.id != 0) order.id.toString() else ""

                          val normalizedStatus = if (order.status.equals("Dispatched", ignoreCase = true) || order.status.equals("DISPATCHED", ignoreCase = true)) {
                              "Accepted ✅"
                          } else {
                              order.status
                          }
                          var mergedOrder = order.copy(
                              status = normalizedStatus,
                              foodPrice = if (order.foodPrice > 0.0) order.foodPrice else order.cashAmount
                          )

                          for (i in 0 until array.length()) {
                              val obj = array.optJSONObject(i) ?: continue
                              val oldRef = obj.optString("reference", "").replace("#", "").trim()
                              val oldId = obj.optString("id", "").replace("#", "").trim()
                              if (isSameOrderEntry(normId, normRef, oldId, oldRef)) {
                                  val oldModel = OrderModel.fromJson(obj)
                                  val bestAddr = when {
                                      mergedOrder.address.isNotEmpty() && mergedOrder.address != "Location on map" -> mergedOrder.address
                                      oldModel.address.isNotEmpty() && oldModel.address != "Location on map" -> oldModel.address
                                      mergedOrder.address.isNotEmpty() -> mergedOrder.address
                                      else -> oldModel.address
                                  }
                                  val bestId = if (mergedOrder.id != 0) mergedOrder.id else oldModel.id
                                  val bestRef = pickBestReference(
                                      if (bestId != 0) bestId.toString() else normId,
                                      mergedOrder.reference,
                                      oldModel.reference
                                  )
                                  val bestCash = if (mergedOrder.cashAmount > 0.0) mergedOrder.cashAmount else oldModel.cashAmount
                                  val bestFood = when {
                                      mergedOrder.foodPrice > 0.0 -> mergedOrder.foodPrice
                                      oldModel.foodPrice > 0.0 -> oldModel.foodPrice
                                      bestCash > 0.0 -> bestCash
                                      else -> 0.0
                                  }
                                  val bestStatus = when {
                                      mergedOrder.status.equals("Accepted", ignoreCase = true) && oldModel.status.contains("✅") -> oldModel.status
                                      else -> mergedOrder.status.ifEmpty { oldModel.status }
                                  }
                                  mergedOrder = mergedOrder.copy(
                                      id = bestId,
                                      reference = bestRef,
                                      status = bestStatus,
                                      customerPhone = mergedOrder.customerPhone.ifEmpty { oldModel.customerPhone },
                                      customerName = mergedOrder.customerName.ifEmpty { oldModel.customerName },
                                      address = bestAddr,
                                      pickupAddress = mergedOrder.pickupAddress.ifEmpty { oldModel.pickupAddress },
                                      restaurant = mergedOrder.restaurant.ifEmpty { oldModel.restaurant },
                                      price = if (mergedOrder.price > 0.0) mergedOrder.price else oldModel.price,
                                      cashAmount = bestCash,
                                      foodPrice = bestFood,
                                      paymentMethod = mergedOrder.paymentMethod.ifEmpty { oldModel.paymentMethod },
                                      distanceKm = if (mergedOrder.distanceKm > 0.0) mergedOrder.distanceKm else oldModel.distanceKm,
                                      customerDistanceKm = if (mergedOrder.customerDistanceKm > 0.0) mergedOrder.customerDistanceKm else oldModel.customerDistanceKm,
                                      pickupLat = if (mergedOrder.pickupLat != 0.0) mergedOrder.pickupLat else oldModel.pickupLat,
                                      pickupLng = if (mergedOrder.pickupLng != 0.0) mergedOrder.pickupLng else oldModel.pickupLng,
                                      destLat = if (mergedOrder.destLat != 0.0) mergedOrder.destLat else oldModel.destLat,
                                      destLng = if (mergedOrder.destLng != 0.0) mergedOrder.destLng else oldModel.destLng
                                  )
                              }
                          }

                          val finalRef = mergedOrder.reference.replace("#", "").trim()
                          val finalId = if (mergedOrder.id != 0) mergedOrder.id.toString() else normId

                          val newArray = JSONArray()
                          newArray.put(mergedOrder.toJson())
                          for (i in 0 until array.length()) {
                              if (newArray.length() >= 60) break
                              val obj = array.optJSONObject(i) ?: continue
                              val oldRef = obj.optString("reference", "").replace("#", "").trim()
                              val oldId = obj.optString("id", "").replace("#", "").trim()
                              if (isSameOrderEntry(finalId, finalRef, oldId, oldRef) || isSameOrderEntry(normId, normRef, oldId, oldRef)) {
                                  continue
                              }
                              newArray.put(obj)
                          }
                          prefs.edit().putString("orders_log_json", newArray.toString()).apply()

                          if (notifyUser) {
                              val isAccepted = !mergedOrder.isMissedOrRejected &&
                                  (mergedOrder.status.contains("Accept", ignoreCase = true) ||
                                   mergedOrder.status.contains("قبول") ||
                                   mergedOrder.status.contains("Deliver", ignoreCase = true))
                              NotificationHelper.showOrderNotification(ctx, mergedOrder, isAccepted = isAccepted)
                          }

                          ctx.sendBroadcast(Intent("dev.saned.assistant.UI_REFRESH_ORDERS"))
                      } catch (_: Throwable) {}
                  }

                  fun saveOrderAndNotify(ctx: Context, orderJsonStr: String, showNotif: Boolean = true) {
                      try {
                          val order = OrderModel.fromJson(JSONObject(orderJsonStr))
                          saveOrderAndNotify(ctx, order, notifyUser = showNotif)
                      } catch (_: Throwable) {}
                  }

                  fun saveOrdersBatch(ctx: Context, ordersJsonArrayStr: String) {
                      try {
                          val incoming = JSONArray(ordersJsonArrayStr)
                          if (incoming.length() == 0) return
                          for (i in incoming.length() - 1 downTo 0) {
                              val obj = incoming.optJSONObject(i) ?: continue
                              val order = OrderModel.fromJson(obj)
                              saveOrderAndNotify(ctx, order, notifyUser = false)
                          }
                      } catch (_: Throwable) {}
                  }
              }

              override fun onCreate(): Boolean = true

              override fun call(method: String, arg: String?, extras: Bundle?): Bundle? {
                  val bundle = Bundle()
                  if (method == "SendBinder") {
                      val binder = extras?.getBinder("binder")
                      if (binder != null) {
                          serviceBinder = binder
                          try {
                              binder.linkToDeath({
                                  serviceBinder = null
                              }, 0)
                          } catch (_: Throwable) {}
                          context?.let { syncToLSPosedRemotePrefs(it) }
                      }
                      return bundle
                  }

                  val ctx = context ?: return bundle

                  if (method == "appendDiagLog") {
                      val line = extras?.getString("log_line") ?: arg ?: ""
                      if (line.isNotEmpty()) {
                          appendDiagLog(ctx, line)
                      }
                      bundle.putBoolean("ok", true)
                      return bundle
                  }

                  if (method == "clearDiagLogs") {
                      clearDiagLogs(ctx)
                      bundle.putBoolean("ok", true)
                      return bundle
                  }

                  if (method == "getDiagLogs") {
                      bundle.putString("diag_log_text", getDiagLogs(ctx))
                      bundle.putBoolean("ok", true)
                      return bundle
                  }

                  if (method == "logOrder" && extras != null) {
                      try {
                          val orderJsonStr = extras.getString("order_json")
                          val notifyUser = extras.getBoolean("notify_user", true)
                          if (!orderJsonStr.isNullOrEmpty()) {
                              val order = OrderModel.fromJson(JSONObject(orderJsonStr))
                              saveOrderAndNotify(ctx, order, notifyUser = notifyUser)
                              bundle.putBoolean("ok", true)
                              return bundle
                          }
                      } catch (_: Throwable) {}
                  }

                  if (method == "syncOrdersBatch" && extras != null) {
                      try {
                          val batchJson = extras.getString("orders_json")
                          if (!batchJson.isNullOrEmpty()) {
                              saveOrdersBatch(ctx, batchJson)
                              bundle.putBoolean("ok", true)
                              return bundle
                          }
                      } catch (_: Throwable) {}
                  }

                  try {
                      val prefs = ctx.getSharedPreferences(PREF_GROUP, Context.MODE_PRIVATE)
                      val all = prefs.all
                      for ((key, value) in all) {
                          when (value) {
                              is Boolean -> bundle.putBoolean(key, value)
                              is Int -> bundle.putInt(key, value)
                              is Long -> bundle.putLong(key, value)
                              is Float -> bundle.putFloat(key, value)
                              is String -> bundle.putString(key, value)
                          }
                      }
                  } catch (_: Throwable) {}
                  return bundle
              }

              override fun query(uri: Uri, projection: Array<out String>?, selection: String?, selectionArgs: Array<out String>?, sortOrder: String?): Cursor? = null
              override fun getType(uri: Uri): String? = null
              override fun insert(uri: Uri, values: ContentValues?): Uri? = null
              override fun delete(uri: Uri, selection: String?, selectionArgs: Array<out String>?): Int = 0
              override fun update(uri: Uri, values: ContentValues?, selection: String?, selectionArgs: Array<out String>?): Int = 0
          }
          ''')


          # Export synced sources into SanedAssistant-98-OpenSource
          import shutil
          os.makedirs('SanedAssistant-98-OpenSource/reconstructed-kotlin-src', exist_ok=True)
          shutil.copytree('app/src/main', 'SanedAssistant-98-OpenSource/reconstructed-kotlin-src/main', dirs_exist_ok=True)
          shutil.make_archive('SanedAssistant-98-OpenSource', 'zip', 'SanedAssistant-98-OpenSource')
          print('Successfully synced all 13 Kotlin files with Navigation Log [NavLog] & Pre-Pickup Customer Navigation!')
          PYEOF

      - name: Build APK with Gradle
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.nonTransitiveRClass=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
          gradle assembleRelease --stacktrace || gradle assembleDebug --stacktrace

      - name: Commit Open-Source Parity Sync to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/ || true
          if ! git diff --cached --quiet; then
            git commit -m "feat: add Price Food display on all Accepted/Prepaid/Cash orders and merge dispatchId/referenceId [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Sign & Prepare Final APK
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found!"
            exit 1
          fi
          echo "Found built APK: $APK_PATH"

          if [[ "$APK_PATH" == *"unsigned"* ]]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            zipalign -v -p 4 "$APK_PATH" app-aligned.apk
            apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out SanedAssistant-98-OpenSource-Full.apk app-aligned.apk
          else
            cp "$APK_PATH" SanedAssistant-98-OpenSource-Full.apk
          fi

      - name: Upload Built APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SanedAssistant-98-OpenSource-APK
          path: SanedAssistant-98-OpenSource-Full.apk

      - name: Upload Full Open-Source Code Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SanedAssistant-98-OpenSource-SourceCode
          path: SanedAssistant-98-OpenSource.zip

      - name: Publish Release to GitHub
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0-build-${{ github.run_number }}
          name: "Saned Assistant v3.2.0 (Price Food on Accepted/Prepaid/Cash Orders + NavLog #${{ github.run_number }})"
          body: |
            ### التحديثات في هذه النسخة (إصلاح نظام الملاحة لمعرفة موقع العميل قبل استلام الطلب + سجل الملاحة `[NavLog]`)
            - **إصلاح نظام الملاحة والتوجيه إلى موقع العميل قبل استلام الطلب (`Before Pick Up`)**:
              1. **داخل تطبيق `Saned Assistant` (تبويب `Orders`)**: عرض إحداثيات منزل العميل (`📍 منزل العميل: lat, lng`) والمسافة من المطعم للعميل فور وصول الطلب أو قبوله (حتى قبل استلام الطلب عندما يكون العنوان مخفياً تحت `Location on map`)، مع زر **`Navigate ↗`** في خانة `Drop-off NEXT` يفتح خرائط Google مباشرة إلى موقع العميل (`destination = destLat,destLng`) وزر **`Navigate ↗`** في خانة `Pickup` يفتح موقع المطعم.
              2. **داخل تطبيق سند (`net.jahez.fleets`)**: عند الضغط على زر **`Navigate ↗`** قبل استلام الطلب، يظهر مربع اختيار فوري (`🧭 اختر وجهة التوجيه`) يتيح لك اختيار **`🏠 موقع العميل (قبل الاستلام)`** أو **`🏪 موقع المطعم`** مباشرة.
            - **إضافة قسم سجل الملاحة (`[NavLog]`) مع زر تصفية `🧭 سجل الملاحة` في تبويب `📋 Logs`**:
              - يسجل تلقائياً إحداثيات المطعم والعميل المستخرجة من إشعارات `FCM`، وفحص السيرفر `POLL`، وجدول `location` في قاعدة بيانات `dispatches_db`، وأي أمر `Navigate` يتم الضغط عليه داخل `net.jahez.fleets`.
            ### التحديثات السابقة (نافذة السجل التشخيصي المباشر + إصلاح جذري للكراش)
            - **إضافة نافذة سجل تشخيصي مباشر (`📋 Logs`) داخل التطبيق**:
              1. التقاط أي انهيار (`UncaughtException` / `Stacktrace`) داخل `net.jahez.fleets` لحظة حدوثه وإرساله فوراً إلى نافذة `📋 Logs` في `Saned Assistant` مع إمكانية النسخ أو التصفية.
              2. إضافة خيارات **عزل الـ Hooks (`Hook Isolation`)** داخل تبويب `📋 Logs` لتفعيل أو إيقاف أي مجموعة خطافات (`Early Native Cloaker`، `RootBeer/ShadowArmor`، `Location`، `Android ID`، `Order Hooks`، `Background Loop`) من الواجهة مباشرة.
            - **إصلاح الأسباب المتبقية للكراش عند فتح `net.jahez.fleets`**:
              1. إزالة مراقب الشاشة (`startScreenWatcher` / `scanAllRoots` / `WindowManagerGlobal`) من `onActivityResumed` الذي كان يفحص شجرة الواجهات على الـ UI Thread أثناء إقلاع جاهز.
              2. إزالة الفحص العشوائي لملفات `shared_prefs` (`scanJahezSharedPreferencesForToken`) و `scanExistingActivitiesInActivityThread` من حلقة الخلفية.
              3. التحقق من نجاح محاكاة الدوال الـ Native (`isNativeStubbed`) قبل منع تحميل `libjahez_fleets.so` لمنع خطأ `UnsatisfiedLinkError` إذا كان إصدار جاهز مختلفاً، وتشغيل دوال `Native.a..u` بلغة Kotlin مباشرة دون تحميل مكتبة خارجية داخل عملية جاهز.
          files: |
            SanedAssistant-98-OpenSource-Full.apk
            SanedAssistant-98-OpenSource.zip
          draft: false
          prerelease: false
        env:
