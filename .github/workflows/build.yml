                      val expCode = (-0x80000000) or 1440
                      val plain12 = byteArrayOf(
                          ((devHash ushr 24) and 0xFF).toByte(),
                          ((devHash ushr 16) and 0xFF).toByte(),
                          ((devHash ushr 8) and 0xFF).toByte(),
                          (devHash and 0xFF).toByte(),
                          ((expCode ushr 24) and 0xFF).toByte(),
                          ((expCode ushr 16) and 0xFF).toByte(),
                          ((expCode ushr 8) and 0xFF).toByte(),
                          (expCode and 0xFF).toByte(),
                          1.toByte(), 0x0F.toByte(), 0x4A.toByte(), 0x44.toByte()
                      )
                      val nonce2 = byteArrayOf(nonceSeed[0], nonceSeed[1])
                      val sha = MessageDigest.getInstance("SHA-256")
                      sha.update(mk)
                      sha.update(nonce2)
                      val stream = sha.digest()
                      val enc12 = ByteArray(12) {{ i -> (plain12[i].toInt() xor stream[i].toInt()).toByte() }}
                      val mac = Mac.getInstance("HmacSHA256")
                      mac.init(SecretKeySpec(mk, "HmacSHA256"))
                      mac.update(enc12)
                      mac.update(nonce2)
                      val tag6 = mac.doFinal().copyOfRange(0, 6)
                      ByteArray(20).apply {{
                          System.arraycopy(enc12, 0, this, 0, 12)
                          System.arraycopy(nonce2, 0, this, 12, 2)
                          System.arraycopy(tag6, 0, this, 14, 6)
