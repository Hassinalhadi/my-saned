                          .retryOnConnectionFailure(true)
                          .connectTimeout(2500, TimeUnit.MILLISECONDS)
                          .readTimeout(2500, TimeUnit.MILLISECONDS)
                          .writeTimeout(2500, TimeUnit.MILLISECONDS)
                          .build()
