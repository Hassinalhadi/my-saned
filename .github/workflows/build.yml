                  Sha256Ctx sctx;
                  sha256_init(&sctx);
                  sha256_update(&sctx, state, 32);
                  sha256_update(&sctx, sh_local, 32);
                  sha256_update(&sctx, rc, 2);
                  sha256_final(&sctx, state);
                  secure_zero(sh_local, sizeof(sh_local));
