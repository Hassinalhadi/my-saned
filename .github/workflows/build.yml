name: Android CI & Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Decompile APK to Open-Source, Sync 100% Parity & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Install Android Build & Decompilation Tools (JADX + Apktool)
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner apktool zip unzip wget curl python3

          # Install JADX 1.5.0 from GitHub Releases (fault-tolerant)
          if curl -fsSL https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip -o /tmp/jadx.zip; then
            sudo mkdir -p /opt/jadx
            sudo unzip -q -o /tmp/jadx.zip -d /opt/jadx
            sudo chmod +x /opt/jadx/bin/jadx || true
          fi

      - name: Decompile SanedAssistant-98-7bac1ec.apk into Full Open-Source Export
        run: |
          mkdir -p SanedAssistant-98-OpenSource
          if [ -f "SanedAssistant-98-7bac1ec.apk" ]; then
            if [ -x "/opt/jadx/bin/jadx" ]; then
              /opt/jadx/bin/jadx --export-gradle --deobf --show-bad-code \
                -d SanedAssistant-98-OpenSource/jadx-gradle-project \
                SanedAssistant-98-7bac1ec.apk || true
            fi
            apktool d -f SanedAssistant-98-7bac1ec.apk \
              -o SanedAssistant-98-OpenSource/apktool-exact || unzip -q -o SanedAssistant-98-7bac1ec.apk -d SanedAssistant-98-OpenSource/apk-unpacked
          fi

      - name: Sync 100% SanedAssistant-98 Parity (Native, Icons, Audio, UI & All 4 Order Sources)
        run: |
          python3 - << 'PYEOF'
          import os, re, zipfile

          def replace_block(src, start_marker, end_marker, replacement):
              i1 = src.find(start_marker)
              i2 = src.find(end_marker, i1 if i1 != -1 else 0)
              if i1 != -1 and i2 != -1 and i2 > i1:
                  return src[:i1] + replacement + "\n\n    " + src[i2:]
              return src

          # 1. Extract libshnative.so and original icons (DQ.jpg, ZI.png, iQ.png) from SanedAssistant-98-7bac1ec.apk
          apk_path = "SanedAssistant-98-7bac1ec.apk"
          if os.path.exists(apk_path):
              os.makedirs("app/src/main/jniLibs/arm64-v8a", exist_ok=True)
              os.makedirs("app/src/main/res/drawable", exist_ok=True)
              with zipfile.ZipFile(apk_path, "r") as zf:
                  names = set(zf.namelist())
                  if "lib/arm64-v8a/libshnative.so" in names:
                      open("app/src/main/jniLibs/arm64-v8a/libshnative.so", "wb").write(zf.read("lib/arm64-v8a/libshnative.so"))
                  if "res/DQ.jpg" in names:
                      open("app/src/main/res/drawable/ic_launcher_original.jpg", "wb").write(zf.read("res/DQ.jpg"))
                  if "res/ZI.png" in names:
                      open("app/src/main/res/drawable/ic_notif_original.png", "wb").write(zf.read("res/ZI.png"))
                  if "res/iQ.png" in names:
                      open("app/src/main/res/drawable/ic_badge_original.png", "wb").write(zf.read("res/iQ.png"))
              print("Extracted libshnative.so and original icons (DQ.jpg, ZI.png, iQ.png)")

          # 1B. Update AndroidManifest.xml & NotificationHelper.kt to use original icons
          manifest_path = "app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              mf = open(manifest_path).read()
              mf = mf.replace("@android:drawable/sym_def_app_icon", "@drawable/ic_launcher_original")
              open(manifest_path, "w").write(mf)

          notif_path = "app/src/main/java/dev/saned/assistant/NotificationHelper.kt"
          if os.path.exists(notif_path):
              nf = open(notif_path).read()
              nf = nf.replace("android.R.drawable.stat_notify_chat", "R.drawable.ic_notif_original")
              open(notif_path, "w").write(nf)

          # 2. Write Native.kt with JNI bindings + exact decoded constants from libshnative.so
          os.makedirs("app/src/main/java/dev/jing/sanedhook/util", exist_ok=True)
          open("app/src/main/java/dev/jing/sanedhook/util/Native.kt", "w").write("""package dev.jing.sanedhook.util

          object Native {
              @JvmField val a: Native = this
              @Volatile var isLoaded: Boolean = false
                  private set

              init {
                  isLoaded = try { System.loadLibrary("shnative"); true } catch (_: Throwable) { false }
              }

              external fun a(ctx: Any, pkg: String): Boolean
              external fun b(kind: Int, orderId: Int, token: String, lang: String, driverCipher: String): Array<String>
              external fun c(ctx: Any, pkg: String, s1: String, s2: String, v: Long): Int
              external fun d(): String
              external fun e(): String
              external fun f(): String
              external fun g(): String
              external fun h(): String
              external fun i(): String
              external fun j(): String
              external fun k(): Array<String>
              external fun l(): Array<String>
              external fun m(): Array<String>
              external fun n(): Array<String>
              external fun o(s: String): String
              external fun p(): Array<String>
              external fun q(): String
              external fun r(path: String): Boolean
              external fun s(versionCode: Long): Int
              external fun t(): Array<String>
              external fun u(): Array<String>

              private const val FALLBACK_FCM_CLASS = "net.saned.core.SanedFCMNotificationHandler"
              private const val FALLBACK_ORDER_ACTIVITY = "net.jahez.fleets.dispatch.accept.IncomingDispatchActivity"
              private const val FALLBACK_DB_NAME = "dispatches_db"
              private const val FALLBACK_SQL_QUERY =
                  "SELECT di.dispatchId, di.referenceId, di.status, v.vendorName, c.subscriberName, NULL, c.clientPhone, " +
                  "l.pickupLatitude, l.pickupLongitude, l.destinationLatitude, l.destinationLongitude, l.distance, " +
                  "p.deliveryPrice, p.collectionAmount, p.currencyCode, p.paymentMethod, a.buildingName, a.buildingNumber, " +
                  "a.houseNumber, a.streetName, a.roadNumber, a.blockNumber, a.apartmentNumber, a.floor, a.lane, " +
                  "a.officeName, a.region, a.additionalInformation FROM dispatch_info di " +
                  "LEFT JOIN vendor v ON v.dispatchId = di.dispatchId LEFT JOIN client c ON c.dispatchId = di.dispatchId " +
                  "LEFT JOIN location l ON l.dispatchId = di.dispatchId LEFT JOIN payment p ON p.dispatchId = di.dispatchId " +
                  "LEFT JOIN address a ON a.dispatchId = di.dispatchId"
              private const val FALLBACK_ENCRYPTED_PREFS = "ENCRYPTED_SANED_PREFERENCES"
              private const val FALLBACK_TOKEN_KEY = "token"
              private const val FALLBACK_LANG_KEY = "language"

              private val FALLBACK_INTENT_KEYS = arrayOf(
                  "EXTRA_DISPATCH_REQUEST_ID", "EXTRA_DISPATCH_PICKUP_LATITUDE", "EXTRA_DISPATCH_PICKUP_LONGITUDE",
                  "EXTRA_DISPATCH_DEST_LATITUDE", "EXTRA_DISPATCH_DEST_LONGITUDE", "EXTRA_DELIVERY_PRICE",
                  "EXTRA_DISPATCH_TYPE", "EXTRA_DISTANCE", "EXTRA_COUNTER", "EXTRA_SUBSCRIBER_NAME",
                  "EXTRA_BONUS_AMOUNT", "EXTRA_CURRENCY"
              )
              private val FALLBACK_FCM_KEYS = arrayOf(
                  "requestId", "dispatchPickupLat", "dispatchPickupLng", "dispatchDestLat", "dispatchDestLng",
                  "deliveryPrice", "dispatchType", "distance", "counter", "subscriberName", "vendorName",
                  "restaurantName", "storeName", "bonus", "bonusAmount", "extraBonus", "currency", "currencyCode"
              )
              private val FALLBACK_POLL_KEYS = arrayOf(
                  "dispatches", "referenceId", "pickup", "coordinates", "destination", "clientPhone", "contactNumber"
              )
              private val FALLBACK_SECURITY_CLASSES = arrayOf(
                  "net.jahez.guardzilla.logging.domain.model.SecurityCallBacksState",
                  "com.scottyab.rootbeer.RootBeer", "com.scottyab.rootbeer.RootBeerNative"
              )
              private val FALLBACK_VERSION_PROFILES = arrayOf(
                  "jahez_fleets", "ggk.am", "ggk.P", "ggk.ar", "net.jahez.fleets.MainActivity", "ggk.z", "b", "loadLibrary0",
                  "jahez_fleets", "oxxqbaxw.an", "oxxqbaxw.e", "oxxqbaxw.ao", "net.jahez.fleets.MainActivity", "oxxqbaxw.b", "a", "loadLibrary0",
                  "jahez_fleets", "lrbppeks.U", "lrbppeks.b", "lrbppeks.ak", "net.jahez.fleets.MainActivity", "lrbppeks.am", "a", "loadLibrary0"
              )
              private val FALLBACK_GUARD_CLASSES = arrayOf(
                  "S86", "yM", "ta3", "xD", "cj6", "tEa", "Ke0", "MV5", "XS", "wRa", "A76", "gM", "B93", "fD", "Jh6"
              )
              private val FALLBACK_FEATURE_FLAGS = arrayOf(
                  "rooted_device_check", "auto_clicker_check", "installation_source_check"
              )

              fun safeA(ctx: Any, pkg: String = "dev.jing.sanedhook"): Boolean = try { if (isLoaded) a(ctx, pkg) else false } catch (_: Throwable) { false }
              fun safeB(kind: Int, orderId: Int, token: String, lang: String, driverCipher: String): Array<String> = try { if (isLoaded) b(kind, orderId, token, lang, driverCipher) else emptyArray() } catch (_: Throwable) { emptyArray() }
              fun safeC(ctx: Any, pkg: String, s1: String, s2: String, v: Long): Int = try { if (isLoaded) c(ctx, pkg, s1, s2, v) else -1 } catch (_: Throwable) { -1 }
              fun safeD(): String = try { if (isLoaded) d().ifEmpty { FALLBACK_FCM_CLASS } else FALLBACK_FCM_CLASS } catch (_: Throwable) { FALLBACK_FCM_CLASS }
              fun safeE(): String = try { if (isLoaded) e().ifEmpty { FALLBACK_ORDER_ACTIVITY } else FALLBACK_ORDER_ACTIVITY } catch (_: Throwable) { FALLBACK_ORDER_ACTIVITY }
              fun safeF(): String = try { if (isLoaded) f().ifEmpty { FALLBACK_DB_NAME } else FALLBACK_DB_NAME } catch (_: Throwable) { FALLBACK_DB_NAME }
              fun safeG(): String = try { if (isLoaded) g().ifEmpty { FALLBACK_SQL_QUERY } else FALLBACK_SQL_QUERY } catch (_: Throwable) { FALLBACK_SQL_QUERY }
              fun safeH(): String = try { if (isLoaded) h().ifEmpty { FALLBACK_ENCRYPTED_PREFS } else FALLBACK_ENCRYPTED_PREFS } catch (_: Throwable) { FALLBACK_ENCRYPTED_PREFS }
              fun safeI(): String = try { if (isLoaded) i().ifEmpty { FALLBACK_TOKEN_KEY } else FALLBACK_TOKEN_KEY } catch (_: Throwable) { FALLBACK_TOKEN_KEY }
              fun safeJ(): String = try { if (isLoaded) j().ifEmpty { FALLBACK_LANG_KEY } else FALLBACK_LANG_KEY } catch (_: Throwable) { FALLBACK_LANG_KEY }
              fun safeK(): Array<String> = try { if (isLoaded) k().takeIf { it.isNotEmpty() } ?: FALLBACK_INTENT_KEYS else FALLBACK_INTENT_KEYS } catch (_: Throwable) { FALLBACK_INTENT_KEYS }
              fun safeL(): Array<String> = try { if (isLoaded) l().takeIf { it.isNotEmpty() } ?: FALLBACK_FCM_KEYS else FALLBACK_FCM_KEYS } catch (_: Throwable) { FALLBACK_FCM_KEYS }
              fun safeM(): Array<String> = try { if (isLoaded) m().takeIf { it.isNotEmpty() } ?: FALLBACK_POLL_KEYS else FALLBACK_POLL_KEYS } catch (_: Throwable) { FALLBACK_POLL_KEYS }
              fun safeN(): Array<String> = try { if (isLoaded) n().takeIf { it.isNotEmpty() } ?: FALLBACK_SECURITY_CLASSES else FALLBACK_SECURITY_CLASSES } catch (_: Throwable) { FALLBACK_SECURITY_CLASSES }
              fun safeO(s: String): String = try { if (isLoaded) o(s) else "" } catch (_: Throwable) { "" }
              fun safeP(): Array<String> = try { if (isLoaded) p().takeIf { it.isNotEmpty() } ?: FALLBACK_VERSION_PROFILES else FALLBACK_VERSION_PROFILES } catch (_: Throwable) { FALLBACK_VERSION_PROFILES }
              fun safeQ(): String = try { if (isLoaded) q() else "" } catch (_: Throwable) { "" }
              fun safeR(path: String): Boolean = try { if (isLoaded) r(path) else true } catch (_: Throwable) { true }
              fun safeS(versionCode: Long): Int = try {
                  if (isLoaded) s(versionCode) else when (versionCode) { 40093L -> 0; 40099L -> 1; 40089L -> 2; else -> -1 }
              } catch (_: Throwable) {
                  when (versionCode) { 40093L -> 0; 40099L -> 1; 40089L -> 2; else -> -1 }
              }
              fun safeT(): Array<String> = try { if (isLoaded) t().takeIf { it.isNotEmpty() } ?: FALLBACK_GUARD_CLASSES else FALLBACK_GUARD_CLASSES } catch (_: Throwable) { FALLBACK_GUARD_CLASSES }
              fun safeU(): Array<String> = try { if (isLoaded) u().takeIf { it.isNotEmpty() } ?: FALLBACK_FEATURE_FLAGS else FALLBACK_FEATURE_FLAGS } catch (_: Throwable) { FALLBACK_FEATURE_FLAGS }
          }
          """.replace("\n          ", "\n"))

          # 3. Write HookEntry.kt in full
          open("app/src/main/java/dev/saned/assistant/HookEntry.kt", "w").write("""package dev.saned.assistant

          import android.app.Activity
          import android.app.Application
          import android.content.Context
          import android.content.pm.ApplicationInfo
          import android.os.Build
          import android.os.Bundle
          import dev.jing.sanedhook.util.Native
          import io.github.libxposed.api.XposedInterface
          import io.github.libxposed.api.XposedModule
          import io.github.libxposed.api.XposedModuleInterface
          import java.util.concurrent.atomic.AtomicBoolean

          class HookEntry : XposedModule() {

              private val isSystemHooked = AtomicBoolean(false)
              private val isAppHooked = AtomicBoolean(false)
              @Volatile private var detectedVersionCode: Long = 0L

              override fun onPackageLoaded(param: XposedModuleInterface.PackageLoadedParam) {
                  if (param.packageName != "net.jahez.fleets" || !param.isFirstPackage) return
                  val vCode = resolveJahezVersionCode(param.applicationInfo)
                  if (vCode > 0L) detectedVersionCode = vCode
                  val isSupported = OrderInterceptor.checkJahezVersionSupport(detectedVersionCode)
                  if (!isSupported && OrderInterceptor.isStrictVersionCheck) return
                  hookSystemLifecycle()
                  param.defaultClassLoader?.let { initAppHooks(it) }
              }

              override fun onPackageReady(param: XposedModuleInterface.PackageReadyParam) {
                  if (param.packageName != "net.jahez.fleets") return
                  if (detectedVersionCode <= 0L) detectedVersionCode = resolveJahezVersionCode(param.applicationInfo)
                  val isSupported = OrderInterceptor.checkJahezVersionSupport(detectedVersionCode)
                  if (!isSupported && OrderInterceptor.isStrictVersionCheck) {
                      OrderInterceptor.notifyUnsupportedVersion(detectedVersionCode)
                      return
                  }
                  hookSystemLifecycle()
                  param.classLoader?.let { initAppHooks(it) }
              }

              private fun resolveJahezVersionCode(appInfo: ApplicationInfo?): Long {
                  if (appInfo != null) {
                      for (fieldName in listOf("longVersionCode", "versionCode")) {
                          try {
                              val f = appInfo.javaClass.getField(fieldName).apply { isAccessible = true }
                              val v = (f.get(appInfo) as? Number)?.toLong() ?: 0L
                              if (v > 0L) return v
                          } catch (_: Throwable) {}
                      }
                  }
                  for (ctx in listOfNotNull(OrderInterceptor.resolveApplicationContext(), resolveSystemContext())) {
                      try {
                          val pInfo = ctx.packageManager.getPackageInfo("net.jahez.fleets", 0)
                          val v = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) pInfo.longVersionCode else @Suppress("DEPRECATION") pInfo.versionCode.toLong()
                          if (v > 0L) return v
                      } catch (_: Throwable) {}
                  }
                  return 0L
              }

              private fun resolveSystemContext(): Context? = try {
                  val atClass = Class.forName("android.app.ActivityThread")
                  val currentAt = atClass.getMethod("currentActivityThread").invoke(null)
                  atClass.getMethod("getSystemContext").invoke(currentAt) as? Context
              } catch (_: Throwable) { null }

              private fun hookSystemLifecycle() {
                  if (!isSystemHooked.compareAndSet(false, true)) return
                  try {
                      val mAppCreate = Application::class.java.getDeclaredMethod("onCreate")
                      hook(mAppCreate).intercept(object : XposedInterface.Hooker {
                          override fun intercept(chain: XposedInterface.Chain): Any? {
                              val app = chain.thisObject as? Application
                              if (app != null && app.packageName == "net.jahez.fleets") {
                                  try { initAppHooks(app.classLoader); OrderInterceptor.initAppContext(app) } catch (_: Throwable) {}
                              }
                              return chain.proceed()
                          }
                      })
                  } catch (_: Throwable) {}

                  try {
                      val mOnCreate = Activity::class.java.getDeclaredMethod("onCreate", Bundle::class.java)
                      hook(mOnCreate).intercept(object : XposedInterface.Hooker {
                          override fun intercept(chain: XposedInterface.Chain): Any? {
                              val act = chain.thisObject as? Activity
                              val isJahez = act != null && act.packageName == "net.jahez.fleets"
                              var detectedOrderId = 0
                              if (isJahez && act != null) {
                                  OrderInterceptor.initAppContext(act.applicationContext)
                                  OrderInterceptor.currentActivity = act
                                  initAppHooks(act.classLoader)
                                  detectedOrderId = OrderInterceptor.onActivityPreCreated(act)
                              }
                              val res = chain.proceed()
                              if (isJahez && act != null) {
                                  OrderInterceptor.onActivityCreated(act)
                                  if (detectedOrderId != 0) OrderInterceptor.onOrderActivityPostCreate(act, detectedOrderId)
                              }
                              return res
                          }
                      })
                  } catch (_: Throwable) {}

                  try {
                      val mResume = Activity::class.java.getDeclaredMethod("onResume")
                      hook(mResume).intercept(object : XposedInterface.Hooker {
                          override fun intercept(chain: XposedInterface.Chain): Any? {
                              val res = chain.proceed()
                              val act = chain.thisObject as? Activity
                              if (act != null && act.packageName == "net.jahez.fleets") {
                                  OrderInterceptor.initAppContext(act.applicationContext)
                                  OrderInterceptor.currentActivity = act
                                  OrderInterceptor.onActivityResumed(act)
                              }
                              return res
                          }
                      })
                  } catch (_: Throwable) {}

                  try {
                      val mFocus = Activity::class.java.getDeclaredMethod("onWindowFocusChanged", Boolean::class.javaPrimitiveType)
                      hook(mFocus).intercept(object : XposedInterface.Hooker {
                          override fun intercept(chain: XposedInterface.Chain): Any? {
                              val res = chain.proceed()
                              val hasFocus = chain.args.getOrNull(0) as? Boolean ?: false
                              val act = chain.thisObject as? Activity
                              if (hasFocus && act != null && act.packageName == "net.jahez.fleets") {
                                  OrderInterceptor.currentActivity = act
                                  OrderInterceptor.onActivityResumed(act)
                              }
                              return res
                          }
                      })
                  } catch (_: Throwable) {}
              }

              fun initAppHooks(classLoader: ClassLoader) {
                  try {
                      val remotePrefs = getRemotePreferences("sanedhook_settings")
                      DeviceSpoofer.initRemotePrefs(remotePrefs)
                      LocationEngine.initRemotePrefs(remotePrefs)
                      OrderInterceptor.initRemotePrefs(remotePrefs)
                  } catch (_: Throwable) {}
                  try {
                      Native.safeA(this, "net.jahez.fleets")
                      Native.safeC(this, "net.jahez.fleets", OrderInterceptor.licenseToken, OrderInterceptor.licenseBoundId, 0L)
                  } catch (_: Throwable) {}
                  OrderInterceptor.startBootstrapLoop(this, classLoader)
                  if (!isAppHooked.compareAndSet(false, true)) return
                  try {
                      PackageCloaker.hook(this, classLoader)
                      LocationEngine.hook(this, classLoader)
                      DeviceSpoofer.hook(this, classLoader)
                      OrderInterceptor.hook(this, classLoader)
                  } catch (_: Throwable) {}
              }
          }
          """.replace("\n          ", "\n"))

          # 4. Write PackageCloaker.kt in full
          open("app/src/main/java/dev/saned/assistant/PackageCloaker.kt", "w").write("""package dev.saned.assistant

          import android.app.Activity
          import android.content.pm.ApplicationInfo
          import android.content.pm.PackageInfo
          import android.os.Bundle
          import dev.jing.sanedhook.util.Native
          import io.github.libxposed.api.XposedInterface
          import io.github.libxposed.api.XposedModule
          import java.io.IOException
          import java.lang.reflect.Modifier
          import java.util.concurrent.atomic.AtomicBoolean

          object PackageCloaker {

              data class VersionProfile(
                  val index: Int,
                  val nativeLibName: String,
                  val nativeClasses: List<String>,
                  val blockedActivity: String,
                  val mainActivity: String,
                  val loaderClass: String,
                  val loaderMethod: String,
                  val runtimeExecMethod: String
              )

              data class ShadowArmorProfile(
                  val rootCheckClass: String,
                  val autoClickerClass: String,
                  val installSourceClass: String,
                  val certPinClass: String,
                  val featureFlagsClass: String
              )

              @Volatile var detectedVersionIndex: Int = -1
              @Volatile var activeProfile: VersionProfile? = null
              @Volatile var lastCheckedVersionCode: Long = 0L

              private val isRuntimeHooked = AtomicBoolean(false)
              private val isLoaderHooked = AtomicBoolean(false)

              fun getAllVersionProfiles(): List<VersionProfile> {
                  val raw = Native.safeP()
                  val result = mutableListOf<VersionProfile>()
                  for ((idx, c) in raw.toList().chunked(8).withIndex()) {
                      if (c.size == 8) {
                          result.add(VersionProfile(idx, c[0], listOf(c[2], c[3]).filter { it.isNotEmpty() }, c[1], c[4], c[5], c[6], c[7]))
                      }
                  }
                  return result
              }

              fun getAllShadowArmorProfiles(): List<ShadowArmorProfile> {
                  val raw = Native.safeT()
                  val result = mutableListOf<ShadowArmorProfile>()
                  for (c in raw.toList().chunked(5)) {
                      if (c.size == 5) result.add(ShadowArmorProfile(c[0], c[1], c[2], c[3], c[4]))
                  }
                  return result
              }

              fun checkVersionSupported(versionCode: Long): Boolean {
                  if (versionCode <= 0L) return false
                  if (lastCheckedVersionCode == versionCode && detectedVersionIndex >= 0) return true
                  lastCheckedVersionCode = versionCode
                  detectedVersionIndex = try { Native.safeS(versionCode) } catch (_: Throwable) { -1 }
                  return detectedVersionIndex >= 0
              }

              fun resolveProfile(classLoader: ClassLoader): VersionProfile? {
                  activeProfile?.let { return it }
                  val profiles = getAllVersionProfiles()
                  val preferred = profiles.getOrNull(detectedVersionIndex)
                  if (preferred != null && isProfilePresent(classLoader, preferred)) {
                      activeProfile = preferred
                      return preferred
                  }
                  for (p in profiles) {
                      if (isProfilePresent(classLoader, p)) {
                          activeProfile = p
                          if (detectedVersionIndex < 0) detectedVersionIndex = p.index
                          return p
                      }
                  }
                  return profiles.firstOrNull()
              }

              private fun isProfilePresent(classLoader: ClassLoader, profile: VersionProfile): Boolean =
                  profile.loaderClass.isNotEmpty() && try { Class.forName(profile.loaderClass, false, classLoader); true } catch (_: Throwable) { false }

              fun getMainActivityClassName(): String =
                  (activeProfile ?: getAllVersionProfiles().firstOrNull())?.mainActivity?.takeIf { it.isNotEmpty() } ?: "net.jahez.fleets.MainActivity"

              private fun defaultReturnValueForType(type: Class<*>): Any? = when (type) {
                  Boolean::class.javaPrimitiveType -> true
                  Int::class.javaPrimitiveType -> 0
                  Long::class.javaPrimitiveType -> 0L
                  Short::class.javaPrimitiveType -> 0.toShort()
                  Byte::class.javaPrimitiveType -> 0.toByte()
                  Char::class.javaPrimitiveType -> ' '
                  Float::class.javaPrimitiveType -> 0f
                  Double::class.javaPrimitiveType -> 0.0
                  else -> null
              }

              fun hook(module: XposedModule, classLoader: ClassLoader) {
                  val profiles = getAllVersionProfiles()
                  val resolved = resolveProfile(classLoader)

                  if (isRuntimeHooked.compareAndSet(false, true)) {
                      try {
                          val targetMethodName = profiles.firstOrNull { it.runtimeExecMethod.isNotEmpty() }?.runtimeExecMethod ?: "loadLibrary0"
                          val blockedLibName = profiles.firstOrNull { it.nativeLibName.isNotEmpty() }?.nativeLibName ?: "jahez_fleets"
                          for (m in Runtime::class.java.declaredMethods) {
                              if (m.name == targetMethodName && m.parameterTypes.lastOrNull() == String::class.java) {
                                  module.hook(m).intercept(object : XposedInterface.Hooker {
                                      override fun intercept(chain: XposedInterface.Chain): Any? {
