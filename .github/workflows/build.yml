                          val emptyBody = try {
                              val m1 = reqBodyCls.methods.firstOrNull {
                                  it.name == "create" && it.parameterTypes.size == 2 &&
                                      it.parameterTypes[0] == ByteArray::class.java && it.parameterTypes[1] == mediaTypeCls
                              }
                              val m2 = reqBodyCls.methods.firstOrNull {
                                  it.name == "create" && it.parameterTypes.size == 2 &&
                                      it.parameterTypes[0] == mediaTypeCls && it.parameterTypes[1] == ByteArray::class.java
                              }
                              when {
                                  m1 != null -> m1.invoke(null, ByteArray(0), null)
                                  m2 != null -> m2.invoke(null, null, ByteArray(0))
                                  else -> null
                              }
                          } catch (_: Throwable) { null }
                          if (emptyBody != null) {
                              val mName = if (httpMethod.equals("POST", ignoreCase = true)) "post" else "put"
                              reqBuilderCls.getMethod(mName, reqBodyCls).invoke(rb, emptyBody)
                          }
