                      android:name=".SanedReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="dev.saned.assistant.ACTION_LOG_ORDER" />
                          <action android:name="dev.saned.assistant.ACTION_DIAG_LOG" />
                          <action android:name="dev.jing.sanedhook.b" />
                          <action android:name="dev.saned.assistant.REQUEST_SETTINGS" />
                      <action android:name="dev.saned.assistant.ACTION_UPDATE_SETTINGS_FROM_OVERLAY" />
                          <action android:name="dev.saned.assistant.ACTION_PING" />
                          <action android:name="dev.saned.assistant.ACTION_PONG" />
                          <action android:name="dev.saned.assistant.ACTION_TEST_API" />
                          <action android:name="dev.saned.assistant.ACTION_TEST_API_RESULT" />
                      </intent-filter>
                  </receiver>

                  <activity
                      android:name=".ui.MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustPan">
