                          override fun checkServerTrusted(chain: Array<out X509Certificate>?, authType: String?) {}
                          override fun getAcceptedIssuers(): Array<X509Certificate> = arrayOf()
                      })
                      val sslContext = SSLContext.getInstance("TLS")
                      sslContext.init(null, trustAllCerts, SecureRandom())
                      val sslSocketFactory = sslContext.socketFactory
                      val fastIpv4Dns = object : okhttp3.Dns {
                          @Volatile private var cachedSanedAddrs: List<java.net.InetAddress> = emptyList()
                          @Volatile private var lastDnsResolveRt: Long = 0L

                          override fun lookup(hostname: String): List<java.net.InetAddress> {
                              return try {
                                  val isSaned = hostname.contains("saned.io", ignoreCase = true) || hostname.contains("jahez.net", ignoreCase = true)
                                  if (isSaned && pinnedSanedEdgeAddrs.isNotEmpty()) {
                                      return pinnedSanedEdgeAddrs
                                  }
                                  val nowRt = SystemClock.elapsedRealtime()
                                  if (isSaned && cachedSanedAddrs.isNotEmpty() && (nowRt - lastDnsResolveRt) < 120_000L) {
                                      return cachedSanedAddrs
                                  }
                                  val all = okhttp3.Dns.SYSTEM.lookup(hostname)
                                  // Strictly prefer IPv4 (Inet4Address) over IPv6 (Inet6Address) to avoid carrier IPv6 routing to Marseille (-MRS, ~120ms) instead of Riyadh (-RUH, ~25ms)
                                  val v4Only = all.filterIsInstance<java.net.Inet4Address>()
                                  val v4First = if (v4Only.isNotEmpty()) v4Only + all.filter { it !is java.net.Inet4Address } else all
                                  if (isSaned && v4First.isNotEmpty()) {
                                      cachedSanedAddrs = v4First
                                      lastDnsResolveRt = nowRt
                                  }
                                  v4First
                              } catch (_: Throwable) {
                                  okhttp3.Dns.SYSTEM.lookup(hostname)
                              }
                          }
                      }

