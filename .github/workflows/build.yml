              dec_str(sig_magic, kStrApkSig, sizeof(kStrApkSig), 0x58);
              if (sig_win < 24 || memcmp(blk + sig_win - 16, sig_magic, 16) != 0) {{
                  secure_zero(sig_magic, sizeof(sig_magic));
                  free(blk);
                  return false;
