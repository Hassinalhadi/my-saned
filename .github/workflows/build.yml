                  val tHex = parts[0]
                  val dId = parts[1]
                  val ts = parts[2].toLongOrNull() ?: return -1L
                  val sig = parts[3]
                  if (ts <= 0L) return 0L
                  val hwId = getImmutableHardwareTrialId()
                  // Accept entry if it matches EITHER the current myDevId OR the immutable hardware Widevine ID (blocks ANDROID_ID spoofing!)
                  val expectedSigDev = computeHmacHex(ctx, "ACT_STAMP|$tHex|$dId|$ts", 32)
                  if (!sig.equals(expectedSigDev, ignoreCase = true)) return -1L
                  if (tHex == expectedTagHex && dId == myDevId) return ts
                  if (dId == hwId || tHex == "HW_TRIAL") return ts
                  return 0L
