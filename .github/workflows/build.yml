                  if (cachedApiHost.isNotEmpty()) probeHosts.add(cachedApiHost)
                  probeHosts.addAll(candidateApiHosts)
                  val clientToUse = capturedAppHttpClient ?: httpClient

                  CoroutineScope(Dispatchers.IO).launch {
                      val tid = Process.myTid()
                      val origPriority = try { Process.getThreadPriority(tid) } catch (_: Throwable) { 0 }
                      if (isAccept) try { Process.setThreadPriority(-8) } catch (_: Throwable) {}
                      try {
                          var nativeMethod = ""
                          var nativeUrl = ""
                          val nativeHeaders = LinkedHashMap<String, String>()
                          if (Native.isLoaded && orderIdInt > 0) {
                              try {
                                  if (ctx != null) Native.safeA(ctx, "dev.jing.sanedhook")
                                  val rawTok = if (token.startsWith("Bearer ", ignoreCase = true)) token.substring(7).trim() else token.trim()
                                  val spec = Native.safeB(if (isAccept) 0 else 1, orderIdInt, rawTok, cachedLanguage, capturedDriverCipherB64)
                                  if (spec.size >= 2 && spec[1].startsWith("http")) {
                                      nativeMethod = spec[0]; nativeUrl = spec[1]
                                      var idx = 2
                                      while (idx + 1 < spec.size) { nativeHeaders[spec[idx]] = spec[idx + 1]; idx += 2 }
                                  }
                              } catch (_: Throwable) {}
                          }

                          val emptyPutBody = "".toRequestBody(null)
                          val jsonBody = JSONObject().apply {
                              put("order_id", orderIdNum)
                              if (orderIdInt > 0) put("requestId", orderIdInt)
                          }.toString().toRequestBody("application/json; charset=utf-8".toMediaTypeOrNull())

                          val latch = CountDownLatch(1)
                          val winnerCode = AtomicReference<Int>(null)

                          for (burst in 0 until burstCount) {
                              launch {
                                  if (nativeUrl.isNotEmpty() && winnerCode.get() == null) {
                                      try {
                                          val rb = Request.Builder().url(nativeUrl)
                                          if (nativeMethod.equals("PUT", ignoreCase = true)) rb.put(emptyPutBody) else rb.get()
                                          for ((hk, hv) in nativeHeaders) rb.header(hk, hv)
                                          val resp = clientToUse.newCall(rb.build()).execute()
                                          val code = resp.code
                                          resp.close()
                                          if (code in 200..299) {
                                              if (winnerCode.compareAndSet(null, code)) latch.countDown()
                                              return@launch
                                          }
                                      } catch (_: Throwable) {}
                                  }
                                  for (host in probeHosts.distinct()) {
                                      if (winnerCode.get() != null) return@launch
                                      val endpoints = if (isAccept) listOf(
                                          buildCandidateUrl(host, "/api/fleets/orders/$orderIdNum/accept"),
                                          buildCandidateUrl(host, "/api/driver/orders/$orderIdNum/accept"),
                                          buildCandidateUrl(host, "/api/orders/$orderIdNum/accept")
                                      ) else listOf(
                                          buildCandidateUrl(host, "/api/fleets/orders/$orderIdNum/reject"),
                                          buildCandidateUrl(host, "/api/driver/orders/$orderIdNum/reject"),
                                          buildCandidateUrl(host, "/api/orders/$orderIdNum/reject")
                                      )
                                      for (url in endpoints) {
                                          if (winnerCode.get() != null) return@launch
                                          for (method in listOf("PUT", "POST")) {
                                              try {
                                                  val reqBuilder = Request.Builder().url(url)
                                                  if (method == "PUT") reqBuilder.put(emptyPutBody) else reqBuilder.post(jsonBody)
                                                  applyJahezHeaders(reqBuilder, token)
                                                  if (capturedDriverCipherB64.isNotEmpty()) reqBuilder.header("driverId", capturedDriverCipherB64)
                                                  val resp = clientToUse.newCall(reqBuilder.build()).execute()
                                                  val code = resp.code
                                                  resp.close()
                                                  if (code in 200..299) {
                                                      cachedApiHost = host; persistHost(host)
                                                      if (winnerCode.compareAndSet(null, code)) latch.countDown()
                                                      return@launch
                                                  }
                                              } catch (_: Throwable) {}
                                          }
                                      }
                                  }
                              }
                          }
                          try { latch.await(12, TimeUnit.SECONDS) } catch (_: Throwable) {}
                      } catch (_: Throwable) {
                      } finally {
                          if (isAccept) try { Process.setThreadPriority(origPriority) } catch (_: Throwable) {}
                      }
                  }
              }""".replace("\n          ", "\n")
          )

          # Ensure settings sync includes stay_in_background_v2, silence_alert_tone, strict_version_check
          if 'intent.getBooleanExtra("strict_version_check"' not in oi:
              oi = re.sub(
                  r'isDryRun = intent\.getBooleanExtra\("dry_run", isDryRun\)(\s*isStayInBackground = [^\n]+)?(\s*isSilenceAlertTone = [^\n]+)?(\s*isStrictVersionCheck = [^\n]+)?',
                  'isDryRun = intent.getBooleanExtra("dry_run", isDryRun)\n        isStayInBackground = intent.getBooleanExtra("stay_in_background_v2", isStayInBackground)\n        isSilenceAlertTone = intent.getBooleanExtra("silence_alert_tone", isSilenceAlertTone)\n        isStrictVersionCheck = intent.getBooleanExtra("strict_version_check", isStrictVersionCheck)',
                  oi
              )
          if 'bundle.getBoolean("strict_version_check"' not in oi:
              oi = re.sub(
                  r'isDryRun = bundle\.getBoolean\("dry_run", isDryRun\)(\s*isStayInBackground = [^\n]+)?(\s*isSilenceAlertTone = [^\n]+)?(\s*isStrictVersionCheck = [^\n]+)?',
                  'isDryRun = bundle.getBoolean("dry_run", isDryRun)\n                    isStayInBackground = bundle.getBoolean("stay_in_background_v2", isStayInBackground)\n                    isSilenceAlertTone = bundle.getBoolean("silence_alert_tone", isSilenceAlertTone)\n                    isStrictVersionCheck = bundle.getBoolean("strict_version_check", isStrictVersionCheck)',
                  oi
              )
          if 'p.getBoolean("strict_version_check"' not in oi:
              oi = re.sub(
                  r'isDryRun = p\.getBoolean\("dry_run", isDryRun\)(\s*isStayInBackground = [^\n]+)?(\s*isSilenceAlertTone = [^\n]+)?(\s*isStrictVersionCheck = [^\n]+)?',
                  'isDryRun = p.getBoolean("dry_run", isDryRun)\n            isStayInBackground = p.getBoolean("stay_in_background_v2", isStayInBackground)\n            isSilenceAlertTone = p.getBoolean("silence_alert_tone", isSilenceAlertTone)\n            isStrictVersionCheck = p.getBoolean("strict_version_check", isStrictVersionCheck)',
                  oi
              )

          open(oi_path, "w").write(oi)

          # 7. Update MainActivity.kt with original UI switches (stay_in_background_v2, silence_alert_tone, sound_enabled, strict_version_check)
          ma_path = "app/src/main/java/dev/saned/assistant/ui/MainActivity.kt"
          if os.path.exists(ma_path):
              ma = open(ma_path).read()
              if "chkStrictVersionCheck" not in ma:
                  ma = re.sub(
                      r'private lateinit var chkDryRun: CheckBox(\s*private lateinit var chkStayInBackground: CheckBox)?(\s*private lateinit var chkSilenceAlertTone: CheckBox)?(\s*private lateinit var chkSoundAlert: CheckBox)?(\s*private lateinit var chkStrictVersionCheck: CheckBox)?',
                      """private lateinit var chkDryRun: CheckBox
              private lateinit var chkStayInBackground: CheckBox
              private lateinit var chkSilenceAlertTone: CheckBox
              private lateinit var chkSoundAlert: CheckBox
              private lateinit var chkStrictVersionCheck: CheckBox""".replace("\n          ", "\n"),
                      ma,
                      count=1
                  )
                  if "chkStayInBackground = CheckBox(this)" not in ma:
                      ma = ma.replace(
                          "layout.addView(chkDryRun)",
                          """layout.addView(chkDryRun)

                  chkStayInBackground = CheckBox(this).apply {
                      text = "Don't open Saned for orders handled for me (Stay in Background)"
                      isChecked = SettingsStore.isStayInBackground(this@MainActivity)
                  }
                  layout.addView(chkStayInBackground)

                  chkSilenceAlertTone = CheckBox(this).apply {
                      text = "Silence Jahez order alert tone when handled automatically"
                      isChecked = SettingsStore.isSilenceAlertTone(this@MainActivity)
                  }
                  layout.addView(chkSilenceAlertTone)

                  chkSoundAlert = CheckBox(this).apply {
                      text = "Play beep sound when an order is auto-accepted"
                      isChecked = SettingsStore.isSoundEnabled(this@MainActivity)
                  }
                  layout.addView(chkSoundAlert)

                  chkStrictVersionCheck = CheckBox(this).apply {
                      text = "Strict Jahez Version Check (Stop if Jahez version is not 40089/40093/40099)"
                      isChecked = SettingsStore.isStrictVersionCheck(this@MainActivity)
                  }
                  layout.addView(chkStrictVersionCheck)""".replace("\n          ", "\n"),
                          1
                      )
                  elif "chkStrictVersionCheck = CheckBox(this)" not in ma:
                      ma = ma.replace(
                          "layout.addView(chkSoundAlert)",
                          """layout.addView(chkSoundAlert)

                  chkStrictVersionCheck = CheckBox(this).apply {
                      text = "Strict Jahez Version Check (Stop if Jahez version is not 40089/40093/40099)"
                      isChecked = SettingsStore.isStrictVersionCheck(this@MainActivity)
                  }
                  layout.addView(chkStrictVersionCheck)""".replace("\n          ", "\n"),
                          1
                      )
                  ma = re.sub(
                      r'SettingsStore\.setDryRun\(this, dryRun\)(\s*SettingsStore\.setStayInBackground\(this, chkStayInBackground\.isChecked\))?(\s*SettingsStore\.setSilenceAlertTone\(this, chkSilenceAlertTone\.isChecked\))?(\s*SettingsStore\.setSoundEnabled\(this, chkSoundAlert\.isChecked\))?(\s*SettingsStore\.setStrictVersionCheck\(this, chkStrictVersionCheck\.isChecked\))?',
                      """SettingsStore.setDryRun(this, dryRun)
                  SettingsStore.setStayInBackground(this, chkStayInBackground.isChecked)
                  SettingsStore.setSilenceAlertTone(this, chkSilenceAlertTone.isChecked)
                  SettingsStore.setSoundEnabled(this, chkSoundAlert.isChecked)
                  SettingsStore.setStrictVersionCheck(this, chkStrictVersionCheck.isChecked)""".replace("\n          ", "\n"),
                      ma,
                      count=1
                  )
                  open(ma_path, "w").write(ma)

          # 8. Create SanedAssistant-98-OpenSource.zip directly in Python
          with zipfile.ZipFile("SanedAssistant-98-OpenSource.zip", "w", zipfile.ZIP_DEFLATED) as zout:
              for item in ["SanedAssistant-98-OpenSource", "app", "build.gradle.kts", "settings.gradle.kts", "gradle.properties"]:
                  if os.path.isfile(item):
                      zout.write(item)
                  elif os.path.isdir(item):
                      for root_dir, _, files in os.walk(item):
                          for f in files:
                              fp = os.path.join(root_dir, f)
                              zout.write(fp)

          print("Successfully synced all 4 sources, icons, audio controls, UI switches, and packaged SanedAssistant-98-OpenSource.zip!")
          PYEOF

      - name: Commit Open-Source Parity Sync to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/ || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync 100% SanedAssistant-98 open-source parity (icons + UI + audio + libshnative + Ls20/Lfs0/Ls90/Lb11/Ljx) [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Build APK with Gradle
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.nonTransitiveRClass=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
          gradle assembleRelease --stacktrace || gradle assembleDebug --stacktrace

      - name: Sign & Prepare Final APK
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found!"
            exit 1
          fi
          echo "Found built APK: $APK_PATH"

          if [[ "$APK_PATH" == *"unsigned"* ]]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            zipalign -v -p 4 "$APK_PATH" app-aligned.apk
            apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out SanedAssistant-98-OpenSource-Full.apk app-aligned.apk
          else
            cp "$APK_PATH" SanedAssistant-98-OpenSource-Full.apk
          fi

      - name: Upload Built APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SanedAssistant-98-OpenSource-APK
          path: SanedAssistant-98-OpenSource-Full.apk

      - name: Upload Full Open-Source Code Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SanedAssistant-98-OpenSource-SourceCode
          path: SanedAssistant-98-OpenSource.zip

      - name: Publish Release to GitHub
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0-build-${{ github.run_number }}
          name: "Saned Assistant v3.0.0 (100% Open-Source Parity #${{ github.run_number }})"
          body: |
            ### التحديثات في هذه النسخة (مطابقة 100% للنسخة 98 مفتوحة المصدر)
            - **استخراج المشروع مفتوح المصدر بالكامل (`SanedAssistant-98-OpenSource.zip`)**: تفكيك كامل لـ `SanedAssistant-98-7bac1ec.apk` باستخدام JADX و Apktool مع تضمين الكود المصدري النظيف `app/src/main`.
            - **الأيقونات الأصلية**: استخراج وتضمين أيقونة التطبيق الأصلية (`DQ.jpg`) وأيقونات الإشعارات (`ZI.png`, `iQ.png`).
            - **المكتبة الأصلية (`libshnative.so` + `Native.kt`)**: دمج مكتبة `libshnative.so` مع جميع الـ 21 دالة والـ Fallbacks الكاملة.
            - **المصادر الأربعة لالتقاط الطلبات وقبولها تلقائياً**:
              1. `IncomingDispatchActivity` (`Ls20`) مع كتم صوت تنبيه جاهز (`MediaPlayer.setVolume(0f, 0f)`) وإغلاق الشاشة أو البقاء في الخلفية.
              2. `Instrumentation.execStartActivity` (`Lfs0`) لمنع فتح شاشة الطلب عند تفعيل خيار البقاء في الخلفية وإزالة `FLAG_ACTIVITY_CLEAR_TASK`.
              3. `SanedFCMNotificationHandler` (`Ls90`) لاعتراض إشعارات FCM وقراءة الـ 18 مفتاحاً وحجب الإشعار عند الرفض التلقائي.
              4. `Cipher.doFinal("driverId : ")` (`Lkh.b`) + `EncryptedSharedPreferences` (`Lnz`) + `Lb11.h` (Polling) + `Ljx.h` (إرسال متوازٍ بأولوية قصوى `-8` عبر `CountDownLatch(1)`).
          files: |
            SanedAssistant-98-OpenSource-Full.apk
            SanedAssistant-98-OpenSource.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
