                              val dCols = diCursor.columnNames ?: emptyArray()
                              val dIdIdx = dCols.indexOfFirst { it.equals("dispatchId", ignoreCase = true) || it.equals("id", ignoreCase = true) }
                              val dRefIdx = dCols.indexOfFirst { it.contains("reference", ignoreCase = true) }
                              val dStIdx = dCols.indexOfFirst { it.contains("status", ignoreCase = true) || it.contains("state", ignoreCase = true) }
                              if (dIdIdx >= 0) {
