              secure_zero(sig_magic, sizeof(sig_magic));

              uint8_t expected[32];
              decode_cert(expected);
              bool found = false;
              bool matched_expected = false;
              for (size_t i = 0; i + 4 < sig_win - 16; ++i) {{
                  if (blk[i] == 0x30 && blk[i + 1] == 0x82) {{
                      size_t cert_len = 4 + ((static_cast<size_t>(blk[i + 2]) << 8) | static_cast<size_t>(blk[i + 3]));
