name: Build Saned Assistant PRO APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Configure AndroidX & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.nonTransitiveRClass=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties

      - name: Build APK with Gradle
        run: gradle assembleRelease --stacktrace || gradle assembleDebug --stacktrace

      - name: Sign APK
        run: |
          APK_FOUND=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -z "$APK_FOUND" ]; then
            echo "Error: No APK found after build!"
            exit 1
          fi
          echo "Found built APK: $APK_FOUND"

          keytool -genkeypair -v -keystore release.keystore -alias saned_key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "saned123" -keypass "saned123" \
            -dname "CN=SanedAssistant, OU=Dev, O=Saned, L=Riyadh, C=SA"

          zipalign -f -v -p 4 "$APK_FOUND" aligned.apk || cp "$APK_FOUND" aligned.apk

          apksigner sign --ks release.keystore \
            --ks-pass pass:"saned123" \
            --key-pass pass:"saned123" \
            --ks-key-alias saned_key \
            --out SanedAssistant-PRO.apk aligned.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SanedAssistant-PRO-APK
          path: SanedAssistant-PRO.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          files: SanedAssistant-PRO.apk
          tag_name: "v3.0.0-build-${{ github.run_number }}"
          name: "Saned Assistant PRO v3.0.0 (Build #${{ github.run_number }})"
          body: |
            نسخة Saned Assistant PRO المطابقة للمساعد الأصلي مع كافة الإصلاحات:
            - مبنية بنسبة 100% على معمارية Modern LibXposed الرسمية المتوافقة مع LSPosed.
            - زر تشغيل رئيسي شامل (Master ON/OFF).
            - تصفير جميع القيم والخيارات افتراضياً (Zero Defaults).
            - نظام خريطة تفاعلية Leaflet متصلة بنظام الإحداثيات مع أزرار مواقع سريعة لشمال الرياض.
            - تزييف معرف الجهاز Android ID حصرياً مع إلغاء حقل IMEI غير الضروري.
            - مزامنة الإعدادات لحظياً ومزدوجاً عبر ContentProvider و LibXposed IPC.
