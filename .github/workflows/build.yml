              private fun resolveSaudiEdgeIpsViaDoh(hostname: String): List<java.net.InetAddress> {
                  val out = ArrayList<java.net.InetAddress>()
                  val dohUrls = listOf(
                      "https://dns.google/resolve?name=$hostname&type=A&edns_client_subnet=212.118.0.0/16",
                      "https://1.1.1.1/dns-query?name=$hostname&type=A"
                  )
                  for (u in dohUrls) {
                      try {
                          val conn = (java.net.URL(u).openConnection() as java.net.HttpURLConnection).apply {
                              connectTimeout = 1800
                              readTimeout = 1800
                              requestMethod = "GET"
                              setRequestProperty("Accept", "application/dns-json")
                          }
                          if (conn.responseCode in 200..299) {
                              val txt = conn.inputStream.bufferedReader().use { it.readText() }
                              val ans = JSONObject(txt).optJSONArray("Answer")
                              if (ans != null) {
                                  for (i in 0 until ans.length()) {
                                      val obj = ans.optJSONObject(i) ?: continue
                                      if (obj.optInt("type") == 1) {
                                          val ipStr = obj.optString("data", "").trim()
                                          if (ipStr.isNotEmpty() && ipStr.count { it == '.' } == 3) {
                                              val parts = ipStr.split('.')
                                              val bytes = ByteArray(4) { idx -> (parts[idx].toInt() and 0xFF).toByte() }
                                              out.add(java.net.InetAddress.getByAddress(hostname, bytes))
                                          }
                                      }
                                  }
                              }
                          }
                          conn.disconnect()
                          if (out.isNotEmpty()) break
                      } catch (_: Throwable) {}
                  }
                  return out
              }

