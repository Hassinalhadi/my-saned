name: Android CI & Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Maximum Security Hardening (C++ Crypto + Payload Encryption + R8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Install Android Signing Tools (Quiet & Fast)
        run: |
          sudo apt-get update -qq > /dev/null
          sudo apt-get install -y -qq zipalign apksigner zip unzip python3 > /dev/null
          mkdir -p SanedAssistant-98-OpenSource

      - name: Apply Maximum Security Shield (C++ SHA256/HMAC Engine, Encrypted Endpoints & Strict Token Gate)
        run: |
          python3 - << 'PYEOF'
          import os, re, shutil, secrets, hashlib, subprocess, glob

          # 1. Point Remote Control URLs in Client & KeyGen to the public Hassinalhadi/jdriver_control repository
          for kt_file in [
              "app/src/main/java/dev/saned/assistant/ui/MainActivity.kt",
              "app/src/main/java/dev/saned/assistant/OrderInterceptor.kt"
          ]:
              if os.path.exists(kt_file):
                  src_txt = open(kt_file, "r", encoding="utf-8").read()
                  if "Hassinalhadi/jdriver_control" not in src_txt:
                      src_txt = src_txt.replace(
                          '"https://raw.githubusercontent.com/Hassinalhadi/my-saned/main/jdriver_control.json"',
                          '"https://raw.githubusercontent.com/Hassinalhadi/jdriver_control/main/jdriver_control.json",\n        "https://raw.githubusercontent.com/Hassinalhadi/jdriver_control/master/jdriver_control.json",\n        "https://raw.githubusercontent.com/Hassinalhadi/my-saned/main/jdriver_control.json"'
                      )
                      open(kt_file, "w", encoding="utf-8").write(src_txt)

          keygen_path = "keygen/src/main/java/dev/jing/jdriver/keygen/KeyGenActivity.kt"
          if os.path.exists(keygen_path):
              kg_src = open(keygen_path, "r", encoding="utf-8").read()
              kg_src = kg_src.replace('"Hassinalhadi/my-saned"', '"Hassinalhadi/jdriver_control"')
              open(keygen_path, "w", encoding="utf-8").write(kg_src)

          # 2. Export clean copy of source tree into SanedAssistant-98-OpenSource.zip before build-time obfuscation
          if os.path.exists("app/src/main/res/drawable/ic_launcher_original.jpg"):
              os.makedirs("keygen/src/main/res/drawable", exist_ok=True)
              shutil.copyfile(
                  "app/src/main/res/drawable/ic_launcher_original.jpg",
                  "keygen/src/main/res/drawable/ic_launcher_original.jpg"
              )
          os.makedirs("SanedAssistant-98-OpenSource/reconstructed-kotlin-src", exist_ok=True)
          shutil.copytree("app/src/main", "SanedAssistant-98-OpenSource/reconstructed-kotlin-src/main", dirs_exist_ok=True)
          shutil.make_archive("SanedAssistant-98-OpenSource", "zip", "SanedAssistant-98-OpenSource")
          print("Exported SanedAssistant-98-OpenSource.zip archive.")

          # 3. Compute official key material & encrypt all 9 critical operational strings (API URLs, SQL query, classes)
          orig_seeds = [
              0x4A445256, 0x53414E45, 0x44393850, 0x524F5345,
              0x43555245, 0x39363635, 0x30353831, 0x32313431
          ]
          raw_master = bytearray(32)
          for idx, s in enumerate(orig_seeds):
              mixed = (s ^ ((0x5A3C96A5 + idx * 0x13579BDF) & 0xFFFFFFFF)) & 0xFFFFFFFF
              off = idx * 4
              raw_master[off]     = (mixed >> 24) & 0xFF
              raw_master[off + 1] = (mixed >> 16) & 0xFF
              raw_master[off + 2] = (mixed >> 8) & 0xFF
              raw_master[off + 3] = mixed & 0xFF

          expected_mk = hashlib.sha256(raw_master).digest()
          cert_bytes = bytes.fromhex("3884b766498a974598f523351f43cc4a7e0dadb405d3e88218a81693efb3420f")

          mask_a = secrets.token_bytes(32)
          mask_b = secrets.token_bytes(32)
          enc_mk = bytes(expected_mk[i] ^ mask_a[i] ^ ((mask_b[i] + (i * 17)) & 0xFF) for i in range(32))

          cert_mask = secrets.token_bytes(32)
          enc_cert = bytes(cert_bytes[i] ^ cert_mask[i] ^ ((0xA5 + (i * 9)) & 0xFF) for i in range(32))

          # Critical strings from Native.kt encrypted with SHA-256(expected_mk || slot_idx || block_idx)
          # If APK signature is tampered, expected_mk is poisoned and these endpoints/queries turn into unusable bytes!
          plain_slots = [
              "https://gateway.saned.io/api/v1/dispatch/accept-dispatch/",
              "https://gateway.saned.io/api/v1/dispatch/reject/",
              "https://gateway.saned.io/api/v1/dispatch/active",
              "https://gateway.saned.io/api/v1/dispatch-location/contact-number/",
              "net.saned.core.SanedFCMNotificationHandler",
              "net.jahez.fleets.dispatch.accept.IncomingDispatchActivity",
              "dispatches_db",
              "SELECT di.dispatchId, di.referenceId, di.status, v.vendorName, c.subscriberName, NULL, c.clientPhone, "
              "l.pickupLatitude, l.pickupLongitude, l.destinationLatitude, l.destinationLongitude, l.distance, "
              "p.deliveryPrice, p.collectionAmount, p.currencyCode, p.paymentMethod, a.buildingName, a.buildingNumber, "
              "a.houseNumber, a.streetName, a.roadNumber, a.blockNumber, a.apartmentNumber, a.floor, a.lane, "
              "a.officeName, a.region, a.additionalInformation FROM dispatch_info di "
              "LEFT JOIN vendor v ON v.dispatchId = di.dispatchId LEFT JOIN client c ON c.dispatchId = di.dispatchId "
              "LEFT JOIN location l ON l.dispatchId = di.dispatchId LEFT JOIN payment p ON p.dispatchId = di.dispatchId "
              "LEFT JOIN address a ON a.dispatchId = di.dispatchId",
              "AIzaSyDngGva2vOywyZGjSvoGQqnIr-IC3v4FVE",
          ]

          enc_slots = []
          for slot_idx, text in enumerate(plain_slots):
              raw_b = text.encode("utf-8")
              out_b = bytearray(len(raw_b))
              for blk in range((len(raw_b) + 31) // 32):
                  ks = hashlib.sha256(expected_mk + bytes([slot_idx, blk])).digest()
                  for j in range(32):
                      pos = blk * 32 + j
                      if pos < len(raw_b):
                          out_b[pos] = raw_b[pos] ^ ks[j]
              enc_slots.append(bytes(out_b))

          def fmt_cpp(b: bytes) -> str:
              return ", ".join(f"0x{x:02x}" for x in b)

          def fmt_kt(b: bytes) -> str:
              return ", ".join(f"0x{x:02x}.toByte()" for x in b)

          cpp_slots_defs = []
          cpp_slots_ptr = []
          cpp_slots_len = []
          kt_slots_defs = []
          for idx, eb in enumerate(enc_slots):
              cpp_slots_defs.append(f"static const uint8_t kSlot{idx}[{len(eb)}] = {{ {fmt_cpp(eb)} }};")
              cpp_slots_ptr.append(f"kSlot{idx}")
              cpp_slots_len.append(str(len(eb)))
              kt_slots_defs.append(f"byteArrayOf({fmt_kt(eb)})")

          cpp_slots_defs_str = "\n          ".join(cpp_slots_defs)
          cpp_slots_ptr_str = ", ".join(cpp_slots_ptr)
          cpp_slots_len_str = ", ".join(cpp_slots_len)
          kt_slots_defs_str = ",\n                  ".join(kt_slots_defs)

          # 4. Write C++ JNI Cryptographic Engine (SHA-256 + HMAC-SHA256 + Trial Key Generator + Endpoint Decryptor)
          cpp_path = "/tmp/jdriver_sec.cpp"
          with open(cpp_path, "w", encoding="utf-8") as f:
              f.write(f"""#include <jni.h>
          #include <stdint.h>
          #include <string.h>
          #include <stdio.h>

          namespace {{

          static const uint8_t kMaskA[32] = {{ {fmt_cpp(mask_a)} }};
          static const uint8_t kMaskB[32] = {{ {fmt_cpp(mask_b)} }};
          static const uint8_t kEncMk[32] = {{ {fmt_cpp(enc_mk)} }};
          static const uint8_t kCertMask[32] = {{ {fmt_cpp(cert_mask)} }};
          static const uint8_t kEncCert[32] = {{ {fmt_cpp(enc_cert)} }};

          {cpp_slots_defs_str}
          static const uint8_t* const kSlots[9] = {{ {cpp_slots_ptr_str} }};
          static const size_t kSlotLens[9] = {{ {cpp_slots_len_str} }};

          struct Sha256Ctx {{
              uint32_t state[8];
              uint64_t bitcount;
              uint8_t buffer[64];
          }};

          static const uint32_t K256[64] = {{
              0x428a2f98UL, 0x71374491UL, 0xb5c0fbcfUL, 0xe9b5dba5UL,
              0x3956c25bUL, 0x59f111f1UL, 0x923f82a4UL, 0xab1c5ed5UL,
              0xd807aa98UL, 0x12835b01UL, 0x243185beUL, 0x550c7dc3UL,
              0x72be5d74UL, 0x80deb1feUL, 0x9bdc06a7UL, 0xc19bf174UL,
              0xe49b69c1UL, 0xefbe4786UL, 0x0fc19dc6UL, 0x240ca1ccUL,
              0x2de92c6fUL, 0x4a7484aaUL, 0x5cb0a9dcUL, 0x76f988daUL,
              0x983e5152UL, 0xa831c66dUL, 0xb00327c8UL, 0xbf597fc7UL,
              0xc6e00bf3UL, 0xd5a79147UL, 0x06ca6351UL, 0x14292967UL,
              0x27b70a85UL, 0x2e1b2138UL, 0x4d2c6dfcUL, 0x53380d13UL,
              0x650a7354UL, 0x766a0abbUL, 0x81c2c92eUL, 0x92722c85UL,
              0xa2bfe8a1UL, 0xa81a664bUL, 0xc24b8b70UL, 0xc76c51a3UL,
              0xd192e819UL, 0xd6990624UL, 0xf40e3585UL, 0x106aa070UL,
              0x19a4c116UL, 0x1e376c08UL, 0x2748774cUL, 0x34b0bcb5UL,
              0x391c0cb3UL, 0x4ed8aa4aUL, 0x5b9cca4fUL, 0x682e6ff3UL,
              0x748f82eeUL, 0x78a5636fUL, 0x84c87814UL, 0x8cc70208UL,
              0x90befffaUL, 0xa4506cebUL, 0xbef9a3f7UL, 0xc67178f2UL
          }};

          inline uint32_t rotr32(uint32_t x, uint32_t n) {{
              return (x >> n) | (x << (32 - n));
          }}

          void sha256_transform(Sha256Ctx* ctx, const uint8_t data[64]) {{
              uint32_t w[64];
              for (int i = 0; i < 16; ++i) {{
                  w[i] = (static_cast<uint32_t>(data[i * 4]) << 24) |
                         (static_cast<uint32_t>(data[i * 4 + 1]) << 16) |
                         (static_cast<uint32_t>(data[i * 4 + 2]) << 8) |
                         (static_cast<uint32_t>(data[i * 4 + 3]));
              }}
              for (int i = 16; i < 64; ++i) {{
                  uint32_t s0 = rotr32(w[i - 15], 7) ^ rotr32(w[i - 15], 18) ^ (w[i - 15] >> 3);
                  uint32_t s1 = rotr32(w[i - 2], 17) ^ rotr32(w[i - 2], 19) ^ (w[i - 2] >> 10);
                  w[i] = w[i - 16] + s0 + w[i - 7] + s1;
              }}
              uint32_t a = ctx->state[0], b = ctx->state[1], c = ctx->state[2], d = ctx->state[3];
              uint32_t e = ctx->state[4], f = ctx->state[5], g = ctx->state[6], h = ctx->state[7];
              for (int i = 0; i < 64; ++i) {{
                  uint32_t S1 = rotr32(e, 6) ^ rotr32(e, 11) ^ rotr32(e, 25);
                  uint32_t ch = (e & f) ^ ((~e) & g);
                  uint32_t temp1 = h + S1 + ch + K256[i] + w[i];
                  uint32_t S0 = rotr32(a, 2) ^ rotr32(a, 13) ^ rotr32(a, 22);
                  uint32_t maj = (a & b) ^ (a & c) ^ (b & c);
                  uint32_t temp2 = S0 + maj;
                  h = g; g = f; f = e; e = d + temp1;
                  d = c; c = b; b = a; a = temp1 + temp2;
              }}
              ctx->state[0] += a; ctx->state[1] += b; ctx->state[2] += c; ctx->state[3] += d;
              ctx->state[4] += e; ctx->state[5] += f; ctx->state[6] += g; ctx->state[7] += h;
          }}

          void sha256_init(Sha256Ctx* ctx) {{
              ctx->state[0] = 0x6a09e667UL; ctx->state[1] = 0xbb67ae85UL;
              ctx->state[2] = 0x3c6ef372UL; ctx->state[3] = 0xa54ff53aUL;
              ctx->state[4] = 0x510e527fUL; ctx->state[5] = 0x9b05688cUL;
              ctx->state[6] = 0x1f83d9abUL; ctx->state[7] = 0x5be0cd19UL;
              ctx->bitcount = 0;
              memset(ctx->buffer, 0, sizeof(ctx->buffer));
          }}

          void sha256_update(Sha256Ctx* ctx, const uint8_t* data, size_t len) {{
              if (len == 0) return;
              size_t idx = static_cast<size_t>((ctx->bitcount >> 3) & 0x3F);
              ctx->bitcount += static_cast<uint64_t>(len) << 3;
              size_t partLen = 64 - idx;
              size_t i = 0;
              if (len >= partLen) {{
                  memcpy(&ctx->buffer[idx], data, partLen);
                  sha256_transform(ctx, ctx->buffer);
                  for (i = partLen; i + 63 < len; i += 64) {{
                      sha256_transform(ctx, &data[i]);
                  }}
                  idx = 0;
              }}
              memcpy(&ctx->buffer[idx], &data[i], len - i);
          }}

          void sha256_final(Sha256Ctx* ctx, uint8_t out[32]) {{
              uint8_t bits[8];
              for (int i = 0; i < 8; ++i) {{
                  bits[i] = static_cast<uint8_t>((ctx->bitcount >> ((7 - i) * 8)) & 0xFF);
              }}
              size_t idx = static_cast<size_t>((ctx->bitcount >> 3) & 0x3F);
              size_t padLen = (idx < 56) ? (56 - idx) : (120 - idx);
              uint8_t pad[64] = {{0x80}};
              sha256_update(ctx, pad, padLen);
              sha256_update(ctx, bits, 8);
              for (int i = 0; i < 8; ++i) {{
                  out[i * 4]     = static_cast<uint8_t>((ctx->state[i] >> 24) & 0xFF);
                  out[i * 4 + 1] = static_cast<uint8_t>((ctx->state[i] >> 16) & 0xFF);
                  out[i * 4 + 2] = static_cast<uint8_t>((ctx->state[i] >> 8) & 0xFF);
                  out[i * 4 + 3] = static_cast<uint8_t>(ctx->state[i] & 0xFF);
              }}
          }}

          void hmac_sha256(const uint8_t key[32], const uint8_t* msg, size_t msg_len, uint8_t out[32]) {{
              uint8_t k_ipad[64];
              uint8_t k_opad[64];
              for (int i = 0; i < 64; ++i) {{
                  uint8_t kb = (i < 32) ? key[i] : 0;
                  k_ipad[i] = kb ^ 0x36;
                  k_opad[i] = kb ^ 0x5c;
              }}
              uint8_t inner[32];
              Sha256Ctx ctx;
              sha256_init(&ctx);
              sha256_update(&ctx, k_ipad, 64);
              sha256_update(&ctx, msg, msg_len);
              sha256_final(&ctx, inner);

              sha256_init(&ctx);
              sha256_update(&ctx, k_opad, 64);
              sha256_update(&ctx, inner, 32);
              sha256_final(&ctx, out);
          }}

          inline void decode_cert(uint8_t out[32]) {{
              for (int i = 0; i < 32; ++i) {{
                  out[i] = kEncCert[i] ^ kCertMask[i] ^ static_cast<uint8_t>((0xA5 + (i * 9)) & 0xFF);
              }}
          }}

          inline void unpack_mk(JNIEnv* env, jbyteArray cert_sha256_arr, jboolean allow_embedded, uint8_t out_mk[32]) {{
              uint8_t expected[32];
              decode_cert(expected);
              bool sig_ok = false;
              if (cert_sha256_arr != nullptr && env->GetArrayLength(cert_sha256_arr) == 32) {{
                  jbyte* actual = env->GetByteArrayElements(cert_sha256_arr, nullptr);
                  if (actual) {{
                      uint8_t diff = 0;
                      for (int i = 0; i < 32; ++i) diff |= (static_cast<uint8_t>(actual[i]) ^ expected[i]);
                      sig_ok = (diff == 0);
                      env->ReleaseByteArrayElements(cert_sha256_arr, actual, JNI_ABORT);
                  }}
              }} else if (allow_embedded == JNI_TRUE) {{
                  sig_ok = true;
              }}
              uint8_t mask_mod = sig_ok ? 0x00 : 0x5A;
              for (int i = 0; i < 32; ++i) {{
                  uint8_t b = kEncMk[i] ^ kMaskA[i] ^ static_cast<uint8_t>((kMaskB[i] + (i * 17)) & 0xFF);
                  out_mk[i] = b ^ mask_mod;
              }}
              memset(expected, 0, sizeof(expected));
          }}

          }} // namespace

          extern "C" JNIEXPORT jbyteArray JNICALL
          Java_dev_saned_assistant_SecurityBridge_nativeExpectedCertSha256(JNIEnv* env, jclass) {{
              uint8_t cert[32];
              decode_cert(cert);
              jbyteArray arr = env->NewByteArray(32);
              if (arr) env->SetByteArrayRegion(arr, 0, 32, reinterpret_cast<const jbyte*>(cert));
              memset(cert, 0, sizeof(cert));
              return arr;
          }}

          extern "C" JNIEXPORT jbyteArray JNICALL
          Java_dev_saned_assistant_SecurityBridge_nativeDeriveMasterKey(
                  JNIEnv* env, jclass, jbyteArray cert_sha256_arr, jboolean allow_embedded) {{
              uint8_t out_mk[32];
              unpack_mk(env, cert_sha256_arr, allow_embedded, out_mk);
              jbyteArray res = env->NewByteArray(32);
              if (res) env->SetByteArrayRegion(res, 0, 32, reinterpret_cast<const jbyte*>(out_mk));
              memset(out_mk, 0, sizeof(out_mk));
              return res;
          }}

          // Decrypts protected Native.kt slots (API URLs, SQL queries, class names) inside C++
          extern "C" JNIEXPORT jbyteArray JNICALL
          Java_dev_saned_assistant_SecurityBridge_nativeDecryptSlot(
                  JNIEnv* env, jclass, jbyteArray cert_sha256_arr, jboolean allow_embedded, jint slot_idx) {{
              if (slot_idx < 0 || slot_idx >= 9) return nullptr;
              uint8_t mk[32];
              unpack_mk(env, cert_sha256_arr, allow_embedded, mk);

              const uint8_t* enc_ptr = kSlots[slot_idx];
              size_t slen = kSlotLens[slot_idx];
              jbyteArray out_arr = env->NewByteArray(static_cast<jsize>(slen));
              if (!out_arr) {{
                  memset(mk, 0, sizeof(mk));
                  return nullptr;
              }}

              uint8_t dec_buf[1024];
              if (slen > sizeof(dec_buf)) slen = sizeof(dec_buf);
              size_t num_blocks = (slen + 31) / 32;
              for (size_t blk = 0; blk < num_blocks; ++blk) {{
                  uint8_t seed[34];
                  memcpy(seed, mk, 32);
                  seed[32] = static_cast<uint8_t>(slot_idx & 0xFF);
                  seed[33] = static_cast<uint8_t>(blk & 0xFF);
                  uint8_t ks[32];
                  Sha256Ctx sctx;
                  sha256_init(&sctx);
                  sha256_update(&sctx, seed, 34);
                  sha256_final(&sctx, ks);
                  for (size_t j = 0; j < 32; ++j) {{
                      size_t pos = blk * 32 + j;
                      if (pos < slen) {{
                          dec_buf[pos] = enc_ptr[pos] ^ ks[j];
                      }}
                  }}
              }}
              env->SetByteArrayRegion(out_arr, 0, static_cast<jsize>(slen), reinterpret_cast<const jbyte*>(dec_buf));
              memset(dec_buf, 0, sizeof(dec_buf));
              memset(mk, 0, sizeof(mk));
              return out_arr;
          }}

          // Computes HMAC-SHA256 inside C++ without exposing MasterKey to Java
          extern "C" JNIEXPORT jbyteArray JNICALL
          Java_dev_saned_assistant_SecurityBridge_nativeComputeHmacSha256(
                  JNIEnv* env, jclass, jbyteArray cert_sha256_arr, jboolean allow_embedded, jbyteArray msg_arr) {{
              if (!msg_arr) return nullptr;
              uint8_t mk[32];
              unpack_mk(env, cert_sha256_arr, allow_embedded, mk);
              jsize mlen = env->GetArrayLength(msg_arr);
              jbyte* mptr = env->GetByteArrayElements(msg_arr, nullptr);
              uint8_t mac[32] = {{0}};
              if (mptr) {{
                  hmac_sha256(mk, reinterpret_cast<const uint8_t*>(mptr), static_cast<size_t>(mlen), mac);
                  env->ReleaseByteArrayElements(msg_arr, mptr, JNI_ABORT);
              }}
              jbyteArray out = env->NewByteArray(32);
              if (out) env->SetByteArrayRegion(out, 0, 32, reinterpret_cast<const jbyte*>(mac));
              memset(mk, 0, sizeof(mk));
              memset(mac, 0, sizeof(mac));
              return out;
          }}

          // Generates the 20-byte deterministic 1-day trial payload inside C++ so key-packing logic is completely removed from MainActivity.kt
          extern "C" JNIEXPORT jbyteArray JNICALL
          Java_dev_saned_assistant_SecurityBridge_nativeBuildTrialPayload20(
                  JNIEnv* env, jclass, jbyteArray cert_sha256_arr, jint dev_hash, jbyteArray nonce_seed_arr) {{
              if (!nonce_seed_arr || env->GetArrayLength(nonce_seed_arr) < 2) return nullptr;
              uint8_t mk[32];
              unpack_mk(env, cert_sha256_arr, JNI_FALSE, mk);

              jbyte* nptr = env->GetByteArrayElements(nonce_seed_arr, nullptr);
              uint8_t nonce2[2] = {{ static_cast<uint8_t>(nptr[0]), static_cast<uint8_t>(nptr[1]) }};
              env->ReleaseByteArrayElements(nonce_seed_arr, nptr, JNI_ABORT);

              uint32_t exp_code = 0x80000000UL | 1440UL;
              uint8_t plain12[12];
              plain12[0] = static_cast<uint8_t>((static_cast<uint32_t>(dev_hash) >> 24) & 0xFF);
              plain12[1] = static_cast<uint8_t>((static_cast<uint32_t>(dev_hash) >> 16) & 0xFF);
              plain12[2] = static_cast<uint8_t>((static_cast<uint32_t>(dev_hash) >> 8) & 0xFF);
              plain12[3] = static_cast<uint8_t>(static_cast<uint32_t>(dev_hash) & 0xFF);
              plain12[4] = static_cast<uint8_t>((exp_code >> 24) & 0xFF);
              plain12[5] = static_cast<uint8_t>((exp_code >> 16) & 0xFF);
              plain12[6] = static_cast<uint8_t>((exp_code >> 8) & 0xFF);
              plain12[7] = static_cast<uint8_t>(exp_code & 0xFF);
              plain12[8] = 1;
              plain12[9] = 0x0F;
              plain12[10] = 0x4A;
              plain12[11] = 0x44;

              Sha256Ctx sctx;
              sha256_init(&sctx);
              sha256_update(&sctx, mk, 32);
              sha256_update(&sctx, nonce2, 2);
              uint8_t stream[32];
              sha256_final(&sctx, stream);

              uint8_t enc12[12];
              for (int i = 0; i < 12; ++i) enc12[i] = plain12[i] ^ stream[i];

              uint8_t mac_in[14];
              memcpy(mac_in, enc12, 12);
              memcpy(mac_in + 12, nonce2, 2);
              uint8_t mac_full[32];
              hmac_sha256(mk, mac_in, 14, mac_full);

              uint8_t full20[20];
              memcpy(full20, enc12, 12);
              memcpy(full20 + 12, nonce2, 2);
              memcpy(full20 + 14, mac_full, 6);

              jbyteArray out = env->NewByteArray(20);
              if (out) env->SetByteArrayRegion(out, 0, 20, reinterpret_cast<const jbyte*>(full20));
              memset(mk, 0, sizeof(mk));
              memset(full20, 0, sizeof(full20));
              return out;
          }}
          """)

          sdk_root = os.environ.get("ANDROID_HOME") or os.environ.get("ANDROID_SDK_ROOT") or "/usr/local/lib/android/sdk"
          clang_bins = sorted(glob.glob(f"{sdk_root}/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/bin"))
          if clang_bins:
              bin_dir = clang_bins[-1]
              print(f"Found pre-installed NDK toolchain: {bin_dir}")
              targets = [
                  ("arm64-v8a", "aarch64-linux-android26-clang++"),
                  ("armeabi-v7a", "armv7a-linux-androideabi26-clang++"),
                  ("x86_64", "x86_64-linux-android26-clang++"),
              ]
              for abi, compiler in targets:
                  compiler_path = os.path.join(bin_dir, compiler)
                  if os.path.exists(compiler_path):
                      out_dir = f"app/src/main/jniLibs/{abi}"
                      os.makedirs(out_dir, exist_ok=True)
                      out_so = f"{out_dir}/libjdriver_sec.so"
                      cmd = [
                          compiler_path, "-shared", "-fPIC", "-O3",
                          "-fvisibility=hidden", "-fvisibility-inlines-hidden",
                          "-ffunction-sections", "-fdata-sections",
                          "-fno-exceptions", "-fno-rtti",
                          "-Wl,--gc-sections", "-Wl,--strip-all", "-Wl,--exclude-libs,ALL",
                          cpp_path, "-o", out_so
                      ]
                      subprocess.run(cmd, check=True)
                      print(f"Compiled {out_so} ({os.path.getsize(out_so)} bytes)")
          else:
              print("NDK clang++ not found on runner; using Kotlin SecurityBridge fallback.")

          # 5. Generate Kotlin SecurityBridge with slot caching & fallback decryption
          with open("app/src/main/java/dev/saned/assistant/SecurityBridge.kt", "w", encoding="utf-8") as f:
              f.write(f"""package dev.saned.assistant

          import android.content.Context
          import android.content.pm.PackageManager
          import android.os.Debug
          import java.io.File
          import java.security.MessageDigest
          import java.util.Locale
          import java.util.concurrent.ConcurrentHashMap
          import javax.crypto.Mac
          import javax.crypto.spec.SecretKeySpec

          object SecurityBridge {{
              private const val MODULE_PKG = "dev.jing.sanedhook"
              private const val TARGET_PKG = "net.jahez.fleets"
              private const val LIC_ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"
              @Volatile private var nativeLoaded = false
              private val slotCache = ConcurrentHashMap<Int, String>()

              @JvmStatic
              fun tryLoadNative(ctx: Context?): Boolean {{
                  if (nativeLoaded) return true
                  try {{
                      System.loadLibrary("jdriver_sec")
                      nativeLoaded = true
                      return true
                  }} catch (_: Throwable) {{}}
                  if (ctx != null) {{
                      try {{
                          val libDir = ctx.packageManager.getApplicationInfo(MODULE_PKG, 0).nativeLibraryDir
                          if (!libDir.isNullOrEmpty()) {{
                              val soFile = File(libDir, "libjdriver_sec.so")
                              if (soFile.exists()) {{
                                  System.load(soFile.absolutePath)
                                  nativeLoaded = true
                                  return true
                              }}
                          }}
                      }} catch (_: Throwable) {{}}
                  }}
                  return false
              }}

              @JvmStatic external fun nativeExpectedCertSha256(): ByteArray
              @JvmStatic external fun nativeDeriveMasterKey(certSha256: ByteArray?, allowEmbedded: Boolean): ByteArray
              @JvmStatic external fun nativeDecryptSlot(certSha256: ByteArray?, allowEmbedded: Boolean, slotIdx: Int): ByteArray?
              @JvmStatic external fun nativeComputeHmacSha256(certSha256: ByteArray?, allowEmbedded: Boolean, msg: ByteArray): ByteArray?
              @JvmStatic external fun nativeBuildTrialPayload20(certSha256: ByteArray?, devHash: Int, nonceSeed: ByteArray): ByteArray?

              private val kMaskA = byteArrayOf({fmt_kt(mask_a)})
              private val kMaskB = byteArrayOf({fmt_kt(mask_b)})
              private val kEncMk = byteArrayOf({fmt_kt(enc_mk)})
              private val kCertMask = byteArrayOf({fmt_kt(cert_mask)})
              private val kEncCert = byteArrayOf({fmt_kt(enc_cert)})

              private val kEncryptedSlots = arrayOf(
                  {kt_slots_defs_str}
              )

              @JvmStatic
              fun expectedCertSha256(): ByteArray {{
                  if (tryLoadNative(null)) {{
                      try {{ return nativeExpectedCertSha256() }} catch (_: Throwable) {{}}
                  }}
                  val out = ByteArray(32)
                  for (i in 0 until 32) {{
                      val m = (0xA5 + (i * 9)) and 0xFF
                      out[i] = ((kEncCert[i].toInt() and 0xFF) xor (kCertMask[i].toInt() and 0xFF) xor m).toByte()
                  }}
                  return out
              }}

              @JvmStatic
              fun extractCert(ctx: Context?): Pair<ByteArray?, Boolean> {{
                  val activeCtx = ctx ?: OrderInterceptor.resolveApplicationContext() ?: OrderInterceptor.currentActivity
                  if (activeCtx == null) return null to true
                  return try {{
                      @Suppress("DEPRECATION")
                      val pkgInfo = activeCtx.packageManager.getPackageInfo(MODULE_PKG, PackageManager.GET_SIGNATURES)
                      @Suppress("DEPRECATION")
                      val sigs = pkgInfo.signatures
                      if (sigs != null && sigs.isNotEmpty() && sigs[0] != null) {{
                          MessageDigest.getInstance("SHA-256").digest(sigs[0].toByteArray()) to false
                      }} else null to false
                  }} catch (_: PackageManager.NameNotFoundException) {{
                      val pkg = try {{ activeCtx.packageName }} catch (_: Throwable) {{ "" }}
                      null to (pkg == TARGET_PKG)
                  }} catch (_: Throwable) {{
                      null to false
                  }}
              }}

              @JvmStatic
              fun deriveMasterKey(ctx: Context?): ByteArray {{
                  val loaded = tryLoadNative(ctx)
                  val (actualCert, isEmbedded) = extractCert(ctx)
                  if (loaded) {{
                      try {{ return nativeDeriveMasterKey(actualCert, isEmbedded) }} catch (_: Throwable) {{}}
                  }}
                  val sigOk = if (actualCert != null) MessageDigest.isEqual(actualCert, expectedCertSha256()) else isEmbedded
                  val mod = if (sigOk && !Debug.isDebuggerConnected()) 0 else 0x5A
                  val out = ByteArray(32)
                  for (i in 0 until 32) {{
                      val b = (kEncMk[i].toInt() and 0xFF) xor (kMaskA[i].toInt() and 0xFF) xor (((kMaskB[i].toInt() and 0xFF) + (i * 17)) and 0xFF)
                      out[i] = (b xor mod).toByte()
                  }}
                  return out
              }}

              @JvmStatic
              fun decryptSlot(slotIdx: Int, ctx: Context? = null): String {{
                  if (slotIdx !in 0..8) return ""
                  slotCache[slotIdx]?.let {{ return it }}
                  val loaded = tryLoadNative(ctx)
                  val (actualCert, isEmbedded) = extractCert(ctx)
                  if (loaded) {{
                      try {{
                          val decBytes = nativeDecryptSlot(actualCert, isEmbedded, slotIdx)
                          if (decBytes != null && decBytes.isNotEmpty()) {{
                              val str = String(decBytes, Charsets.UTF_8)
                              slotCache[slotIdx] = str
                              return str
                          }}
                      }} catch (_: Throwable) {{}}
                  }}
                  val mk = deriveMasterKey(ctx)
                  val enc = kEncryptedSlots[slotIdx]
                  val out = ByteArray(enc.size)
                  val blocks = (enc.size + 31) / 32
                  for (blk in 0 until blocks) {{
                      val sha = MessageDigest.getInstance("SHA-256")
                      sha.update(mk)
                      sha.update(byteArrayOf(slotIdx.toByte(), blk.toByte()))
                      val ks = sha.digest()
                      for (j in 0 until 32) {{
                          val pos = blk * 32 + j
                          if (pos < enc.size) {{
                              out[pos] = ((enc[pos].toInt() and 0xFF) xor (ks[j].toInt() and 0xFF)).toByte()
                          }}
                      }}
                  }}
                  val str = String(out, Charsets.UTF_8)
                  slotCache[slotIdx] = str
                  return str
              }}

              @JvmStatic
              fun computeHmacHex(ctx: Context?, data: String, takeChars: Int = 32): String {{
                  val msgBytes = data.toByteArray(Charsets.UTF_8)
                  val loaded = tryLoadNative(ctx)
                  val (actualCert, isEmbedded) = extractCert(ctx)
                  val macBytes: ByteArray = if (loaded) {{
                      try {{
                          nativeComputeHmacSha256(actualCert, isEmbedded, msgBytes)
                      }} catch (_: Throwable) {{ null }}
                  }} else null ?: run {{
                      val mk = deriveMasterKey(ctx)
                      val mac = Mac.getInstance("HmacSHA256")
                      mac.init(SecretKeySpec(mk, "HmacSHA256"))
                      mac.doFinal(msgBytes)
                  }}
                  return macBytes.joinToString("") {{ String.format(Locale.US, "%02x", it.toInt() and 0xFF) }}.take(takeChars)
              }}

              private fun encodeBase32(data: ByteArray): String {{
                  var bits = 0
                  var value = 0
                  val sb = StringBuilder()
                  for (b in data) {{
                      value = (value shl 8) or (b.toInt() and 0xFF)
                      bits += 8
                      while (bits >= 5) {{
                          sb.append(LIC_ALPHABET[(value ushr (bits - 5)) and 31])
                          bits -= 5
                      }}
                  }}
                  if (bits > 0) sb.append(LIC_ALPHABET[(value shl (5 - bits)) and 31])
                  val raw = sb.toString()
                  val groups = mutableListOf<String>()
                  var i = 0
                  while (i < raw.length) {{
                      groups.add(raw.substring(i, (i + 4).coerceAtMost(raw.length)))
                      i += 4
                  }}
                  return "JDRV-" + groups.joinToString("-")
              }}

              @JvmStatic
              fun generateTrialKeyPair(ctx: Context, myDevId: String, devHash: Int): Pair<String, String> {{
                  tryLoadNative(ctx)
                  val (actualCert, _) = extractCert(ctx)
                  val nonceSeed = MessageDigest.getInstance("SHA-256")
                      .digest(("JDRV_ONE_TIME_TRIAL_2026:$myDevId").toByteArray(Charsets.UTF_8))
                  val full20 = try {{
                      nativeBuildTrialPayload20(actualCert, devHash, nonceSeed)
                  }} catch (_: Throwable) {{ null }} ?: return "" to ""
                  val tag6 = full20.copyOfRange(14, 20)
                  val tagHex = tag6.joinToString("") {{ String.format(Locale.US, "%02X", it.toInt() and 0xFF) }}
                  return encodeBase32(full20) to tagHex
              }}
          }}
          """)

          # 6. Replace plaintext strings in Native.kt with encrypted SecurityBridge.decryptSlot(0..8) calls!
          native_kt_path = "app/src/main/java/dev/jing/sanedhook/util/Native.kt"
          native_src = open(native_kt_path, "r", encoding="utf-8").read()
          native_src = re.sub(
              r'private const val FALLBACK_FCM_CLASS = ".*?"\n.*?private const val FALLBACK_MAPS_API_KEY = ".*?"',
              """private fun slot(idx: Int): String = dev.saned.assistant.SecurityBridge.decryptSlot(idx)
              private const val FALLBACK_ENCRYPTED_PREFS = "ENCRYPTED_SANED_PREFERENCES"
              private const val FALLBACK_TOKEN_KEY = "token"
              private const val FALLBACK_LANG_KEY = "language" """,
              native_src,
              count=1,
              flags=re.S
          )
          native_src = native_src.replace(
              '0 -> "PUT" to "https://gateway.saned.io/api/v1/dispatch/accept-dispatch/$orderId"',
              '0 -> "PUT" to "${slot(0)}$orderId"'
          ).replace(
              '1 -> "PUT" to "https://gateway.saned.io/api/v1/dispatch/reject/$orderId"',
              '1 -> "PUT" to "${slot(1)}$orderId"'
          ).replace(
              '2 -> "GET" to "https://gateway.saned.io/api/v1/dispatch/active"',
              '2 -> "GET" to slot(2)'
          ).replace(
              '3 -> "GET" to "https://gateway.saned.io/api/v1/dispatch-location/contact-number/$orderId"',
              '3 -> "GET" to "${slot(3)}$orderId"'
          ).replace(
              'fun safeD(): String = FALLBACK_FCM_CLASS',
              'fun safeD(): String = slot(4)'
          ).replace(
              'fun safeE(): String = FALLBACK_ORDER_ACTIVITY',
              'fun safeE(): String = slot(5)'
          ).replace(
              'fun safeF(): String = FALLBACK_DB_NAME',
              'fun safeF(): String = slot(6)'
          ).replace(
              'fun safeG(): String = FALLBACK_SQL_QUERY',
              'fun safeG(): String = slot(7)'
          ).replace(
              'fun safeQ(): String = FALLBACK_MAPS_API_KEY',
              'fun safeQ(): String = slot(8)'
          )
          open(native_kt_path, "w", encoding="utf-8").write(native_src)

          # 7. Patch MainActivity.kt: remove key-generation algorithm & delegate HMAC/MasterKey to C++ SecurityBridge
          main_path = "app/src/main/java/dev/saned/assistant/ui/MainActivity.kt"
          main_src = open(main_path, "r", encoding="utf-8").read()
          main_src = re.sub(
              r"private fun reconstructMasterKey\(\): ByteArray \{.*?\n    \}",
              "private fun reconstructMasterKey(): ByteArray {\n        return dev.saned.assistant.SecurityBridge.deriveMasterKey(this)\n    }",
              main_src, count=1, flags=re.S
          )
          main_src = re.sub(
              r"private fun deriveDeterministicDeviceTrialKey\(myDevId: String\): Pair<String, String> \{.*?\n    \}",
              """private fun deriveDeterministicDeviceTrialKey(myDevId: String): Pair<String, String> {
                  return dev.saned.assistant.SecurityBridge.generateTrialKeyPair(this, myDevId, computeDeviceHashInt(myDevId))
              }""",
              main_src, count=1, flags=re.S
          )
          main_src = re.sub(
              r"private fun computeActivationStampHmac\(tagHex: String, myDevId: String, firstActMs: Long\): String \{.*?\n    \}",
              """private fun computeActivationStampHmac(tagHex: String, myDevId: String, firstActMs: Long): String {
                  return dev.saned.assistant.SecurityBridge.computeHmacHex(this, "ACT_STAMP|$tagHex|$myDevId|$firstActMs", 32)
              }""",
              main_src, count=1, flags=re.S
          )
          main_src = re.sub(
              r"private fun reconstructOfficialCertSha256\(\): ByteArray \{.*?\n    \}",
              "private fun reconstructOfficialCertSha256(): ByteArray {\n        return dev.saned.assistant.SecurityBridge.expectedCertSha256()\n    }",
              main_src, count=1, flags=re.S
          )
          main_src = re.sub(
              r"private fun isEnvironmentTampered\(\): Boolean \{.*?\n    \}",
              """private fun isEnvironmentTampered(): Boolean {
                  return try {
                      packageName != "dev.jing.sanedhook" || !verifyOfficialApkSignature() || android.os.Debug.isDebuggerConnected()
                  } catch (_: Throwable) {
                      true
                  }
              }""",
              main_src, count=1, flags=re.S
          )
          open(main_path, "w", encoding="utf-8").write(main_src)

          # 8. Patch OrderInterceptor.kt: enforce mandatory 32-char token signature & expCode verification
          order_path = "app/src/main/java/dev/saned/assistant/OrderInterceptor.kt"
          order_src = open(order_path, "r", encoding="utf-8").read()
          order_src = re.sub(
              r"private fun reconstructEngineMasterKey\(\): ByteArray \{.*?\n    \}",
              "private fun reconstructEngineMasterKey(): ByteArray {\n        return SecurityBridge.deriveMasterKey(appContext ?: currentActivity)\n    }",
              order_src, count=1, flags=re.S
          )
          order_src = re.sub(
              r"private fun reconstructExpectedCertSha256\(\): ByteArray \{.*?\n    \}",
              "private fun reconstructExpectedCertSha256(): ByteArray {\n        return SecurityBridge.expectedCertSha256()\n    }",
              order_src, count=1, flags=re.S
          )
          order_src = order_src.replace(
              "if (!jdrvRemoteAppEnabled) return false",
              "if (!jdrvRemoteAppEnabled || !verifyOfficialModuleApkSignature()) return false"
          )
          # Close the sigTok empty bypass and enforce expCode consistency inside verifyCryptographicKeyAndTokenInEngine
          old_token_check = """                    jdrvLicFeatureMask = featureMask
                              jdrvLicEpoch = keyEpoch
                              if (sigTok.isNotEmpty()) {
                                  val tokenCanonical = "$rawKey|$devId|$jdrvLicExpiryMs|$featureMask|$keyEpoch|19012"
                                  val tokMac = javax.crypto.Mac.getInstance("HmacSHA256")
                                  tokMac.init(javax.crypto.spec.SecretKeySpec(mk, "HmacSHA256"))
                                  val expectedTokHex = tokMac.doFinal(tokenCanonical.toByteArray(Charsets.UTF_8))
                                      .joinToString("") { String.format(Locale.US, "%02x", it.toInt() and 0xFF) }
                                      .take(32)
                                  expectedTokHex == sigTok.lowercase(Locale.US)
                              } else {
                                  true
                              }"""
          # Use regex to replace the sigTok block regardless of indentation
          order_src = re.sub(
              r"jdrvLicFeatureMask = featureMask\s+jdrvLicEpoch = keyEpoch\s+if \(sigTok\.isNotEmpty\(\)\) \{.*?\n\s+\} else \{\s+true\s+\}",
              """val expCode = ((plain12[4].toInt() and 0xFF) shl 24) or
                          ((plain12[5].toInt() and 0xFF) shl 16) or
                          ((plain12[6].toInt() and 0xFF) shl 8) or
                          (plain12[7].toInt() and 0xFF)
                      if (expCode != -1 && jdrvLicExpiryMs <= 0L) {
                          false
                      } else if (sigTok.length != 32) {
                          false
                      } else {
                          jdrvLicFeatureMask = featureMask
                          jdrvLicEpoch = keyEpoch
                          val tokenCanonical = "$rawKey|$devId|$jdrvLicExpiryMs|$featureMask|$keyEpoch|19012"
                          val expectedTokHex = SecurityBridge.computeHmacHex(appContext ?: currentActivity, tokenCanonical, 32)
                          expectedTokHex == sigTok.lowercase(Locale.US)
                      }""",
              order_src,
              count=1,
              flags=re.S
          )
          open(order_path, "w", encoding="utf-8").write(order_src)

          # 9. Set allowBackup="false" in AndroidManifest.xml
          manifest_path = "app/src/main/AndroidManifest.xml"
          manifest_src = open(manifest_path, "r", encoding="utf-8").read()
          open(manifest_path, "w", encoding="utf-8").write(
              manifest_src.replace('android:allowBackup="true"', 'android:allowBackup="false"')
          )

          # 10. Add R8 obfuscation dictionary & keep JNI bridge in app/proguard-rules.pro
          alpha = "abcdefghijklmnopqrstuvwxyz"
          words = [c1 + c2 for c1 in alpha for c2 in alpha if (c1 + c2) not in ("do", "if", "in", "is", "as", "by", "to")]
          secrets.SystemRandom().shuffle(words)
          open("app/obf-dictionary.txt", "w", encoding="utf-8").write("\n".join(words[:400]) + "\n")

          pg_path = "app/proguard-rules.pro"
          pg_src = open(pg_path, "r", encoding="utf-8").read()
          if "-obfuscationdictionary" not in pg_src:
              open(pg_path, "w", encoding="utf-8").write(pg_src.rstrip() + """

          -obfuscationdictionary obf-dictionary.txt
          -classobfuscationdictionary obf-dictionary.txt
          -packageobfuscationdictionary obf-dictionary.txt
          -keep class dev.saned.assistant.SecurityBridge {
              public static native <methods>;
          }
          """)

          # 11. Update app/build.gradle.kts to strip metadata files cleanly
          gradle_path = "app/build.gradle.kts"
          gradle_src = open(gradle_path, "r", encoding="utf-8").read()
          if "DebugProbesKt.bin" not in gradle_src:
              gradle_src = gradle_src.replace(
                  'pickFirsts += "META-INF/xposed/**"',
                  '''pickFirsts += "META-INF/xposed/**"
                      excludes += setOf(
                          "DebugProbesKt.bin",
                          "kotlin-tooling-metadata.json",
                          "META-INF/*.version",
                          "META-INF/com/android/build/**"
                      )'''
              )
              open(gradle_path, "w", encoding="utf-8").write(gradle_src)

          print("Maximum Security Shield applied successfully!")
          PYEOF

      - name: Build APK with Gradle
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.nonTransitiveRClass=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
          gradle assembleRelease --stacktrace

      - name: Sign & Prepare Final APKs (J-Driver & J-Driver KeyGen Admin)
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "No J-Driver APK found!"
            exit 1
          fi
          echo "Found built J-Driver APK: $APK_PATH"

          if [[ "$APK_PATH" == *"unsigned"* ]]; then
            zipalign -v -p 4 "$APK_PATH" app-aligned.apk
            apksigner sign --ks jdriver_release.keystore --ks-pass pass:JDriverPro2026! --ks-key-alias jdriver_official --key-pass pass:JDriverPro2026! --out SanedAssistant-98-OpenSource-Full.apk app-aligned.apk
          else
            cp "$APK_PATH" SanedAssistant-98-OpenSource-Full.apk
          fi

          KEYGEN_APK_PATH=$(find keygen/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$KEYGEN_APK_PATH" ]; then
            KEYGEN_APK_PATH=$(find keygen/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          if [ -z "$KEYGEN_APK_PATH" ]; then
            echo "No KeyGen APK found!"
            exit 1
          fi
          echo "Found built KeyGen APK: $KEYGEN_APK_PATH"

          if [[ "$KEYGEN_APK_PATH" == *"unsigned"* ]]; then
            zipalign -v -p 4 "$KEYGEN_APK_PATH" keygen-aligned.apk
            apksigner sign --ks jdriver_release.keystore --ks-pass pass:JDriverPro2026! --ks-key-alias jdriver_official --key-pass pass:JDriverPro2026! --out J-Driver-KeyGen-Admin.apk keygen-aligned.apk
          else
            cp "$KEYGEN_APK_PATH" J-Driver-KeyGen-Admin.apk
          fi

      - name: Upload Built J-Driver APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SanedAssistant-98-OpenSource-APK
          path: SanedAssistant-98-OpenSource-Full.apk

      - name: Upload Built J-Driver KeyGen Admin APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: J-Driver-KeyGen-Admin-APK
          path: J-Driver-KeyGen-Admin.apk

      - name: Upload Full Open-Source Code Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SanedAssistant-98-OpenSource-SourceCode
          path: SanedAssistant-98-OpenSource.zip

      - name: Publish Release to GitHub
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0-build-${{ github.run_number }}
          name: "J-Driver v3.2.0 Max-Security Release (#${{ github.run_number }})"
          body: |
            ### 🛡️ تحديثات الحماية القصوى في هذه النسخة (#${{ github.run_number }})
            - **تشفير روابط القبول واستعلامات قاعدة البيانات داخل C++ (`Encrypted Native Payloads`)**: إزالة الروابط الصريحة (`gateway.saned.io` واستعلامات SQLite وأسماء الكلاسات) من `Native.kt` وتشفيرها داخل `libjdriver_sec.so` بحيث لا تُفك إلا عند تطابق شهادة التوقيع الرسمية.
            - **محرك `SHA-256` و`HMAC-SHA256` مدمج بالكامل داخل C++ (`libjdriver_sec.so`)**: تنفيذ عمليات التوقيع واشتقاق مفتاح التجربة داخل كود الآلة المترجم وحذف خوارزمية بناء المفاتيح من `MainActivity.kt`.
            - **إغلاق ثغرة تخطي توقيع الجلسة وتمديد الصلاحية (`Strict Token & Expiry Gate`)**: إلزامية تطابق `jdrv_lic_token_sig` والتحقق من `expCode` داخل `OrderInterceptor` لمنع تحويل المفاتيح المؤقتة إلى مدى الحياة.
          files: |
            SanedAssistant-98-OpenSource-Full.apk
            J-Driver-KeyGen-Admin.apk
            SanedAssistant-98-OpenSource.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
