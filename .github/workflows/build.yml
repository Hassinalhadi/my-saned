name: Android CI & Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Decompile APK to Open-Source, Sync 100% Parity & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Install Android Build & Decompilation Tools (JADX + Apktool)
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner apktool zip unzip wget curl python3

          # Install JADX 1.5.0 from GitHub Releases (fault-tolerant)
          if curl -fsSL https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip -o /tmp/jadx.zip; then
            sudo mkdir -p /opt/jadx
            sudo unzip -q -o /tmp/jadx.zip -d /opt/jadx
            sudo chmod +x /opt/jadx/bin/jadx || true
          fi

      - name: Decompile SanedAssistant-98-7bac1ec.apk into Full Open-Source Export
        run: |
          mkdir -p SanedAssistant-98-OpenSource
          if [ -f "SanedAssistant-98-7bac1ec.apk" ]; then
            if [ -x "/opt/jadx/bin/jadx" ]; then
              /opt/jadx/bin/jadx --export-gradle --deobf --show-bad-code \
                -d SanedAssistant-98-OpenSource/jadx-gradle-project \
                SanedAssistant-98-7bac1ec.apk || true
            fi
            apktool d -f SanedAssistant-98-7bac1ec.apk \
              -o SanedAssistant-98-OpenSource/apktool-exact || unzip -q -o SanedAssistant-98-7bac1ec.apk -d SanedAssistant-98-OpenSource/apk-unpacked
          fi

      - name: Sync 100% SanedAssistant-98 Parity + Live Crash & Hook Diagnostic Log Window
        run: |
          python3 - << 'PYEOF'
          import os, re, zipfile, struct

          def replace_block(src, start_marker, end_marker, replacement):
              i1 = src.find(start_marker)
              i2 = src.find(end_marker, i1 if i1 != -1 else 0)
              if i1 != -1 and i2 != -1 and i2 > i1:
                  return src[:i1] + replacement + "\n\n    " + src[i2:]
              return src

          # 1. Extract original icons (DQ.jpg, ZI.png, iQ.png) from SanedAssistant-98-7bac1ec.apk and remove any stale jniLibs
          if os.path.exists("app/src/main/jniLibs"):
              import shutil
              shutil.rmtree("app/src/main/jniLibs", ignore_errors=True)
          apk_path = "SanedAssistant-98-7bac1ec.apk"
          if os.path.exists(apk_path):
              os.makedirs("app/src/main/res/drawable", exist_ok=True)
              with zipfile.ZipFile(apk_path, "r") as zf:
                  names = set(zf.namelist())
                  if "res/DQ.jpg" in names:
                      open("app/src/main/res/drawable/ic_launcher_original.jpg", "wb").write(zf.read("res/DQ.jpg"))
                  if "res/ZI.png" in names:
                      open("app/src/main/res/drawable/ic_notif_original.png", "wb").write(zf.read("res/ZI.png"))
                  if "res/iQ.png" in names:
                      open("app/src/main/res/drawable/ic_badge_original.png", "wb").write(zf.read("res/iQ.png"))
              print("Extracted original icons (DQ.jpg, ZI.png, iQ.png)")

          # 1B. Update AndroidManifest.xml & NotificationHelper.kt to use original icons and register ACTION_DIAG_LOG
          manifest_path = "app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              mf = open(manifest_path).read()
              mf = mf.replace("@android:drawable/sym_def_app_icon", "@drawable/ic_launcher_original")
              if "dev.saned.assistant.ACTION_DIAG_LOG" not in mf:
                  mf = mf.replace(
                      '<action android:name="dev.saned.assistant.ACTION_LOG_ORDER" />',
                      '<action android:name="dev.saned.assistant.ACTION_LOG_ORDER" />\n                <action android:name="dev.saned.assistant.ACTION_DIAG_LOG" />'
                  )
              open(manifest_path, "w").write(mf)

          def write_kt(path, text):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(text)

          write_kt('app/src/main/java/dev/jing/sanedhook/util/Native.kt', r'''package dev.jing.sanedhook.util

          object Native {
              @JvmField val a: Native = this
              @Volatile var isLoaded: Boolean = true
                  private set

              external fun a(ctx: Any, pkg: String): Boolean
              external fun b(kind: Int, orderId: Int, token: String, lang: String, driverCipher: String): Array<String>
              external fun c(ctx: Any, pkg: String, s1: String, s2: String, v: Long): Int
              external fun d(): String
              external fun e(): String
              external fun f(): String
              external fun g(): String
              external fun h(): String
              external fun i(): String
              external fun j(): String
              external fun k(): Array<String>
              external fun l(): Array<String>
              external fun m(): Array<String>
              external fun n(): Array<String>
              external fun o(s: String): String
              external fun p(): Array<String>
              external fun q(): String
              external fun r(path: String): Boolean
              external fun s(versionCode: Long): Int
              external fun t(): Array<String>
              external fun u(): Array<String>

              private const val FALLBACK_FCM_CLASS = "net.saned.core.SanedFCMNotificationHandler"
              private const val FALLBACK_ORDER_ACTIVITY = "net.jahez.fleets.dispatch.accept.IncomingDispatchActivity"
              private const val FALLBACK_DB_NAME = "dispatches_db"
              private const val FALLBACK_SQL_QUERY =
                  "SELECT di.dispatchId, di.referenceId, di.status, v.vendorName, c.subscriberName, NULL, c.clientPhone, " +
                  "l.pickupLatitude, l.pickupLongitude, l.destinationLatitude, l.destinationLongitude, l.distance, " +
                  "p.deliveryPrice, p.collectionAmount, p.currencyCode, p.paymentMethod, a.buildingName, a.buildingNumber, " +
                  "a.houseNumber, a.streetName, a.roadNumber, a.blockNumber, a.apartmentNumber, a.floor, a.lane, " +
                  "a.officeName, a.region, a.additionalInformation FROM dispatch_info di " +
                  "LEFT JOIN vendor v ON v.dispatchId = di.dispatchId LEFT JOIN client c ON c.dispatchId = di.dispatchId " +
                  "LEFT JOIN location l ON l.dispatchId = di.dispatchId LEFT JOIN payment p ON p.dispatchId = di.dispatchId " +
                  "LEFT JOIN address a ON a.dispatchId = di.dispatchId"
              private const val FALLBACK_ENCRYPTED_PREFS = "ENCRYPTED_SANED_PREFERENCES"
              private const val FALLBACK_TOKEN_KEY = "token"
              private const val FALLBACK_LANG_KEY = "language"

              private val FALLBACK_INTENT_KEYS = arrayOf(
                  "EXTRA_DISPATCH_REQUEST_ID", "EXTRA_DISPATCH_PICKUP_LATITUDE", "EXTRA_DISPATCH_PICKUP_LONGITUDE",
                  "EXTRA_DISPATCH_DEST_LATITUDE", "EXTRA_DISPATCH_DEST_LONGITUDE", "EXTRA_DELIVERY_PRICE",
                  "EXTRA_DISPATCH_TYPE", "EXTRA_DISTANCE", "EXTRA_COUNTER", "EXTRA_SUBSCRIBER_NAME",
                  "EXTRA_BONUS_AMOUNT", "EXTRA_CURRENCY"
              )
              private val FALLBACK_FCM_KEYS = arrayOf(
                  "requestId", "dispatchPickupLat", "dispatchPickupLng", "dispatchDestLat", "dispatchDestLng",
                  "deliveryPrice", "dispatchType", "distance", "counter", "subscriberName", "vendorName",
                  "restaurantName", "storeName", "bonus", "bonusAmount", "extraBonus", "currency", "currencyCode"
              )
              private val FALLBACK_POLL_KEYS = arrayOf(
                  "dispatches", "referenceId", "pickup", "coordinates", "destination", "clientPhone", "contactNumber"
              )
              private val FALLBACK_SECURITY_CLASSES = arrayOf(
                  "net.jahez.guardzilla.logging.domain.model.SecurityCallBacksState",
                  "com.scottyab.rootbeer.RootBeer", "com.scottyab.rootbeer.RootBeerNative"
              )
              private val FALLBACK_VERSION_PROFILES = arrayOf(
                  "jahez_fleets", "ggk.am", "ggk.P", "ggk.ar", "net.jahez.fleets.MainActivity", "ggk.z", "b", "loadLibrary0",
                  "jahez_fleets", "oxxqbaxw.an", "oxxqbaxw.e", "oxxqbaxw.ao", "net.jahez.fleets.MainActivity", "oxxqbaxw.b", "a", "loadLibrary0",
                  "jahez_fleets", "lrbppeks.U", "lrbppeks.b", "lrbppeks.ak", "net.jahez.fleets.MainActivity", "lrbppeks.am", "a", "loadLibrary0"
              )
              private val FALLBACK_GUARD_CLASSES = arrayOf(
                  "S86", "yM", "ta3", "xD", "cj6", "tEa", "Ke0", "MV5", "XS", "wRa", "A76", "gM", "B93", "fD", "Jh6"
              )
              private val FALLBACK_FEATURE_FLAGS = arrayOf(
                  "rooted_device_check", "auto_clicker_check", "installation_source_check"
              )

              fun safeA(ctx: Any, pkg: String = "dev.jing.sanedhook"): Boolean = true

              fun safeB(kind: Int, orderId: Int, token: String, lang: String, driverCipher: String): Array<String> {
                  val cleanTok = if (token.startsWith("Bearer ", ignoreCase = true)) token.substring(7).trim() else token.trim()
                  val cleanLang = lang.trim().ifEmpty { "en" }
                  val (method, url) = when (kind) {
            0 -> "PUT" to "https://gateway.saned.io/api/v1/dispatch/accept-dispatch/$orderId"
            1 -> "PUT" to "https://gateway.saned.io/api/v1/dispatch/reject/$orderId"
            2 -> "GET" to "https://gateway.saned.io/api/v1/dispatch/active"
            3 -> "GET" to "https://gateway.saned.io/api/v1/dispatch-location/contact-number/$orderId"
            else -> return emptyArray()
                  }
                  val list = mutableListOf(
            method, url,
            "Authorization", "Bearer $cleanTok",
            "Accept-Language", cleanLang,
            "User-Agent", "okhttp/5.1.0"
                  )
                  if (driverCipher.isNotEmpty()) {
            list.add("x-unique-Identifier")
            list.add(driverCipher)
                  }
                  return list.toTypedArray()
              }

              fun safeC(ctx: Any, pkg: String, s1: String, s2: String, v: Long): Int = 1
              fun safeD(): String = FALLBACK_FCM_CLASS
              fun safeE(): String = FALLBACK_ORDER_ACTIVITY
              fun safeF(): String = FALLBACK_DB_NAME
              fun safeG(): String = FALLBACK_SQL_QUERY
              fun safeH(): String = FALLBACK_ENCRYPTED_PREFS
              fun safeI(): String = FALLBACK_TOKEN_KEY
              fun safeJ(): String = FALLBACK_LANG_KEY
              fun safeK(): Array<String> = FALLBACK_INTENT_KEYS
              fun safeL(): Array<String> = FALLBACK_FCM_KEYS
              fun safeM(): Array<String> = FALLBACK_POLL_KEYS
              fun safeN(): Array<String> = FALLBACK_SECURITY_CLASSES
              fun safeO(s: String): String = ""
              fun safeP(): Array<String> = FALLBACK_VERSION_PROFILES
              fun safeQ(): String = ""
              fun safeR(path: String): Boolean = true
              fun safeS(versionCode: Long): Int = when (versionCode) {
                  40093L -> 0
                  40099L -> 1
                  40089L -> 2
                  else -> -1
              }
              fun safeT(): Array<String> = FALLBACK_GUARD_CLASSES
              fun safeU(): Array<String> = FALLBACK_FEATURE_FLAGS
          }
          ''')


          write_kt('app/src/main/java/dev/saned/assistant/DeviceSpoofer.kt', r'''package dev.saned.assistant

          import android.content.ContentResolver
          import android.content.SharedPreferences
          import android.provider.Settings
          import io.github.libxposed.api.XposedInterface
          import io.github.libxposed.api.XposedModule
          import org.json.JSONObject
          import java.io.File

          object DeviceSpoofer {

              @Volatile var isMasterRunning: Boolean = true
              @Volatile var isSpoofAndroidId: Boolean = false
              @Volatile var spoofedAndroidId: String = ""

              private var remotePrefs: SharedPreferences? = null

              fun initRemotePrefs(prefs: SharedPreferences) {
                  remotePrefs = prefs
                  syncFromPrefs()
                  try {
            prefs.registerOnSharedPreferenceChangeListener { _, _ ->
                syncFromPrefs()
            }
                  } catch (_: Throwable) {}
              }

              private fun syncFromPrefs() {
                  remotePrefs?.let { p ->
            isMasterRunning = p.getBoolean("master_running", p.getBoolean("enabled", isMasterRunning))
            isSpoofAndroidId = p.getBoolean("spoof_android_id", isSpoofAndroidId)
            val sId = p.getString("spoofed_android_id", "")?.trim() ?: ""
            if (sId.isNotEmpty()) spoofedAndroidId = sId
                  }
              }

              fun syncSettings(resolver: ContentResolver? = null) {
                  syncFromPrefs()
                  try {
            val f = File("/data/local/tmp/saned_config.json")
            if (f.exists()) {
                val json = JSONObject(f.readText())
                isMasterRunning = json.optBoolean("master_running", json.optBoolean("enabled", isMasterRunning))
                isSpoofAndroidId = json.optBoolean("spoof_android_id", isSpoofAndroidId)
                val sId = json.optString("spoofed_android_id", "").trim()
                if (sId.isNotEmpty()) spoofedAndroidId = sId
            }
                  } catch (_: Throwable) {}
              }

              fun getEffectiveAndroidId(resolver: ContentResolver? = null): String {
                  val clean = spoofedAndroidId.trim()
                  return if (clean.isNotEmpty()) clean else "7a8b9c0d1e2f3456"
              }

              /**
               * Matches Lly1.b in SanedAssistant-98-7bac1ec.apk:
               * Hooks ONLY Settings.Secure.getString(ContentResolver, String) and returns in-memory spoofedAndroidId.
               */
              fun hook(module: XposedModule, classLoader: ClassLoader) {
                  try {
            val mGetString = Settings.Secure::class.java.getDeclaredMethod(
                "getString",
                ContentResolver::class.java,
                String::class.java
            )
            module.hook(mGetString).intercept(object : XposedInterface.Hooker {
                override fun intercept(chain: XposedInterface.Chain): Any? {
                    val key = chain.args.getOrNull(1) as? String
                    if ("android_id" == key && isMasterRunning && isSpoofAndroidId && spoofedAndroidId.isNotEmpty()) {
                        return spoofedAndroidId
                    }
                    return chain.proceed()
                }
            })
                  } catch (_: Throwable) {}
              }
          }
          ''')


          write_kt('app/src/main/java/dev/saned/assistant/DiagnosticLogger.kt', r'''package dev.saned.assistant

          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.net.Uri
          import android.os.Bundle
          import android.os.Process
          import android.util.Log
          import io.github.libxposed.api.XposedInterface
          import io.github.libxposed.api.XposedModule
          import org.json.JSONObject
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.concurrent.ConcurrentLinkedQueue
          import java.util.concurrent.atomic.AtomicBoolean

          object DiagnosticLogger {

              private const val TAG = "SanedDiag"
              private const val PROVIDER_URI = "content://dev.jing.sanedhook.XposedService"
              private const val ASSISTANT_PKG = "dev.jing.sanedhook"
              private const val RECEIVER_CLS = "dev.saned.assistant.SanedReceiver"

              @Volatile var xposedModule: XposedModule? = null
              @Volatile var cachedContext: Context? = null

              // Per-Hook Group Isolation Toggles (Default TRUE)
              @Volatile var hookEarlyCloaker: Boolean = true
              @Volatile var hookSecCloaker: Boolean = true
              @Volatile var hookLocation: Boolean = true
              @Volatile var hookDeviceSpoofer: Boolean = true
              @Volatile var hookOrders: Boolean = true
              @Volatile var hookBootstrapLoop: Boolean = true

              private val isCrashHandlerInstalled = AtomicBoolean(false)
              private val isUncaughtSetterHooked = AtomicBoolean(false)
              private val isFlusherStarted = AtomicBoolean(false)
              private val logQueue = ConcurrentLinkedQueue<String>()

              private fun nowTime(): String = SimpleDateFormat("HH:mm:ss.SSS", Locale.US).format(Date())

              fun resolveAnyContext(): Context? {
                  cachedContext?.let { return it }
                  OrderInterceptor.resolveApplicationContext()?.let {
            cachedContext = it
            return it
                  }
                  return try {
            val atClass = Class.forName("android.app.ActivityThread")
            val currentAt = atClass.getMethod("currentActivityThread").invoke(null)
            val sysCtx = atClass.getMethod("getSystemContext").invoke(currentAt) as? Context
            if (sysCtx != null) cachedContext = sysCtx
            sysCtx
                  } catch (_: Throwable) { null }
              }

              fun syncHookToggles(module: XposedModule? = null, prefs: SharedPreferences? = null) {
                  if (module != null) xposedModule = module
                  try {
            val p = prefs ?: module?.getRemotePreferences("sanedhook_settings")
            if (p != null) {
                hookEarlyCloaker = p.getBoolean("hook_early_cloaker", hookEarlyCloaker)
                hookSecCloaker = p.getBoolean("hook_sec_cloaker", hookSecCloaker)
                hookLocation = p.getBoolean("hook_location", hookLocation)
                hookDeviceSpoofer = p.getBoolean("hook_device_spoofer", hookDeviceSpoofer)
                hookOrders = p.getBoolean("hook_orders", hookOrders)
                hookBootstrapLoop = p.getBoolean("hook_bootstrap_loop", hookBootstrapLoop)
            }
                  } catch (_: Throwable) {}

                  try {
            val f = File("/data/local/tmp/saned_config.json")
            if (f.exists()) {
                val j = JSONObject(f.readText())
                hookEarlyCloaker = j.optBoolean("hook_early_cloaker", hookEarlyCloaker)
                hookSecCloaker = j.optBoolean("hook_sec_cloaker", hookSecCloaker)
                hookLocation = j.optBoolean("hook_location", hookLocation)
                hookDeviceSpoofer = j.optBoolean("hook_device_spoofer", hookDeviceSpoofer)
                hookOrders = j.optBoolean("hook_orders", hookOrders)
                hookBootstrapLoop = j.optBoolean("hook_bootstrap_loop", hookBootstrapLoop)
            }
                  } catch (_: Throwable) {}

                  try {
            val ctx = resolveAnyContext()
            if (ctx != null) {
                val b = ctx.contentResolver.call(Uri.parse(PROVIDER_URI), "getSettings", null, null)
                if (b != null) {
                    hookEarlyCloaker = b.getBoolean("hook_early_cloaker", hookEarlyCloaker)
                    hookSecCloaker = b.getBoolean("hook_sec_cloaker", hookSecCloaker)
                    hookLocation = b.getBoolean("hook_location", hookLocation)
                    hookDeviceSpoofer = b.getBoolean("hook_device_spoofer", hookDeviceSpoofer)
                    hookOrders = b.getBoolean("hook_orders", hookOrders)
                    hookBootstrapLoop = b.getBoolean("hook_bootstrap_loop", hookBootstrapLoop)
                }
            }
                  } catch (_: Throwable) {}
              }

              fun installCrashHandler(module: XposedModule? = null, phase: String = "init") {
                  if (module != null) xposedModule = module
                  startAsyncFlusher()

                  try {
            val currentHandler = Thread.getDefaultUncaughtExceptionHandler()
            if (currentHandler !is SanedUncaughtHandler) {
                Thread.setDefaultUncaughtExceptionHandler(SanedUncaughtHandler(currentHandler))
            }
                  } catch (_: Throwable) {}

                  // Also hook Thread.setDefaultUncaughtExceptionHandler so Crashlytics/Sentry in Jahez cannot bypass our crash logger
                  if (module != null && isUncaughtSetterHooked.compareAndSet(false, true)) {
            try {
                val mSet = Thread::class.java.getDeclaredMethod(
                    "setDefaultUncaughtExceptionHandler",
                    Thread.UncaughtExceptionHandler::class.java
                )
                module.hook(mSet).intercept(object : XposedInterface.Hooker {
                    override fun intercept(chain: XposedInterface.Chain): Any? {
                        val newHandler = chain.args.getOrNull(0) as? Thread.UncaughtExceptionHandler
                        if (newHandler != null && newHandler !is SanedUncaughtHandler) {
                            val wrapped = SanedUncaughtHandler(newHandler)
                            return chain.proceed(arrayOf(wrapped))
                        }
                        return chain.proceed()
                    }
                })
            } catch (_: Throwable) {}
                  }

                  if (isCrashHandlerInstalled.compareAndSet(false, true)) {
            logStep("CRASH-GUARD", "UncaughtExceptionHandler active ($phase) pid=${Process.myPid()}")
                  }
              }

              private class SanedUncaughtHandler(
                  private val delegate: Thread.UncaughtExceptionHandler?
              ) : Thread.UncaughtExceptionHandler {
                  override fun uncaughtException(t: Thread, e: Throwable) {
            try {
                logCrash(t.name, e)
            } catch (_: Throwable) {}
            delegate?.uncaughtException(t, e)
                  }
              }

              fun logStep(section: String, message: String) {
                  enqueueLine("[${nowTime()}] [STEP] [$section] $message")
              }

              fun logWarn(section: String, message: String) {
                  enqueueLine("[${nowTime()}] [WARN] [$section] ⚠️ $message")
              }

              fun logError(section: String, message: String, t: Throwable? = null) {
                  val trace = if (t != null) {
            val lines = Log.getStackTraceString(t).lineSequence().take(8).joinToString("\n   ")
            "\n   $lines"
                  } else ""
                  enqueueLine("[${nowTime()}] [ERR] [$section] ❌ $message$trace")
              }

              fun logCrash(threadName: String, t: Throwable) {
                  val vCode = PackageCloaker.lastCheckedVersionCode
                  val profIdx = PackageCloaker.detectedVersionIndex
                  val stubbed = PackageCloaker.isNativeStubbedFlag()
                  val actName = OrderInterceptor.currentActivity?.javaClass?.name ?: "none"
                  val fullStack = Log.getStackTraceString(t)
                  val crashBlock = buildString {
            append("[${nowTime()}] [CRASH] 🚨 FATAL UNCAUGHT EXCEPTION in net.jahez.fleets!\n")
            append("   PID: ${Process.myPid()} | Thread: $threadName\n")
            append("   Jahez VersionCode: $vCode | ProfileIdx: $profIdx | NativeStubbed: $stubbed | Activity: $actName\n")
            append("   Exception: ${t.javaClass.name}: ${t.message}\n")
            append(fullStack.trimEnd())
                  }
                  try { Log.e(TAG, crashBlock) } catch (_: Throwable) {}
                  try { xposedModule?.log(Log.ERROR, TAG, crashBlock, t) } catch (_: Throwable) {}

                  // Flush queued logs + crash block synchronously on a helper thread with bounded timeout before process dies
                  val flushThread = Thread {
            try {
                val batch = StringBuilder()
                while (true) {
                    val item = logQueue.poll() ?: break
                    batch.append(item).append("\n")
                }
                batch.append(crashBlock)
                deliverToAssistantSync(batch.toString())
            } catch (_: Throwable) {}
                  }
                  flushThread.isDaemon = true
                  flushThread.start()
                  try { flushThread.join(900) } catch (_: Throwable) {}
              }

              private fun enqueueLine(line: String) {
                  try { Log.i(TAG, line) } catch (_: Throwable) {}
                  try { xposedModule?.log(Log.INFO, TAG, line) } catch (_: Throwable) {}
                  logQueue.offer(line)
                  startAsyncFlusher()
              }

              private fun startAsyncFlusher() {
                  if (!isFlusherStarted.compareAndSet(false, true)) return
                  Thread {
            while (true) {
                try {
                    val sb = StringBuilder()
                    var count = 0
                    while (count < 25) {
                        val item = logQueue.poll() ?: break
                        if (sb.isNotEmpty()) sb.append("\n")
                        sb.append(item)
                        count++
                    }
                    if (sb.isNotEmpty()) {
                        deliverToAssistantSync(sb.toString())
                    }
                } catch (_: Throwable) {}
                try { Thread.sleep(300) } catch (_: Throwable) { break }
            }
                  }.apply {
            isDaemon = true
            name = "Saned-Diag-Flusher"
            start()
                  }
              }

              private fun deliverToAssistantSync(textBlock: String) {
                  if (textBlock.isEmpty()) return
                  // 1. Write to fallback file if accessible
                  try {
            val f = File("/data/local/tmp/saned_diag.log")
            f.appendText(textBlock + "\n")
            f.setReadable(true, false)
            f.setWritable(true, false)
                  } catch (_: Throwable) {}

                  val ctx = resolveAnyContext() ?: return

                  // 2. Deliver via ContentProvider call (works even before Application.onCreate using systemContext!)
                  var deliveredViaProvider = false
                  try {
            val extras = Bundle().apply { putString("log_line", textBlock) }
            val res = ctx.contentResolver.call(Uri.parse(PROVIDER_URI), "appendDiagLog", textBlock, extras)
            if (res?.getBoolean("ok", false) == true) {
                deliveredViaProvider = true
            }
                  } catch (_: Throwable) {}

                  // 3. Deliver via explicit component Broadcast to SanedReceiver if provider call didn't succeed
                  if (!deliveredViaProvider) {
            try {
                val intent = Intent("dev.saned.assistant.ACTION_DIAG_LOG").apply {
                    setClassName(ASSISTANT_PKG, RECEIVER_CLS)
                    addFlags(Intent.FLAG_INCLUDE_STOPPED_PACKAGES)
                    putExtra("log_line", textBlock)
                }
                ctx.sendBroadcast(intent)
            } catch (_: Throwable) {}
                  }
              }
          }
