      - name: Build APK with Gradle
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.nonTransitiveRClass=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
          gradle assembleRelease --stacktrace || gradle assembleDebug --stacktrace

      - name: Commit Open-Source Parity Sync to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/ keygen/ settings.gradle.kts jdriver_control.json jdriver_release.keystore || true
          if ! git diff --cached --quiet; then
            git commit -m "feat: add J-Driver cryptographic licensing and KeyGen Admin APK [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Sign & Prepare Final APKs (J-Driver & J-Driver KeyGen Admin)
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "No J-Driver APK found!"
            exit 1
          fi
          echo "Found built J-Driver APK: $APK_PATH"

          if [[ "$APK_PATH" == *"unsigned"* ]]; then
            zipalign -v -p 4 "$APK_PATH" app-aligned.apk
            apksigner sign --ks jdriver_release.keystore --ks-pass pass:JDriverPro2026! --ks-key-alias jdriver_official --key-pass pass:JDriverPro2026! --out SanedAssistant-98-OpenSource-Full.apk app-aligned.apk
          else
            cp "$APK_PATH" SanedAssistant-98-OpenSource-Full.apk
          fi

          KEYGEN_APK_PATH=$(find keygen/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$KEYGEN_APK_PATH" ]; then
            KEYGEN_APK_PATH=$(find keygen/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          if [ -z "$KEYGEN_APK_PATH" ]; then
            echo "No KeyGen APK found!"
            exit 1
          fi
          echo "Found built KeyGen APK: $KEYGEN_APK_PATH"

          if [[ "$KEYGEN_APK_PATH" == *"unsigned"* ]]; then
            zipalign -v -p 4 "$KEYGEN_APK_PATH" keygen-aligned.apk
            apksigner sign --ks jdriver_release.keystore --ks-pass pass:JDriverPro2026! --ks-key-alias jdriver_official --key-pass pass:JDriverPro2026! --out J-Driver-KeyGen-Admin.apk keygen-aligned.apk
          else
            cp "$KEYGEN_APK_PATH" J-Driver-KeyGen-Admin.apk
          fi

      - name: Upload Built J-Driver APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SanedAssistant-98-OpenSource-APK
          path: SanedAssistant-98-OpenSource-Full.apk

      - name: Upload Built J-Driver KeyGen Admin APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: J-Driver-KeyGen-Admin-APK
          path: J-Driver-KeyGen-Admin.apk

      - name: Upload Full Open-Source Code Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SanedAssistant-98-OpenSource-SourceCode
          path: SanedAssistant-98-OpenSource.zip

      - name: Publish Release to GitHub
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0-build-${{ github.run_number }}
          name: "Saned Assistant v3.2.0 (Price Food on Accepted/Prepaid/Cash Orders + NavLog #${{ github.run_number }})"
          body: |
            ### التحديثات في هذه النسخة (إصلاح نظام الملاحة لمعرفة موقع العميل قبل استلام الطلب + سجل الملاحة `[NavLog]`)
            - **إصلاح نظام الملاحة والتوجيه إلى موقع العميل قبل استلام الطلب (`Before Pick Up`)**:
              1. **داخل تطبيق `Saned Assistant` (تبويب `Orders`)**: عرض إحداثيات منزل العميل (`📍 منزل العميل: lat, lng`) والمسافة من المطعم للعميل فور وصول الطلب أو قبوله (حتى قبل استلام الطلب عندما يكون العنوان مخفياً تحت `Location on map`)، مع زر **`Navigate ↗`** في خانة `Drop-off NEXT` يفتح خرائط Google مباشرة إلى موقع العميل (`destination = destLat,destLng`) وزر **`Navigate ↗`** في خانة `Pickup` يفتح موقع المطعم.
              2. **داخل تطبيق سند (`net.jahez.fleets`)**: عند الضغط على زر **`Navigate ↗`** قبل استلام الطلب، يظهر مربع اختيار فوري (`🧭 اختر وجهة التوجيه`) يتيح لك اختيار **`🏠 موقع العميل (قبل الاستلام)`** أو **`🏪 موقع المطعم`** مباشرة.
            - **إضافة قسم سجل الملاحة (`[NavLog]`) مع زر تصفية `🧭 سجل الملاحة` في تبويب `📋 Logs`**:
              - يسجل تلقائياً إحداثيات المطعم والعميل المستخرجة من إشعارات `FCM`، وفحص السيرفر `POLL`، وجدول `location` في قاعدة بيانات `dispatches_db`، وأي أمر `Navigate` يتم الضغط عليه داخل `net.jahez.fleets`.
            ### التحديثات السابقة (نافذة السجل التشخيصي المباشر + إصلاح جذري للكراش)
            - **إضافة نافذة سجل تشخيصي مباشر (`📋 Logs`) داخل التطبيق**:
              1. التقاط أي انهيار (`UncaughtException` / `Stacktrace`) داخل `net.jahez.fleets` لحظة حدوثه وإرساله فوراً إلى نافذة `📋 Logs` في `Saned Assistant` مع إمكانية النسخ أو التصفية.
              2. إضافة خيارات **عزل الـ Hooks (`Hook Isolation`)** داخل تبويب `📋 Logs` لتفعيل أو إيقاف أي مجموعة خطافات (`Early Native Cloaker`، `RootBeer/ShadowArmor`، `Location`، `Android ID`، `Order Hooks`، `Background Loop`) من الواجهة مباشرة.
            - **إصلاح الأسباب المتبقية للكراش عند فتح `net.jahez.fleets`**:
              1. إزالة مراقب الشاشة (`startScreenWatcher` / `scanAllRoots` / `WindowManagerGlobal`) من `onActivityResumed` الذي كان يفحص شجرة الواجهات على الـ UI Thread أثناء إقلاع جاهز.
              2. إزالة الفحص العشوائي لملفات `shared_prefs` (`scanJahezSharedPreferencesForToken`) و `scanExistingActivitiesInActivityThread` من حلقة الخلفية.
              3. التحقق من نجاح محاكاة الدوال الـ Native (`isNativeStubbed`) قبل منع تحميل `libjahez_fleets.so` لمنع خطأ `UnsatisfiedLinkError` إذا كان إصدار جاهز مختلفاً، وتشغيل دوال `Native.a..u` بلغة Kotlin مباشرة دون تحميل مكتبة خارجية داخل عملية جاهز.
          files: |
            SanedAssistant-98-OpenSource-Full.apk
            J-Driver-KeyGen-Admin.apk
            SanedAssistant-98-OpenSource.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
