name: Android CI & Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Maximum Security Hardening (C++ Crypto + Immortal Trial Vault + R8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Install Android Signing Tools (Quiet & Fast)
        run: |
          sudo apt-get update -qq > /dev/null 2>&1 || true
          sudo apt-get install -y -qq zipalign apksigner zip unzip python3 > /dev/null 2>&1 || true
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ -d "$SDK_DIR/build-tools" ]; then
            LATEST_BT=$(ls -d "$SDK_DIR/build-tools/"* 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$LATEST_BT" ]; then
              echo "$LATEST_BT" >> "$GITHUB_PATH"
            fi
          fi
          mkdir -p SanedAssistant-98-OpenSource

