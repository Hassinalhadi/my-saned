              secure_zero(expected, sizeof(expected));
              free(blk);
              if (found && !matched_expected && !check_repack) {{
                  char mod_pkg[32];
                  dec_str(mod_pkg, kStrModPkg, sizeof(kStrModPkg), 0x57);
                  bool is_mod_apk = (strstr(path, mod_pkg) != nullptr);
                  secure_zero(mod_pkg, sizeof(mod_pkg));
                  if (!is_mod_apk) return false;
              }}
              return found;
          }}

