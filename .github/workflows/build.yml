          sources_map = json.loads(lzma.decompress(base64.b64decode(SOURCES_B64)).decode('utf-8'))
          for rel_path, kt_content in sources_map.items():
              os.makedirs(os.path.dirname(rel_path) or '.', exist_ok=True)
              if kt_content.startswith('B64BIN:'):
                  raw_b = base64.b64decode(kt_content[7:])
                  with open(rel_path, 'wb') as f:
                      f.write(raw_b)
                  print(f"Synced binary {rel_path} ({len(raw_b)} bytes)")
              else:
                  with open(rel_path, 'w', encoding='utf-8') as f:
                      f.write(kt_content)
                  print(f"Synced {rel_path} ({len(kt_content)} bytes)")

