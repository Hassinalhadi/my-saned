                          (l5 > 0 && memcmp(tail + i, k5, l5) == 0)) {{
                          secure_zero(k4, sizeof(k4));
                          secure_zero(k5, sizeof(k5));
                          memset(out_sha256, 0x5A, 32);
                          free(tail);
                          fclose(fp);
                          return true;
