              uint8_t* blk = static_cast<uint8_t*>(malloc(sig_win));
              if (!blk) {{ fclose(fp); return false; }}
              if (fseek(fp, static_cast<long>(cd_offset - sig_win), SEEK_SET) != 0 ||
                  fread(blk, 1, sig_win, fp) != sig_win) {{
                  free(blk);
                  fclose(fp);
                  return false;
